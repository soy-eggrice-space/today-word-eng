plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def ksFile = file('today.keystore')
def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.dayeon.animalvillage'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dayeon.animalvillage.friends'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'today'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
