<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>솔정마을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap">
<style>
@font-face{font-family:'JuaLocal';src:url('fonts/Jua-Regular.ttf') format('truetype')}
@font-face{font-family:'FredokaLocal';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700}
/* 레이아웃: 한 화면에 한 가지 일만 — 플레이어 고르기 → 한글/영어 고르기 → 카드 퀴즈 → 마을 */
:root{
  --bg:#FFF6E9; --card:#FFFFFF; --ink:#5A3E72; --ink2:#9580AA; --soft:#FFFBF4;
  --sol:#8FD3FF; --solD:#4FA8E8; --jeong:#FF9EC9; --jeongD:#F06AAE;
  --lemon:#FFE074; --mint:#8AE5C6; --peach:#FFC1A0; --lilac:#CFB8FF;
  --okbg:#DDF8EC; --nobg:#FFE0EC; --skyband:#DDF1FF; --grass:#B6EEA4; --grass2:#9FE28E;
  --line:3px solid var(--ink); --pop:0 6px 0 var(--ink); --popS:0 4px 0 var(--ink);
  --fk:'JuaLocal','Jua','Noto Sans KR',system-ui,sans-serif; --fe:'FredokaLocal','Fredoka','JuaLocal',system-ui,sans-serif;
  --me:var(--sol); --meD:var(--solD);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--bg);color:var(--ink);font-family:var(--fk);font-size:20px;
  background-image:radial-gradient(circle at 20% 30%,#FFD9A8 0 3px,transparent 3.6px),radial-gradient(circle at 70% 65%,#C9E7FF 0 3px,transparent 3.6px),radial-gradient(circle at 45% 88%,#FFC9E3 0 2.6px,transparent 3.2px),radial-gradient(circle at 88% 12%,#C8F0D8 0 2.6px,transparent 3.2px);
  background-size:100px 100px;-webkit-user-select:none;user-select:none;
}
body.p-jeong{--me:var(--jeong);--meD:var(--jeongD)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--solD);outline-offset:3px}
.en{font-family:var(--fe);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.press{transition:transform .08s}
.press:active{transform:translateY(4px) scale(.98)}

/* 미리보기 조절 */
.demo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:2.5px dashed var(--ink2);border-radius:20px;padding:10px 14px;margin-bottom:18px;background:rgba(255,255,255,.7);font-size:16px;color:var(--ink2)}
.demo button{border:2px solid var(--ink);border-radius:999px;padding:5px 14px;background:#fff;color:var(--ink);font-size:16px}

/* 로고 */
.logo{display:flex;align-items:center;gap:12px;justify-content:center}
.logo .badge{width:70px;height:70px;border-radius:24px;border:var(--line);background:var(--lemon);box-shadow:var(--popS);display:grid;place-items:center;transform:rotate(-7deg)}
.logo .badge svg{width:56px;height:56px}
.logo .t{font-size:52px;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:.03em}
.logo .t span:nth-child(1){color:var(--sol)}
.logo .t span:nth-child(2){color:var(--jeong)}
.logo .t span:nth-child(3){color:var(--mint)}
.logo .t span:nth-child(4){color:var(--lemon)}
.logo.sm .badge{width:52px;height:52px;border-radius:18px}.logo.sm .badge svg{width:40px;height:40px}
.logo.sm .t{font-size:34px;-webkit-text-stroke:7px var(--ink);text-shadow:0 4px 0 var(--ink)}

/* 플레이어 고르기 */
.pick{display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:20px}
.pick .ask{font-size:34px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:34px;width:100%;max-width:820px}
.player{background:var(--c);border:var(--line);box-shadow:0 8px 0 var(--ink);border-radius:40px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.player:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.5) 0 4px,transparent 4.5px);background-size:30px 30px;pointer-events:none}
.player>*{position:relative;z-index:1}
.player .nm{font-size:52px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
.player .st{font-size:24px;background:#fff;border:var(--line);border-radius:999px;padding:4px 18px}
.face{width:var(--s,170px);height:var(--s,170px);border-radius:50%;border:8px solid #fff;outline:var(--line);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:calc(var(--s,170px)*.42);background:#FFF3DE;overflow:hidden;flex:none}
.face svg{width:82%;height:82%}

/* 상단바 */
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.me{display:flex;align-items:center;gap:10px;background:var(--me);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:6px 18px 6px 6px;font-size:26px}
.me .face{--s:58px;border-width:3px;outline-width:2.5px;box-shadow:none}
.me small{font-size:17px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;margin-left:4px}
.sp{flex:1}
.stars{display:flex;align-items:center;gap:8px;background:#fff;border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:8px 20px 8px 14px;font-size:28px}
.stars b{font-family:var(--fe);font-weight:700}
.homebtn{width:64px;height:64px;border-radius:50%;background:#fff;border:var(--line);box-shadow:var(--popS);font-size:30px;display:grid;place-items:center}

/* 홈: 한글/영어 */
.choose{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.choose .big .g{font-size:44px}.choose .big .l{font-size:26px}.choose .big .ic{font-size:56px}.choose .big{padding:22px 8px 18px}
.big.off{filter:grayscale(.75);opacity:.6}
.lvstar{font-size:20px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 14px}
.prompt{flex-wrap:wrap}
.ptxt{font-size:34px;text-align:center}.ptxt.sm{font-size:26px;max-width:540px;line-height:1.35}
.sent{font-size:54px;text-align:center;line-height:1.2}.sent.sm{font-size:34px}
.card .sent.sm{font-size:28px}
.duo{display:inline-flex;gap:2px;font-size:96px;line-height:1}.card .duo{font-size:66px}
.blank{display:inline-block;min-width:1.1em;border-bottom:6px dashed var(--meD);color:var(--meD);text-align:center}
.expr{font-family:var(--fe);font-weight:700;font-size:76px;letter-spacing:.02em}
.word.big2{font-size:120px}.card .word.sm2,.word.sm2{font-size:40px}
.cards.four .duo{font-size:56px}
.cards.wide{grid-template-columns:repeat(2,1fr);max-width:900px}
.cards.wide .card{min-height:110px}
.cards.wide .sent.sm{font-size:40px}.cards.four .num{font-size:84px}
.lvup{font-size:32px;background:var(--lemon);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:8px 24px}
.big.nope{animation:shake .45s}
.donebadge{position:absolute!important;top:14px;right:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:20px;z-index:2}
.prompt .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:84px;line-height:1;max-width:520px}
.grp.sm{font-size:56px;max-width:260px}
.card .grp.sm{font-size:50px;max-width:240px}
.prompt .op{font-family:var(--fe);font-weight:700;font-size:80px}
.card .num{font-family:var(--fe);font-weight:700;font-size:110px;line-height:1}
.cards.two{grid-template-columns:repeat(2,1fr);max-width:720px}
.cards.four{grid-template-columns:repeat(4,1fr);max-width:1100px;gap:18px}
.cards.four .card{min-height:170px}
.cards.four .word{font-size:58px}
.cards.four .pic{font-size:96px}
.big{border:var(--line);box-shadow:0 8px 0 var(--ink);border-radius:40px;padding:28px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--c);position:relative;overflow:hidden}
.big:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.5) 0 4px,transparent 4.5px);background-size:30px 30px;pointer-events:none}
.big>*{position:relative;z-index:1}
.big .g{font-size:68px;white-space:nowrap;line-height:1.05;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.big .g.en{font-weight:700}
.big .l{font-size:32px}
.big .ic{font-size:76px;line-height:1.1}
.hint{text-align:center;font-size:22px;color:var(--ink2);margin-top:18px}

/* 퀴즈 */
.dots{display:flex;gap:12px}
.dots i{width:40px;height:40px;border-radius:50%;border:var(--line);background:#fff;display:grid;place-items:center;font-style:normal;font-size:22px}
.dots i.on{background:var(--lemon)}
.dots i.now{background:var(--me);transform:scale(1.15)}
.qbox{display:flex;flex-direction:column;align-items:center;gap:22px}
.prompt{position:relative;width:100%;max-width:760px;background:#fff;border:var(--line);box-shadow:var(--pop);border-radius:40px;padding:22px;display:flex;align-items:center;justify-content:center;gap:26px;min-height:220px}
.prompt .pic{font-size:150px;line-height:1}
.prompt .word{font-size:96px;line-height:1}
.prompt .word.en{font-weight:700;letter-spacing:.02em}
.speak{width:96px;height:96px;border-radius:50%;background:var(--me);border:var(--line);box-shadow:var(--popS);font-size:46px;display:grid;place-items:center;flex:none}
.speak.go{animation:ring 1s ease-out}
@keyframes ring{0%{box-shadow:var(--popS),0 0 0 0 rgba(255,158,201,.6)}100%{box-shadow:var(--popS),0 0 0 26px rgba(255,158,201,0)}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%;max-width:960px}
.card{min-height:200px;background:#fff;border:var(--line);box-shadow:0 8px 0 var(--ink);border-radius:34px;display:flex;align-items:center;justify-content:center;padding:14px}
.card .pic{font-size:120px;line-height:1}
.card .word{font-size:76px;line-height:1}
.card .word.en{font-weight:700}
.card.ok{background:var(--okbg);animation:yay .6s cubic-bezier(.3,1.6,.5,1)}
.card.no{background:var(--nobg);animation:shake .45s;opacity:.55}
.card.fade{opacity:.35}
@keyframes yay{40%{transform:scale(1.12) rotate(-3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-3deg)}40%{transform:translateX(14px) rotate(3deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.praise{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.praise .in{display:flex;flex-direction:column;align-items:center;gap:8px;animation:boom .9s cubic-bezier(.3,1.6,.5,1) forwards}
.praise .s{font-size:150px;line-height:1;filter:drop-shadow(0 6px 0 rgba(90,62,114,.35))}
.praise .t{font-size:54px;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill}
@keyframes boom{0%{transform:scale(.2) rotate(-20deg);opacity:0}40%{transform:scale(1.15);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

/* 결과 */
.done{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:10px;text-align:center}
.done .row{display:flex;gap:10px;font-size:70px}
.done .t{font-size:52px}
.done .acts{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:86px;padding:0 40px;border-radius:999px;border:var(--line);box-shadow:var(--pop);background:var(--me);font-size:34px}
.btn.w{background:#fff}
.btn.y{background:var(--lemon)}

/* 마을 */
.village{background:#fff;border:var(--line);box-shadow:var(--pop);border-radius:36px;overflow:hidden}
.vhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 24px}
.vhead .ttl{font-size:34px}
.vhead .next{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:22px}
.vhead .bar{display:flex;gap:4px}
.vhead .bar i{width:16px;height:30px;border-radius:6px;border:2px solid var(--ink);background:#F4EEF6}
.vhead .bar i.on{background:var(--lemon)}
.vhead .mergebtn{border:var(--line);box-shadow:var(--popS);border-radius:999px;background:var(--lilac);padding:6px 18px;font-size:22px}
.scene{position:relative;background:linear-gradient(var(--skyband) 0 110px,var(--grass) 110px);border-top:var(--line);padding:118px 18px 26px;min-height:320px}
.scene:before{content:"";position:absolute;left:-5%;right:-5%;top:84px;height:60px;background:radial-gradient(ellipse at 20% 100%,var(--grass2) 0 40%,transparent 41%),radial-gradient(ellipse at 72% 100%,var(--grass2) 0 45%,transparent 46%);pointer-events:none}
.sun{position:absolute;top:16px;right:34px;width:62px;height:62px;border-radius:50%;background:var(--lemon);border:var(--line);box-shadow:0 0 0 10px rgba(255,224,116,.35)}
.cloud{position:absolute;top:28px;height:26px;border-radius:20px;background:#fff;border:2px solid #CFE3F5}
.plots{position:relative;display:flex;flex-wrap:wrap;gap:18px 10px;align-items:flex-end;justify-content:flex-start}
.plot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:108px;position:relative}
.mon{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mon svg{width:var(--w,88px);height:var(--w,88px);display:block;overflow:visible}
.mon .bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.03,.97)}}
.mon.jump .bob{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-36px) scale(.92,1.08)}100%{transform:none}}
.eyes{animation:blink 4.2s infinite;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shadow{width:62%;height:10px;border-radius:50%;background:rgba(90,62,114,.16);margin-top:-6px}
.tag{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:19px;margin-bottom:4px;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.tag.lv2{background:var(--lemon)}
.tag.lv3{background:var(--jeong);color:#fff}
.crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:30px;z-index:2}
.say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 12px;white-space:nowrap;font-size:20px;margin-bottom:6px;z-index:3;animation:popx .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popx{from{transform:translateX(-50%) scale(.4);opacity:0}}
.egg svg{width:76px;height:90px;animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}55%{transform:rotate(0)}}
.egg.crack svg{animation:crack .5s ease-in-out}
@keyframes crack{25%{transform:rotate(-14deg) scale(1.08)}50%{transform:rotate(14deg) scale(1.12)}75%{transform:rotate(-8deg) scale(1.05)}}
.born{animation:hatch .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hatch{from{transform:scale(.2) translateY(30px);opacity:0}}
.vempty{width:100%;text-align:center;padding:30px 10px;font-size:26px}

/* 합치기 창 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(90,62,114,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:#fff;border:var(--line);box-shadow:0 10px 0 var(--ink);border-radius:40px;padding:30px 30px 34px;max-width:720px;width:100%;text-align:center;animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .q{font-size:40px;line-height:1.25}
.modal .three{display:flex;align-items:center;justify-content:center;gap:6px;margin:22px 0}
.modal .three svg{width:96px;height:96px}
.modal .three .plus{font-size:40px}
.modal .three .arrow{font-size:52px;margin:0 8px}
.modal .three .mystery{width:120px;height:120px;border-radius:50%;border:var(--line);background:var(--lemon);display:grid;place-items:center;font-size:66px;animation:wob 1.2s ease-in-out infinite}
.modal .three.merging .src{animation:suck .7s ease-in forwards}
@keyframes suck{to{transform:translateX(var(--dx)) scale(.2);opacity:0}}
.modal .acts{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.modal .result svg{width:190px;height:190px}
.modal .result{margin:16px 0;animation:hatch .8s cubic-bezier(.3,1.6,.5,1)}

#burst{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#burst span{position:absolute;top:-50px}

@media (max-width:900px){
  .choose{grid-template-columns:repeat(3,1fr)}
  .prompt .grp{font-size:60px}.card .num{font-size:76px}
  .cards{grid-template-columns:repeat(3,1fr);gap:14px}
  .card{min-height:150px}.card .pic{font-size:84px}.card .word{font-size:52px}
  .prompt .pic{font-size:110px}.prompt .word{font-size:66px}
}
@media (max-width:560px){
  .players{grid-template-columns:1fr;gap:20px}
  .logo .t{font-size:38px}
  .big .g{font-size:60px}.big .ic{font-size:56px}
  .card{min-height:120px;border-radius:24px}.card .pic{font-size:60px}.card .word{font-size:36px}
  .prompt{gap:14px;min-height:170px}.prompt .pic{font-size:84px}.prompt .word{font-size:48px}
  .speak{width:70px;height:70px;font-size:32px}
  .btn{min-height:66px;font-size:26px;padding:0 26px}
  .me{font-size:20px}.stars{font-size:22px}
  .vhead .next{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 사진 · 부모 메뉴 */
.face img{width:100%;height:100%;object-fit:cover}
.gear{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:56px;height:56px;border-radius:50%;background:#fff;border:var(--line);box-shadow:var(--popS);font-size:26px;display:grid;place-items:center;z-index:10}
.pinpad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center;margin-top:18px}
.pinpad button{height:70px;border-radius:20px;border:var(--line);box-shadow:var(--popS);background:#fff;font-family:var(--fe);font-weight:700;font-size:30px}
.pindots{display:flex;justify-content:center;gap:14px;margin-top:16px}
.pindots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.pindots.no{animation:shake .4s}
.parent{background:#fff;border:var(--line);box-shadow:var(--pop);border-radius:32px;padding:10px 26px}
.prow{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:2px dashed #EFE3EA;flex-wrap:wrap}
.prow:last-child{border-bottom:none}
.prow .pt{font-size:24px}.prow .pd{font-size:17px;color:var(--ink2);margin-top:2px}
.prow .pa{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.sbtn{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:999px;padding:9px 18px;font-size:19px;background:#fff}
.sbtn.c{background:var(--me)}
.lvctl{display:inline-flex;align-items:center;gap:8px;border:2px dashed #E4D6EC;border-radius:999px;padding:3px 6px;font-size:18px}
.lvctl .sbtn{padding:2px 12px}
.toast{visibility:hidden;position:fixed;top:20px;left:50%;transform:translate(-50%,-200%);z-index:70;background:var(--ink);color:#fff;border-radius:999px;padding:12px 26px;font-size:21px;transition:transform .35s;white-space:nowrap}
.toast.show{visibility:visible;transform:translate(-50%,0)}
/* 마을 꾸미기 */
.scene.night{background:linear-gradient(#2E2A5E 0 110px,#7FC27A 110px)}
.scene.night:before{background:radial-gradient(ellipse at 20% 100%,#6DB46A 0 40%,transparent 41%),radial-gradient(ellipse at 72% 100%,#6DB46A 0 45%,transparent 46%)}
.moon{position:absolute;top:18px;right:40px;width:54px;height:54px;border-radius:50%;background:#FFF3B0;box-shadow:inset -14px -4px 0 #F2DC7A,0 0 18px rgba(255,243,176,.6)}
.twk{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFF7C2;animation:twk 2s ease-in-out infinite}

<script>
(function(){
/* ---------- 단어 (5살) ---------- */
const KO=[['사과','🍎'],['바나나','🍌'],['포도','🍇'],['딸기','🍓'],['우유','🥛'],['나무','🌳'],['꽃','🌸'],['개','🐶'],['고양이','🐱'],['토끼','🐰'],['곰','🐻'],['오리','🦆'],['기차','🚂'],['버스','🚌'],['배','⛵'],['해','☀️'],['달','🌙'],['별','⭐'],['우산','☂️'],['모자','🧢'],['공','⚽'],['집','🏠'],['물고기','🐟'],['수박','🍉'],['자동차','🚗'],['눈사람','⛄'],['신발','👟'],['시계','⏰'],['거미','🕷️'],['오이','🥒']];
const EN=[['apple','🍎'],['cat','🐱'],['dog','🐶'],['sun','☀️'],['ball','⚽'],['car','🚗'],['fish','🐟'],['egg','🥚'],['cake','🍰'],['bear','🐻'],['duck','🦆'],['bus','🚌'],['moon','🌙'],['star','⭐'],['hat','👒'],['cup','🥤'],['milk','🥛'],['tree','🌳'],['bird','🐦'],['banana','🍌'],['frog','🐸'],['pig','🐷'],['cow','🐮'],['book','📕']];

const SKEYS=SUBJ.map(x=>x.k), MAXS={ko:36,en:10,ph:55,calc:20,think:15};
const objOf=v=>Object.fromEntries(SKEYS.map(k=>[k,typeof v==='function'?v():v]));

/* ---------- 저장 (앱 저장소 + 브라우저 저장소) ---------- */
const KEY='soljeongVillage.v1';
const HAS_A=typeof window.Android!=='undefined';
const META={sol:{name:'다솔이',call:'다솔아',c:'#8FD3FF'},jeong:{name:'다정이',call:'다정아',c:'#FF9EC9'}};
const pad=n=>String(n).padStart(2,'0');
function dkey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function blankPlayer(){ return {mail:'',decos:[],stars:0,friends:[],spawned:0,asked:-1,day:'',today:objOf(false),photo:null,log:[],lv:objOf(1),hist:objOf(()=>[]),qx:objOf(0),v10:1,v11:1,v12:1,best:0,bgs:['basic'],bg:'basic'}; }
function loadS(){
  let raw=null; try{ if(HAS_A&&Android.loadData) raw=Android.loadData(); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  let d=null; try{ d=raw?JSON.parse(raw):null; }catch(e){}
  d=d||{}; d.players=d.players||{};
  for(const k of ['sol','jeong']) d.players[k]=Object.assign(blankPlayer(), d.players[k]||{});
  d.pin=d.pin||null; return d;
}
let S=loadS(), P={};
function bindP(){ P={}; for(const k of ['sol','jeong']) P[k]=Object.assign(S.players[k], META[k]); }
bindP();
function save(){
  const j=JSON.stringify(S);
  try{ localStorage.setItem(KEY,j); }catch(e){}
  try{ if(HAS_A&&Android.saveData) Android.saveData(j); }catch(e){}
}
function refreshDay(){ const t=dkey(); for(const k in P){ if(P[k].day!==t){ P[k].day=t; P[k].today=objOf(false); P[k].wr={d:t,items:[],star:0}; } } }
let toastT=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2300); }

let who=null, view='pick', Q=null;
const app=document.getElementById('app');

/* ---------- 소리: 한 번에 한 목소리만 ---------- */
/* 밝은 여자 목소리를 우선 고르고, 톤을 높여 어린이집 선생님처럼 */
const PREF={ko:['Google 한국의','Yuna','SunHi','Heami','Female','여성','Korean'], en:['Samantha','Google US English','Ava','Allison','Female','Zira','English']};
let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function bestVoice(lang){
  const k=lang.slice(0,2), list=VOICES.filter(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith(k));
  for(const n of PREF[k]||[]){ const v=list.find(v=>v.name.includes(n)); if(v) return v; }
  return list[0]||null;
}
let sayToken=0, sayTimers=[], uttId=0, ttsWait={};
window.__ttsDone=id=>{ const f=ttsWait[id]; delete ttsWait[id]; if(f) f(); };
function hush(){ sayToken++; sayTimers.forEach(clearTimeout); sayTimers=[]; ttsWait={}; try{ if(HAS_A&&Android.stopSpeak) Android.stopSpeak(); else speechSynthesis.cancel(); }catch(e){} }
function later(fn,ms){ const t=setTimeout(fn,ms); sayTimers.push(t); return t; }
/* parts: [[문장,'ko'|'en'], ...]  done: 다 말한 뒤에 할 일 */
let MUTE=false;   /* 🔇 소리 못 들어요 (앱을 다시 켜면 풀려요) */
function speakSeq(parts, done){
  hush(); const my=sayToken;
  if(MUTE){ if(done) later(done,500); return; }
  if(!HAS_A && !('speechSynthesis' in window)){ if(done) later(done,600); return; }
  let i=0;
  const next=()=>{
    if(my!==sayToken) return;
    if(i>=parts.length){ if(done) done(); return; }
    const part=parts[i++]; if(part[1]==='p'){ later(next,+part[2]||600); return; }
    const [t0,l]=part, t=String(t0).replace(/~/g,''), lang=l==='en'?'en-US':'ko-KR';
    const u=('SpeechSynthesisUtterance' in window)?new SpeechSynthesisUtterance(t):{}; u.lang=lang;
    u.rate = l==='en' ? .85 : .95; u.pitch = 1.0;
    if(!HAS_A){ const v=bestVoice(lang); if(v) u.voice=v; }
    let fired=false; const fin=()=>{ if(fired) return; fired=true; if(my===sayToken) later(next,120); };
    if(HAS_A && Android.speakTo){
      const id='u'+(++uttId); ttsWait[id]=fin;
      try{ Android.speakTo(t, lang, u.pitch, u.rate, id); }catch(e){ fin(); }
      later(fin, 2000 + t.length*200);
      return;
    }
    u.onend=fin; u.onerror=fin;
    later(fin, 900 + t.length*170);   /* onend가 안 오는 기기 대비 */
    try{ speechSynthesis.speak(u); }catch(e){ fin(); }
  };
  later(next,60);
}
function say(t, lang, done){ speakSeq([[t, lang==='en-US'||lang==='en'?'en':'ko']], done); }
function jo(w,a,b){ const c=w.charCodeAt(w.length-1)-0xAC00; return w+((c>=0&&c%28!==0)?a:b); }
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d,ty,vol])=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type=ty||'triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const ding=()=>tone([[784,.12],[988,.12],[1318,.3]]), oops=()=>tone([[300,.15,'sine',.15],[240,.2,'sine',.15]]), boing=()=>tone([[392,.08,'sine'],[587,.12,'sine']]), fanfare=()=>tone([[523,.12],[659,.12],[784,.12],[1046,.4]]);
function burst(n){
  const c=document.createElement('div'); c.id='burst'; document.body.appendChild(c);
  const ic=['⭐','🌟','💖','🎉','✨','🍭'];
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.textContent=ic[i%ic.length];
    const d=1.2+Math.random()*.9; s.style.cssText=`left:${Math.random()*100}%;font-size:${24+Math.random()*28}px;transition:transform ${d}s cubic-bezier(.2,.6,.4,1),opacity ${d}s`;
    c.appendChild(s); requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.transform=`translate(${(Math.random()-.5)*160}px,${innerHeight+100}px) rotate(${Math.random()*540-270}deg)`; s.style.opacity='.2'; })); }
  setTimeout(()=>c.remove(),2300);
}
function batchim(w){ const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0 && c%28!==0; }
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- 캐릭터 그림 ---------- */
const INK='#5A3E72';
const SP={
  apple:{ko:'사과',col:'#FF7B7B'}, shark:{ko:'상어',col:'#9CC7F2'}, poop:{ko:'응가',col:'#C08B5C'}, banana:{ko:'바나나',col:'#FFE066'},
  octopus:{ko:'문어',col:'#D3A8FF'}, icecream:{ko:'아이스크림',col:'#FFB3D6'}, toast:{ko:'식빵',col:'#F2C27A'},
  bunny:{ko:'토끼',col:'#FFD0E6'}, cat:{ko:'고양이',col:'#A8EBD0'}, chick:{ko:'병아리',col:'#FFE38A'}, dino:{ko:'공룡',col:'#C8F0A8'}, slime:{ko:'말랑이',col:'#B5DCFF'}
};
const SP_LIST=Object.keys(SP);
const st=`stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;
function face(cx,ey,gap,opt){
  gap=gap||10; const r=4.8;
  const eyes=`<g class="eyes" style="transform-origin:${cx}px ${ey}px"><circle cx="${cx-gap}" cy="${ey}" r="${r}" fill="${INK}"/><circle cx="${cx+gap}" cy="${ey}" r="${r}" fill="${INK}"/><circle cx="${cx-gap+1.6}" cy="${ey-1.8}" r="1.6" fill="#fff"/><circle cx="${cx+gap+1.6}" cy="${ey-1.8}" r="1.6" fill="#fff"/></g>`;
  const blush=`<ellipse cx="${cx-gap-9}" cy="${ey+9}" rx="5.5" ry="3.4" fill="#FF8FBF" opacity=".75"/><ellipse cx="${cx+gap+9}" cy="${ey+9}" rx="5.5" ry="3.4" fill="#FF8FBF" opacity=".75"/>`;
  let mouth=`<path d="M${cx-6} ${ey+8} q3 4 6 0 q3 4 6 0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
  if(opt==='teeth') mouth=`<path d="M${cx-10} ${ey+8} Q${cx} ${ey+18} ${cx+10} ${ey+8} Z" fill="#fff" ${st} stroke-width="2.4"/><path d="M${cx-7} ${ey+9} l2.5 3 2.5 -3 2.5 3 2.5 -3 2.5 3 2.5 -3" fill="none" stroke="${INK}" stroke-width="1.6"/>`;
  if(opt==='beak') mouth=`<path d="M${cx-5} ${ey+6} L${cx+5} ${ey+6} L${cx} ${ey+13} Z" fill="#FFA24C" ${st} stroke-width="2"/>`;
  if(opt==='open') mouth=`<ellipse cx="${cx}" cy="${ey+11}" rx="5" ry="4.5" fill="#FF7B9C" ${st} stroke-width="2.4"/>`;
  return blush+eyes+mouth;
}
function mon(sp){
  const c=SP[sp].col; let g='';
  if(SP[sp].d) g=SP[sp].d(c);
  else if(sp==='apple') g=`<path d="M50 30 C70 20 90 38 87 60 C84 84 64 94 50 88 C36 94 16 84 13 60 C10 38 30 20 50 30 Z" fill="${c}" ${st}/>
    <path d="M50 30 Q50 18 56 12" fill="none" stroke="#8A5A3C" stroke-width="4" stroke-linecap="round"/><path d="M54 20 Q66 8 76 16 Q66 26 54 20 Z" fill="#7FD07A" ${st} stroke-width="2.5"/>

    <path d="M70 56 q3 3 0 6 M75 55 q3 3 0 6" fill="none" stroke="${INK}" stroke-width="2"/>`+face(42,58,10,'teeth');
  else if(sp==='poop') g=`<ellipse cx="50" cy="82" rx="36" ry="13" fill="${c}" ${st}/><ellipse cx="50" cy="66" rx="28" ry="12" fill="${c}" ${st}/>

    <ellipse cx="40" cy="48" rx="4" ry="2.5" fill="#fff" opacity=".5"/>`+face(50,66,10,'open');
  else if(sp==='banana') g=`<path d="M20 30 Q14 74 52 88 Q80 94 92 70 Q70 78 48 66 Q30 54 30 30 Z" fill="${c}" ${st}/>
    <path d="M20 30 L24 18 L32 20 L30 30 Z" fill="#8A5A3C" ${st} stroke-width="2.5"/><path d="M30 46 Q36 66 56 76" fill="none" stroke="#E9C33F" stroke-width="3"/>`+face(58,64,9);
  else if(sp==='octopus') g=`${[18,34,50,66,82].map((x,i)=>`<path d="M${x} 62 Q${x+(i%2?6:-6)} 80 ${x+(i%2?-2:2)} 94" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="M${x} 62 Q${x+(i%2?6:-6)} 80 ${x+(i%2?-2:2)} 94" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/>`).join('')}
    <path d="M14 64 C10 30 30 14 50 14 C70 14 90 30 86 64 Q50 74 14 64 Z" fill="${c}" ${st}/><circle cx="30" cy="34" r="4" fill="#fff" opacity=".6"/><circle cx="68" cy="28" r="3" fill="#fff" opacity=".6"/>`+face(50,46,11,'open');
  else if(sp==='icecream') g=`<path d="M30 58 L70 58 L50 97 Z" fill="#F2C27A" ${st}/><path d="M36 66 L60 66 M40 76 L58 76 M44 86 L54 86" stroke="#C99550" stroke-width="2"/>
    <path d="M18 58 C14 30 34 16 50 16 C66 16 86 30 82 58 Q76 66 70 58 Q64 70 58 58 Q50 68 44 58 Q36 70 30 58 Q24 66 18 58 Z" fill="${c}" ${st}/>
    <circle cx="50" cy="12" r="7" fill="#FF5C7A" ${st} stroke-width="2.5"/><path d="M50 6 Q54 0 60 -2" fill="none" stroke="#7FD07A" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="2" fill="#7FD07A"/><circle cx="66" cy="28" r="2" fill="#FFE066"/><circle cx="60" cy="44" r="2" fill="#9CC7F2"/>`+face(50,38,10);
  else if(sp==='toast') g=`<path d="M18 46 C10 20 90 20 82 46 L78 90 L22 90 Z" fill="#E0A55A" ${st}/><path d="M26 48 C20 30 80 30 74 48 L71 84 L29 84 Z" fill="#FFE9B8"/>
    <path d="M58 70 l6 0 l0 6 l-6 0 Z" fill="#FFC94A" opacity=".8"/>`+face(50,58,10);
  else { /* 동그란 친구들 */
    let back='';
    if(sp==='bunny') back=`<ellipse cx="37" cy="26" rx="8" ry="20" fill="${c}" ${st} transform="rotate(-8 37 26)"/><ellipse cx="63" cy="26" rx="8" ry="20" fill="${c}" ${st} transform="rotate(8 63 26)"/><ellipse cx="37" cy="28" rx="3.5" ry="12" fill="#FF9CC8" transform="rotate(-8 37 28)"/><ellipse cx="63" cy="28" rx="3.5" ry="12" fill="#FF9CC8" transform="rotate(8 63 28)"/>`;
    if(sp==='cat') back=`<path d="M24 46 L28 22 L44 36 Z" fill="${c}" ${st}/><path d="M76 46 L72 22 L56 36 Z" fill="${c}" ${st}/>`;
    if(sp==='dino') back=`<path d="M38 36 l5 -12 l5 10 l5 -12 l5 10 l5 -11 l4 14" fill="#FFB0C8" ${st}/>`;
    if(sp==='chick') back=`<path d="M50 34 q-6 -12 2 -16 q-1 7 6 4 q-3 6 -8 12" fill="${c}" ${st}/>`;
    const body= sp==='slime' ? `<path d="M16 86 C12 60 30 30 50 30 C70 30 88 60 84 86 Q50 92 16 86 Z" fill="${c}" ${st}/><ellipse cx="34" cy="48" rx="5" ry="8" fill="#fff" opacity=".7" transform="rotate(25 34 48)"/>`

    g=back+body+face(50,60,10,sp==='chick'?'beak':null);
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g class="bob">${g}</g></svg>`;
}
/* ---------- 새 마을 친구들 (r: 귀한 친구) ---------- */

const NEWSP={

function mergeBonus(made,srcs){
  if(made.kind==='obj') return null;
  srcs.forEach(f=>{ if(f.acc&&!made.acc) made.acc=f.acc; if(f.food&&!made.food) made.food=f.food; });
  if(Math.random()>=.8 || (made.acc&&made.food)) return null;
  const useAcc=made.acc?false:made.food?true:Math.random()<.5, x=useAcc?pick(ACCS):pick(FOODS);
  if(useAcc) made.acc=x[0]; else made.food=x[0];
  return {k:useAcc?'acc':'food',e:x[0],ko:x[1]};
}

function objRecipe(ids){
  const c={}; ids.forEach(i=>c[i]=(c[i]||0)+1); const t=objTier(ids[0]), ks=Object.keys(c);
  if(t===1){
    const tri={house:'town',tree:'forest',rainbow:'unicorn',balloon:'skyparty',windmill:'flowerfarm'}, pair={house:'garden',tree:'camp',rainbow:'butterfly',balloon:'circus',windmill:'blossom'};
    if(ks.length===1) return tri[ks[0]];
    if(ks.length===3) return 'candy';
    return pair[ks.find(k=>c[k]===2)];
  }
  if(t===2){ const up={castle:'palace',ferris:'park',town:'city',forest:'valley',unicorn:'skyisland',candy:'candyland'}; return ks.length===1&&up[ks[0]]?up[ks[0]]:null; }
  return 'dream';
}
function objGroups(p){ const g={1:[],2:[],3:[]}; p.friends.forEach((f,i)=>{ if(f.kind==='obj'&&f.h){ const t=objTier(f.obj); if(g[t]) g[t].push(i); } }); return g; }

/* 물건 세 개를 합쳐요 */
function objMergeSel(sel){
  const p=P[who];
  let res=objRecipe(sel.map(i=>p.friends[i].obj)); const surprise=!res; if(!res) res=pick(C_SURPRISE);
  const fresh=!dexOf(p)[res], idx=new Set(sel);
  p.friends=p.friends.filter((_,i)=>!idx.has(i));
  p.friends.push({sp:'apple',kind:'obj',obj:res,lv:Math.min(4,objTier(res)+1),h:true});
  dexOf(p)[res]=1; p.asked=p.friends.length;
  return {res,fresh,surprise};
}
const objAllN=()=>{ const g=objGroups(P[who]); return [1,2,3].reduce((a,t)=>a+Math.floor(g[t].length/3),0); };
/* 같은 종류끼리 먼저, 합칠 수 있는 만큼 쭉 합쳐요 */
function objMergeAll(){
  const p=P[who], out=[]; let g=0;
  while(g++<80){
    const gr=objGroups(p), tier=[1,2,3].find(t=>gr[t].length>=3); if(!tier) break;
    const by={}; gr[tier].forEach(i=>{ const o=p.friends[i].obj; (by[o]=by[o]||[]).push(i); });
    const same=Object.values(by).find(a=>a.length>=3);
    out.push(objMergeSel((same||gr[tier]).slice(0,3)));
  }
  save(); return out;
}

  const h=[6,16,26,38,48,56,56,64,68,66][i];

  if(i===0){ g.push(`<ellipse cx="70" cy="92" rx="11" ry="14" fill="#A9743F" stroke="${L}" stroke-width="3"/><path d="M66 88 q4 5 8 0" stroke="${L}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`); }
  else {
    const top=96-h;
    g.push(`<path d="M70 98 C70 ${98-h*.5} 70 ${top+6} 70 ${top}" stroke="${i>=6?'#8B5E3C':leaf}" stroke-width="${i>=6?9:6}" fill="none" stroke-linecap="round"/>`);
    if(i>=1&&i<6) g.push(`<path d="M70 ${96-h*.45} q-20 -10 -24 6 q18 10 24 -6Z" fill="${leaf}" stroke="${L}" stroke-width="2.5"/>`);
    if(i>=2&&i<6) g.push(`<path d="M70 ${96-h*.7} q20 -10 24 6 q-18 10 -24 -6Z" fill="${leaf2}" stroke="${L}" stroke-width="2.5"/>`);
    if(i>=3&&i<6) g.push(`<path d="M70 ${96-h*.3} q-22 -8 -26 8 q20 10 26 -8Z" fill="${leaf2}" stroke="${L}" stroke-width="2.5"/>`);
    if(i===4) g.push(`<ellipse cx="70" cy="${top-4}" rx="11" ry="14" fill="#FF8FC6" stroke="${L}" stroke-width="3"/>`);
    if(i===5){ for(let k=0;k<6;k++){ const a=k*60*Math.PI/180; g.push(`<ellipse cx="${(70+Math.cos(a)*13).toFixed(1)}" cy="${(top-4+Math.sin(a)*13).toFixed(1)}" rx="9" ry="9" fill="#FF8FC6" stroke="${L}" stroke-width="2.5"/>`);} g.push(`<circle cx="70" cy="${top-4}" r="8" fill="#FFD93D" stroke="${L}" stroke-width="2.5"/>`); }

      if(i>=8){ [[70-r*.55,cy+r*.1],[70+r*.5,cy-r*.05],[70,cy-r*.5]].forEach(([x,y])=>g.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="#FF5C5C" stroke="${L}" stroke-width="2.5"/>`)); } }

function kWordQ(w,type,no,pool){
  /* type 'read': 그림 보고 낱말 고르기 · 'pict': 낱말 보고 그림 고르기 */
  const others=shuffle(pool.filter(x=>x[0]!==w[0]&&x[1]!==w[1])).slice(0,no-1);
  const opts=shuffle([w,...others]).map(o=>({ok:o[0]===w[0],lw:o,html:type==='pict'?`<span class="pic">${o[1]}</span>`:`<span class="word">${o[0]}</span>`}));
  const ask=type==='pict'?say1('낱말을 읽고 알맞은 그림을 골라 볼까요?'):say1('그림을 보고 알맞은 낱말을 골라 볼까요?');
  return {ask,praise:say1(`${cheerK()} ${w[0]}!`),
    prompt: type==='pict'?`<div class="word big2">${w[0]}</div>${speakBtn}<div class="ptxt">맞는 그림은?</div>`:`<div class="pic">${w[1]}</div>${speakBtn}<div class="ptxt">이건 무슨 낱말일까?</div>`,
    opts, learn:LW(w[0],w[1],'ko')};
}

function clockSVG(h,m){
  const ha=((h%12)+m/60)*30-90, ma=m*6-90, rad=a=>a*Math.PI/180;
  const hx=60+Math.cos(rad(ha))*24, hy=60+Math.sin(rad(ha))*24, mx=60+Math.cos(rad(ma))*36, my=60+Math.sin(rad(ma))*36;

  return `<svg viewBox="0 0 120 120" width="170" height="170"><circle cx="60" cy="60" r="56" fill="#fff" ${st}/>${nums}<line x1="60" y1="60" x2="${hx}" y2="${hy}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><line x1="60" y1="60" x2="${mx}" y2="${my}" stroke="#F06AAE" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="${INK}"/></svg>`;
}
function tensSVG(n){ /* 10개 묶음 막대 + 낱개 */

function badSpacing(s){

  }
  out.delete(s); return [...out];
}

/* 마을 친구들이 마을 안을 자유롭게 돌아다녀요 (집 안 친구는 집 안에서만 꼼지락) */
(function(){
  if(window.__roam) return; window.__roam=1;
  let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) return;
  const tick=()=>{
    const now=Date.now();
    document.querySelectorAll('.plots .plot.fr').forEach(el=>{
      if(el._busy && now<el._next) return;
      const box=el.parentElement; if(!box) return;
      const W=box.clientWidth, H=box.clientHeight, x0=el.offsetLeft, y0=el.offsetTop, w=el.offsetWidth, h=el.offsetHeight;
      if(!W||!w) return;
      const minX=-x0, maxX=W-(x0+w), minY=Math.max(-y0-10,-160), maxY=Math.max(0,H-(y0+h));
      const cx=el._x||0, cy=el._y||0;
      let tx=cx+(Math.random()-.5)*Math.min(W,520), ty=cy+(Math.random()-.5)*Math.min(H+40,220);
      tx=Math.max(minX,Math.min(maxX,tx)); ty=Math.max(minY,Math.min(maxY,ty));
      const dist=Math.hypot(tx-cx,ty-cy), dur=Math.max(1.6,dist/48);
      el.style.transition=`transform ${dur.toFixed(2)}s linear`;
      el.style.transform=`translate(${tx.toFixed(0)}px,${ty.toFixed(0)}px)`;
      el.style.zIndex=String(Math.round(200+y0+ty));
      const m=el.querySelector('.mon'); if(m) m.classList.toggle('goleft',tx<cx);
      el._x=tx; el._y=ty; el._busy=1; el._next=now+dur*1000+1200+Math.random()*3800;
    });
  };
  setInterval(tick,600); setTimeout(tick,400);
})();

/* ---------- 문제를 한눈에: 수학 문장의 숫자 강조 · 줄 나눔 ---------- */
function fitIn(el,min){ const box=el.parentElement; if(!box) return; let fs=parseFloat(getComputedStyle(el).fontSize), g=0; const room=()=>box.clientWidth-parseFloat(getComputedStyle(box).paddingLeft)-parseFloat(getComputedStyle(box).paddingRight)-4;
  while(el.scrollWidth>room()&&fs>min&&g++<40){ fs-=3; el.style.fontSize=fs+'px'; } }
function qPretty(){ try{

  /* 수학: 그림 여러 개(2개 + 3개)는 한 줄로 나란히, 개수 그림 칸은 개수에 맞게 */

  document.querySelectorAll('.qbox.m .prompt').forEach(pr=>{ if(pr.querySelector('.ptxt,.expr,.sent')||!it) return; const t=askText(it); if(t&&t.length<=24){ const d=document.createElement('div'); d.className='ptxt'; d.textContent=t; pr.appendChild(d); } });
  /* 길면 줄이 넘치지 않게 글자 크기를 줄여요 */
  document.querySelectorAll('.qbox .expr').forEach(el=>{ el.style.whiteSpace='nowrap'; fitIn(el,26); });
  document.querySelectorAll('.qbox .card .word,.qbox .card .num').forEach(el=>{ el.style.whiteSpace='nowrap'; fitIn(el,20); });
  document.querySelectorAll('.qbox.m .ptxt').forEach(el=>{ if(el.dataset.pp) return; el.dataset.pp=1;
    el.innerHTML=('>'+el.innerHTML+'<').replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(/(\d+)/g,'<b class="nh">$1</b>').replace(/([.?!])\s+(?=\S)/g,'$1<br>')+'<').slice(1,-1); });

function emoize(root){ if(!root) return; const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&n.parentNode.closest&&n.parentNode.closest('svg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}), nodes=[];
  while(tw.nextNode()){ const n=tw.currentNode; EMO_RE.lastIndex=0; if(EMO_RE.test(n.nodeValue)) nodes.push(n); }
  nodes.forEach(n=>{ const t=n.nodeValue, frag=document.createDocumentFragment(); let last=0, any=false; EMO_RE.lastIndex=0; let m;
    while((m=EMO_RE.exec(t))){ const k=emoKey(m[0]); if(!EMO_SET.has(k)) continue; any=true;
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const im=document.createElement('img'); im.className='emo'; im.alt=m[0]; im.draggable=false; im.src='emo/'+k+'.svg'; im.onerror=function(){ this.replaceWith(document.createTextNode(this.alt)); }; frag.appendChild(im); last=m.index+m[0].length; }
    if(!any) return; if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag,n); }); }

function isNight(){ const h=new Date().getHours(); return h>=19||h<6; }
function sky(){
  const m=new Date().getMonth()+1, night=isNight();
  const fall = m===12||m<=2 ? '❄️' : m<=5 ? '🌸' : m<=8 ? '' : '🍁';
  let out = night ? `<div class="moon"></div>${Array.from({length:14},(_,i)=>`<i class="twk" style="left:${(i*37)%96+2}%;top:${(i*23)%80+8}px;animation-delay:-${(i*.4)%2}s"></i>`).join('')}`
                  : `<div class="sun"></div><div class="cloud" style="left:8%;width:70px"></div><div class="cloud" style="left:48%;width:90px;top:42px"></div>`;
  if(fall) out += Array.from({length:12},(_,i)=>`<span class="fall" style="left:${(i*41)%96}%;animation-duration:${6+(i%5)}s;animation-delay:-${i*1.1}s">${fall}</span>`).join('');
  if(m>=6&&m<=8&&!night) out += `<span class="flutter">🦋</span>`;
  return out;
}

const freeCnt=L=>P[who].friends.filter(f=>f.h&&f.kind!=='obj'&&f.lv===L).length;
const pickThree=L=>P[who].friends.map((f,i)=>({f,i})).filter(x=>x.f.h&&x.f.kind!=='obj'&&x.f.lv===L).slice(0,3);
const nextMergeLv=()=>[1,2,3].find(L=>freeCnt(L)>=3);

/* 세 명을 합쳐서 새 친구(또는 물건)를 만들어요 */
function mergeOnce(three,lv){
  const p=P[who], keep=three[0].f.sp, r=Math.random(), shiny=three.some(x=>x.f.sh); let made;
  if(lv===1) made = r<.6 ? {sp:pick(three.map(x=>x.f.sp)),lv:2,h:true,sh:shiny} : {sp:keep,kind:'obj',obj:pick(['house','tree','rainbow','balloon','windmill']),lv:2,h:true};
  else if(lv===3) made = {sp:pick(three.map(x=>x.f.sp)),lv:4,h:true,sh:shiny};
  else made = r<.5 ? {sp:pick(three.map(x=>x.f.sp)),lv:3,h:true,sh:shiny} : {sp:keep,kind:'obj',obj:pick(['castle','ferris']),lv:3,h:true};
  const bonus=mergeBonus(made,three.map(x=>x.f));
  if(made.kind==='obj') dexOf(p)[made.obj]=1;
  const idx=new Set(three.map(x=>x.i));
  p.friends=p.friends.filter((_,i)=>!idx.has(i)); p.friends.push(made); p.asked=p.friends.length;
  return {made,bonus};
}

  }

document.getElementById('photoInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f||!photoFor) return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=Math.max(0,(img.height-side)/2.6);
    const cv=document.createElement('canvas'); cv.width=cv.height=360; cv.getContext('2d').drawImage(img,sx,sy,side,side,0,0,360,360);
    P[photoFor].photo=cv.toDataURL('image/jpeg',.85); save(); toast('사진을 바꿨어요'); if(view==='parent') rParent(); };
    img.src=r.result; };
  r.readAsDataURL(f);
});
let pending=null;

        <div class="acts" style="margin-top:20px"><button class="btn press" id="ry">불러오기</button><button class="btn w press" id="rn">닫기</button></div>`);
      m.querySelector('#rn').onclick=closeP;
      m.querySelector('#ry').onclick=()=>{ const j=JSON.stringify(pending); try{ localStorage.setItem(KEY,j); }catch(err){} try{ if(HAS_A) Android.saveData(j); }catch(err){} S=loadS(); bindP(); save(); closeP(); toast('백업을 불러왔어요'); view='pick'; render(); };
    }catch(err){ toast('백업 파일이 아니에요'); } };
  r.readAsText(f);
});
