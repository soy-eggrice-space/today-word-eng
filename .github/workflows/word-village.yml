name: 모여봐요 단어마을 APK 만들기

on:
  push:
    branches: [ main ]
    paths:
      - 'word-village/**'
      - '.github/workflows/word-village.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 서명키 풀기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD 시크릿이 없어요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in app/release.keystore.enc -out word-village/app/release.keystore -pass env:KEYSTORE_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          mkdir -p word-village/app/src/main/assets/fonts
          curl -fsSL -o word-village/app/src/main/assets/fonts/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
          curl -fsSL -o word-village/app/src/main/assets/fonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || echo "Fredoka 글꼴을 받지 못했어요"
      - name: APK 빌드 (태블릿 · 휴대폰)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p word-village assembleTabletRelease assembleMobileRelease --no-daemon --stacktrace
      - name: 서명 확인
        run: |
          rm -f word-village/app/release.keystore
          cp word-village/app/build/outputs/apk/tablet/release/app-tablet-release.apk word-village.apk
          cp word-village/app/build/outputs/apk/mobile/release/app-mobile-release.apk word-village_for_mobile_ver1.0.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for f in word-village.apk word-village_for_mobile_ver1.0.apk; do "$AS" verify --print-certs "$f" | grep -i "SHA-256"; done
      - name: 릴리스에 올리기 (항상 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete word-village --repo "${{ github.repository }}" --yes --cleanup-tag || true
          sleep 3
          gh release create word-village word-village.apk word-village_for_mobile_ver1.0.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "모여봐요 단어마을 v1.0.${{ github.run_number }}" \
            --notes "태블릿: word-village.apk · 휴대폰: word-village_for_mobile_ver1.0.apk 를 눌러 내려받아 설치하세요. 처음 켜면 이름과 사진을 정해요. 이전 버전 위에 그대로 설치하면 기록이 유지돼요."
