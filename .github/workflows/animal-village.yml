name: 우리 동물 마을 (베타) APK 만들기

on:
  push:
    branches: [ main ]
    paths:
      - 'animal-village/**'
      - '.github/workflows/animal-village.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 서명키 풀기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD 시크릿이 없어요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keys/today.keystore.enc -out animal-village/app/today.keystore -pass env:KEYSTORE_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          mkdir -p animal-village/app/src/main/assets/fonts
          curl -fsSL -o animal-village/app/src/main/assets/fonts/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
      - name: APK 빌드 (태블릿)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p animal-village assembleRelease --no-daemon --stacktrace
      - name: 서명 확인
        run: |
          rm -f animal-village/app/today.keystore
          cp animal-village/app/build/outputs/apk/release/app-release.apk animal-village.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs animal-village.apk | grep -i "SHA-256"
      - name: 릴리스에 올리기 (항상 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete animal-village --repo "${{ github.repository }}" --yes --cleanup-tag || true
          sleep 3
          gh release create animal-village animal-village.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest=false --prerelease \
            --title "우리 동물 마을 베타 v0.1.${{ github.run_number }}" \
            --notes "태블릿 베타 버전이에요. animal-village.apk 를 눌러 내려받아 설치하세요. 다음 베타도 같은 서명이라 지금 깔린 앱 위에 그대로 설치하면 게임 기록이 유지돼요."
