name: tidy
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: tags
        run: |
          H=$(git rev-parse HEAD)
          ok=0; fail=0
          for t in $(git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' | sed 's#refs/tags/##'); do
            if gh api -X PATCH "repos/$REPO/git/refs/tags/$t" -f sha="$H" -F force=true >/dev/null 2>&1; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done
          echo "tags moved $ok failed $fail"
      - name: runs
        run: |
          n=0
          for page in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$REPO/actions/runs?per_page=100&status=completed" -q '.workflow_runs[].id')
            [ -z "$ids" ] && break
            for id in $ids; do
              [ "$id" = "${{ github.run_id }}" ] && continue
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && n=$((n+1))
            done
          done
          echo "runs deleted $n"
