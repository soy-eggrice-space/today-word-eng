name: 가족 앱 서명키 옮기기 (한 번만)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rekey-once.yml'

permissions:
  contents: write

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 서명키 비밀번호를 새것으로 바꾸고, 새 비밀번호는 공개키로 잠그기 (2차)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          umask 077
          W=$(mktemp -d)
          rm -f rekey/*.aes rekey/*.rsa
          NEWPW=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          echo "::add-mask::$NEWPW"
          printf '%s' "$NEWPW" > "$W/newpw"
          git show 65c3e49:keys/dayeon.keystore.enc > "$W/dayeon.enc"
          cp keys/today.keystore.enc "$W/today.enc"
          for k in dayeon today; do
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$W/$k.enc" -out "$W/$k.old" -pass env:KEYSTORE_PASSWORD
            keytool -importkeystore -noprompt -srckeystore "$W/$k.old" -srcstoretype PKCS12 -srcstorepass:env KEYSTORE_PASSWORD \
              -destkeystore "$W/$k.new" -deststoretype PKCS12 -deststorepass:file "$W/newpw" -srcalias "$k" -destalias "$k"
            keytool -list -keystore "$W/$k.new" -storepass:file "$W/newpw" | grep -i "entry"
            keytool -list -v -keystore "$W/$k.old" -storepass:env KEYSTORE_PASSWORD -alias "$k" | grep "SHA256:" | head -1
            keytool -list -v -keystore "$W/$k.new" -storepass:file "$W/newpw" -alias "$k" | grep "SHA256:" | head -1
            openssl enc -aes-256-cbc -pbkdf2 -in "$W/$k.new" -out "rekey/$k.keystore.enc" -pass file:"$W/newpw"
          done
          openssl pkeyutl -encrypt -pubin -inkey rekey/pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$W/newpw" -out rekey/newpw.rsa
          rm -rf "$W"
          ls -la rekey
      - name: 잠근 파일 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A rekey
          git commit -m "가족 앱 서명키: 새 비밀번호로 바꾼 파일 (임시)"
          git push
