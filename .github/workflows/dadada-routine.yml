name: 우리가족 APK 만들기

on:
  push:
    branches: [ main ]
    paths:
      - 'dadada-routine/**'
      - '.github/workflows/dadada-routine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 서명키 풀기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD 시크릿이 없어요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keys/today.keystore.enc -out dadada-routine/app/today.keystore -pass env:KEYSTORE_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          F=dadada-routine/app/src/main/assets/fonts
          mkdir -p $F
          curl -fsSL -o $F/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o $F/IBMPlexSansKR-$w.ttf "https://github.com/google/fonts/raw/main/ofl/ibmplexsanskr/IBMPlexSansKR-$w.ttf" || echo "IBM Plex Sans KR $w 글꼴을 받지 못했어요"
          done
          ls -la $F
      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p dadada-routine assembleRelease --no-daemon --stacktrace
      - name: 서명 확인
        run: |
          rm -f dadada-routine/app/today.keystore
          cp dadada-routine/app/build/outputs/apk/release/app-release.apk dadada-routine.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs dadada-routine.apk | grep -i "SHA-256"
      - name: 릴리스에 올리기 (항상 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dadada-routine --repo "${{ github.repository }}" --yes --cleanup-tag || true
          sleep 3
          gh release create dadada-routine dadada-routine.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "우리가족 v1.1.${{ github.run_number }}" \
            --notes "우리가족 앱이에요 (아이들 태블릿 + 가족 폰). dadada-routine.apk 를 눌러 내려받아 설치하세요. 깔린 앱 위에 그대로 설치하면 루틴과 별 기록이 유지돼요."
