name: 오늘단어 APK 만들기

on:
  push:
    branches: [ main ]
    paths:
      - 'today-words/**'
      - '.github/workflows/today-words.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 서명키 풀기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD 시크릿이 없어요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keys/today.keystore.enc -out today-words/app/today.keystore -pass env:KEYSTORE_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          mkdir -p today-words/app/src/main/assets/fonts
          curl -fsSL -o today-words/app/src/main/assets/fonts/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
          curl -fsSL -o today-words/app/src/main/assets/fonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || echo "Fredoka 글꼴을 받지 못했어요"
      - name: APK 빌드 (태블릿 · 휴대폰)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p today-words assembleTabletRelease assembleMobileRelease --no-daemon --stacktrace
      - name: 서명 확인
        run: |
          rm -f today-words/app/today.keystore
          cp today-words/app/build/outputs/apk/tablet/release/app-tablet-release.apk today-words.apk
          cp today-words/app/build/outputs/apk/mobile/release/app-mobile-release.apk today-words_for_mobile_ver1.0.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for f in today-words.apk today-words_for_mobile_ver1.0.apk; do "$AS" verify --print-certs "$f" | grep -i "SHA-256"; done
      - name: 릴리스에 올리기 (항상 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete today-words --repo "${{ github.repository }}" --yes --cleanup-tag || true
          sleep 3
          gh release create today-words today-words.apk today-words_for_mobile_ver1.0.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "오늘단어 v2.0.${{ github.run_number }}" \
            --notes "태블릿: today-words.apk · 휴대폰: today-words_for_mobile_ver1.0.apk 를 눌러 내려받아 설치하세요. 예전과 같은 서명이라 지금 깔린 앱 위에 그대로 설치하면 기록이 유지돼요."
