<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF3F8">
<title>모여봐요 다연마을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
<style>
@font-face{font-family:'JuaLocal';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'FredokaLocal';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700;font-display:swap}

:root{
  --bg:#FFF3F8; --card:#FFFFFF; --ink:#5A3E72; --ink2:#9580AA; --hair:#F1DDEB; --soft:#FFF8FB;
  --straw:#FF8DC4; --strawD:#F06AAE; --lemon:#FFE074; --mint:#8AE5C6; --mintD:#2BA67C; --sky:#9CD3FF; --skyD:#5AA9F0; --lilac:#CFB8FF; --peach:#FFC1A0;
  --okbg:#DDF8EC; --nobg:#FFE0EC; --skyband:#DDF1FF; --grass:#B6EEA4; --grass2:#9FE28E;
  --line:2.5px solid var(--ink);
  --pop:0 5px 0 var(--ink); --popS:0 3px 0 var(--ink);
  --fk:'JuaLocal','Jua','Noto Sans KR',system-ui,sans-serif;
  --fe:'FredokaLocal','Fredoka','JuaLocal','Jua',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--fk);color:var(--ink);background-color:var(--bg);font-size:18px;
  background-image:
    radial-gradient(circle at 18% 28%,#FFC9E3 0 3px,transparent 3.6px),
    radial-gradient(circle at 68% 62%,#C9E7FF 0 3px,transparent 3.6px),
    radial-gradient(circle at 42% 86%,#FFEFA0 0 2.6px,transparent 3.2px),
    radial-gradient(circle at 88% 14%,#DCCBFF 0 2.6px,transparent 3.2px),
    radial-gradient(circle at 8% 70%,#BDF2DE 0 2.4px,transparent 3px);
  background-size:96px 96px;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font-family:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.en{font-family:var(--fe);font-weight:600}
#app{max-width:1240px;margin:0 auto;padding:18px 28px 40px;min-height:100%}
:focus-visible{outline:3px solid var(--skyD);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.muted{color:var(--ink2)}
.h2{font-size:28px;line-height:1.15}

/* ---------- logo ---------- */
.logo{display:flex;align-items:center;gap:10px;line-height:1;flex:none}
.logo .badge{width:58px;height:58px;flex:none;border-radius:20px;border:var(--line);background:var(--mint);box-shadow:var(--popS);display:grid;place-items:center;transform:rotate(-7deg);position:relative}
.logo .badge svg{width:46px;height:46px}
.logo .words{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.logo .l1{font-size:16px;background:var(--lemon);border:2px solid var(--ink);border-radius:999px;padding:3px 10px 2px;transform:rotate(-4deg);margin-left:4px}
.logo .l2{font-size:34px;letter-spacing:.02em;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.logo .l2 span:nth-child(1){color:var(--straw)}
.logo .l2 span:nth-child(2){color:var(--lemon)}
.logo .l2 span:nth-child(3){color:var(--mint)}
.logo .l2 span:nth-child(4){color:var(--sky)}

/* ---------- top bar & tabs ---------- */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--card);border:var(--line);border-radius:999px;padding:5px;box-shadow:var(--popS);margin-left:10px}
.tabs button{display:flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:999px;font-size:19px;white-space:nowrap;position:relative}
.tabs button .ic{font-size:21px}
.tabs button.on{background:var(--straw);color:#fff}
.tabs .badge{position:absolute;top:-7px;right:-3px;min-width:23px;height:23px;border-radius:12px;background:var(--strawD);color:#fff;font-family:var(--fe);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:7px 16px 7px 12px;font-size:21px;white-space:nowrap}
.pill b{font-family:var(--fe);font-weight:700;font-size:23px}
.iconbtn{width:52px;height:52px;flex:none;border-radius:50%;background:var(--card);border:var(--line);box-shadow:var(--popS);display:grid;place-items:center;font-size:23px}
.back{display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 20px 0 14px;border-radius:999px;background:var(--card);border:var(--line);box-shadow:var(--popS);font-size:21px;white-space:nowrap}
.iconbtn:active,.btn:active,.tile:active,.mode:active,.choice:active,.letter:active,.back:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 26px;border-radius:999px;border:var(--line);box-shadow:var(--pop);font-size:22px;background:var(--straw);color:#fff;transition:transform .08s;white-space:nowrap}
.btn.y{background:var(--lemon);color:var(--ink)}
.btn.m{background:var(--mint);color:var(--ink)}
.btn.s{background:var(--sky);color:var(--ink)}
.btn.w{background:var(--card);color:var(--ink)}
.btn.sm{min-height:46px;font-size:19px;padding:0 18px;box-shadow:var(--popS)}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:28px;padding:24px}
.bar{height:16px;border-radius:10px;border:var(--line);background:#F7EEF6;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--lemon) 0 10px,#FFEDA8 10px 20px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.bar.pink i{background:repeating-linear-gradient(-45deg,var(--straw) 0 10px,#FFB3D8 10px 20px)}

/* face sticker */
.sticker{position:relative;width:var(--s,180px);height:var(--s,180px);flex:none}
.sticker .face{width:100%;height:100%;border-radius:50%;object-fit:cover;border:calc(var(--s,180px)*.045) solid #fff;outline:var(--line);box-shadow:0 6px 0 var(--ink);transform:rotate(-5deg);display:block;background:conic-gradient(from 30deg,#FFD6EA,#FFF0B3,#CFF3E5,#D8E9FF,#FFD6EA)}
.sticker .face.empty{display:grid;place-items:center;font-size:calc(var(--s,180px)*.4)}
.sticker .acc{position:absolute;top:calc(var(--s,180px)*-.2);left:50%;transform:translateX(-50%) rotate(-10deg);font-size:calc(var(--s,180px)*.38);filter:drop-shadow(0 3px 0 rgba(90,62,114,.35))}
.bubble{position:relative;background:var(--soft);border:var(--line);border-radius:20px;padding:10px 16px;font-size:21px;line-height:1.35;word-break:keep-all}
.bubble.up:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-11px;border:11px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble.up:after{content:"";position:absolute;top:-8px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--soft);border-top:0}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:24px}
.row1{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:stretch}
.hello{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:17px;background:var(--soft)}
.chip b{font-family:var(--fe);font-weight:700}
.minigift{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:18px;cursor:pointer}
.minigift .bx{width:48px;height:48px;flex:none;border-radius:15px;border:var(--line);background:var(--straw);display:grid;place-items:center;font-size:25px;transform:rotate(5deg)}
.minigift .bar{margin:5px 0 4px}
.today .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.today .count{font-family:var(--fe);font-weight:700;font-size:44px;line-height:1;white-space:nowrap}
.today .count small{font-size:22px;color:var(--ink2)}
.words20{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.w20{display:flex;align-items:center;gap:6px;border:2px solid var(--hair);border-radius:14px;padding:7px 9px;background:var(--soft);min-width:0}
.w20 .e{font-size:21px}
.w20 .t{font-family:var(--fe);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w20.done{background:var(--okbg);border-color:#9FE0C4}
.w20.done:after{content:"✓";margin-left:auto;font-family:var(--fe);font-weight:700;color:var(--mintD)}
.today .acts{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;margin:0 4px 12px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.tile{position:relative;overflow:hidden;text-align:left;border:var(--line);border-radius:22px;box-shadow:var(--pop);background:var(--c);padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;transition:transform .08s}
.tile:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 2.5px,transparent 3px);background-size:22px 22px;pointer-events:none}
.tile>*{position:relative;z-index:1}
.tile .em{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:25px}
.tile .nm{font-size:22px;margin-top:6px}
.tile .done{position:absolute;top:8px;right:10px;font-size:24px}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.8px solid var(--ink);background:#fff}
.dots i.on{background:var(--ink)}

/* ---------- village ---------- */
.village{padding:0;overflow:hidden}
.vhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 24px 16px}
.vhead .lv{border:var(--line);border-radius:999px;background:var(--lemon);padding:4px 14px;font-size:18px}
.vhead .next{margin-left:auto;min-width:260px;font-size:18px}
.vhead .next .bar{margin-top:5px}
.scene{position:relative;background:linear-gradient(var(--skyband) 0 110px,var(--grass) 110px);border-top:var(--line);padding:120px 18px 26px;min-height:300px}
.scene:before{content:"";position:absolute;left:-5%;right:-5%;top:84px;height:60px;background:radial-gradient(ellipse at 20% 100%,var(--grass2) 0 40%,transparent 41%),radial-gradient(ellipse at 70% 100%,var(--grass2) 0 45%,transparent 46%);pointer-events:none}
.sun{position:absolute;top:18px;right:34px;width:58px;height:58px;border-radius:50%;background:var(--lemon);border:var(--line);box-shadow:0 0 0 10px rgba(255,224,116,.35)}
.cloud{position:absolute;top:28px;height:26px;border-radius:20px;background:#fff;border:2px solid #CFE3F5}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border:2px solid #CFE3F5;border-bottom:none;border-radius:50% 50% 0 0}
.cloud:before{width:30px;height:20px;left:12px;top:-14px}
.cloud:after{width:22px;height:16px;left:36px;top:-10px}
.plots{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 8px;align-items:end}
.plot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:132px;position:relative}
.plot.deco{pointer-events:none}
.mon{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mon svg{width:84px;height:84px;display:block;overflow:visible}
.mon .bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.03,.97)}}
.mon.jump .bob{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.85)}40%{transform:translateY(-34px) scale(.92,1.08)}100%{transform:translateY(0)}}
.eyes{animation:blink 4.2s infinite;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shadow{width:58px;height:10px;border-radius:50%;background:rgba(90,62,114,.16);margin-top:-6px}
.tag{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:16px;line-height:1.4;margin-bottom:4px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--ink)}
.tag.new{background:var(--lemon)}
.say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 10px;white-space:nowrap;font-size:16px;margin-bottom:6px;z-index:3;animation:popx .3s cubic-bezier(.3,1.6,.5,1)}
.say b{font-family:var(--fe)}
@keyframes popx{from{transform:translateX(-50%) scale(.4);opacity:0}}
.egg svg{width:70px;height:84px;animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}55%{transform:rotate(0)}}
.egg.cracking svg{animation:crack .5s ease-in-out}
@keyframes crack{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.08)}50%{transform:rotate(14deg) scale(1.12)}75%{transform:rotate(-8deg) scale(1.05)}}
.hatched{animation:hatch .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hatch{from{transform:scale(.2) translateY(30px);opacity:0}}
.namebox{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);z-index:5;background:#fff;border:var(--line);border-radius:18px;box-shadow:var(--popS);padding:10px;display:flex;flex-direction:column;gap:8px;width:200px;margin-bottom:6px}
.namebox label{font-size:16px;color:var(--ink2)}
.namebox input{width:100%;border:var(--line);border-radius:12px;padding:6px 10px;font-size:20px;background:var(--soft)}
.namebox .r{display:flex;gap:6px}
.namebox .r button{flex:1;border:2px solid var(--ink);border-radius:999px;padding:5px 0;background:var(--straw);color:#fff;font-size:17px}
.namebox .r button.w{background:#fff;color:var(--ink)}
.vempty{grid-column:1/-1;text-align:center;padding:30px 10px;font-size:21px}
.vnote{padding:14px 24px 18px;border-top:2px dashed var(--hair);color:var(--ink2);font-size:17px;line-height:1.45}

/* 마을 — 합치기 · 하늘 · 우체통 */
.plots .tag{white-space:normal;max-width:118px;text-align:center;line-height:1.25;font-size:15px;padding:3px 10px;word-break:keep-all}
.tag.lv2{background:var(--lemon)}
.tag.lv3{background:var(--straw);color:#fff}
.mergebtn{border:var(--line);box-shadow:var(--popS);border-radius:999px;background:var(--lilac);padding:6px 18px;font-size:19px}
.mon svg{width:var(--w,84px);height:var(--w,84px)}
.modal .three{display:flex;align-items:center;justify-content:center;gap:6px;margin:22px 0}
.modal .three svg{width:92px;height:92px}
.modal .three .plus{font-size:36px}.modal .three .arrow{font-size:48px;margin:0 8px}
.modal .three .mystery{width:110px;height:110px;border-radius:50%;border:var(--line);background:var(--lemon);display:grid;place-items:center;font-size:60px;animation:wob 1.2s ease-in-out infinite}
.modal .three.merging .src{animation:suck .7s ease-in forwards}
@keyframes suck{to{transform:translateX(var(--dx)) scale(.2);opacity:0}}
.modal .result{margin:16px 0;animation:hatch .8s cubic-bezier(.3,1.6,.5,1)}
.modal .result svg{width:180px;height:180px}
.scene{overflow:hidden}
.scene.night{background:linear-gradient(#2E2A5E 0 110px,#7FC27A 110px)}
.scene.night:before{background:radial-gradient(ellipse at 20% 100%,#6DB46A 0 40%,transparent 41%),radial-gradient(ellipse at 72% 100%,#6DB46A 0 45%,transparent 46%)}
.moon{position:absolute;top:18px;right:40px;width:54px;height:54px;border-radius:50%;background:#FFF3B0;box-shadow:inset -14px -4px 0 #F2DC7A,0 0 18px rgba(255,243,176,.6)}
.twk{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFF7C2;animation:twk 2s ease-in-out infinite}
@keyframes twk{50%{opacity:.2;transform:scale(.6)}}
.fall{position:absolute;top:-30px;font-size:20px;pointer-events:none;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translate(40px,460px) rotate(300deg)}}
.flutter{position:absolute;top:70px;left:10%;font-size:28px;animation:flut 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes flut{25%{transform:translate(25vw,30px)}50%{transform:translate(45vw,-10px)}75%{transform:translate(65vw,40px)}100%{transform:translate(80vw,0)}}
.mon.walk{animation:wander 6s ease-in-out infinite}
.mon.walk.hatched{animation:hatch .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes wander{0%,100%{transform:translateX(0)}30%{transform:translateX(var(--wx,12px))}60%{transform:translateX(calc(var(--wx,12px) * -.6))}}
.heart{position:absolute;top:-10px;left:50%;font-size:30px;pointer-events:none;animation:hup 1.1s ease-out forwards;z-index:4}
@keyframes hup{from{transform:translate(-50%,10px) scale(.5);opacity:0}30%{opacity:1}to{transform:translate(-50%,-50px) scale(1.2);opacity:0}}
.mailbox{font-size:62px;line-height:1;filter:drop-shadow(0 3px 0 rgba(90,62,114,.35))}
.mailbox.ready{animation:wob 1.4s ease-in-out infinite;transform-origin:50% 90%}
.decoi{font-size:54px;line-height:1;display:inline-block;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(-6deg)}}
/* ---------- theme screen ---------- */
.theme{display:grid;grid-template-columns:400px 1fr;gap:30px;align-items:start}
.thero{position:relative;overflow:hidden;background:var(--c);border:var(--line);box-shadow:var(--pop);border-radius:30px;padding:26px}
.thero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.5) 0 3px,transparent 3.5px);background-size:26px 26px;pointer-events:none}
.thero>*{position:relative;z-index:1}
.thero .big{font-size:70px;line-height:1}
.thero .nm{font-size:44px;margin-top:10px}
.thero .ennm{font-size:20px;color:var(--ink2)}
.thero .tstat{margin-top:16px;font-size:20px}
.wordlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.wchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:5px 12px 5px 10px;font-size:17px}
.wchip .en{font-size:16px}
.wchip .lv{display:flex;gap:2px}
.wchip .lv i{width:7px;height:7px;border-radius:50%;background:rgba(90,62,114,.2)}
.wchip .lv i.on{background:var(--ink)}
.modes{display:flex;flex-direction:column;gap:16px}
.mode{display:flex;align-items:center;gap:20px;text-align:left;background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:26px;padding:16px 22px 16px 16px;transition:transform .08s}
.mode .mi{width:70px;height:70px;flex:none;border-radius:22px;border:var(--line);display:grid;place-items:center;font-size:36px;background:var(--mc)}
.mode .mt{font-size:26px;display:block}
.mode .md{font-size:18px;color:var(--ink2);margin-top:3px}
.mode .mr{margin-left:auto;font-size:17px;white-space:nowrap;background:#FFF6D6;border:2px solid var(--ink);border-radius:999px;padding:5px 13px}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.road{flex:1;position:relative;height:64px}
.road .line{position:absolute;left:10px;right:44px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(90,62,114,.25) 0 14px,transparent 14px 24px)}
.road .stop{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
.road .stop.ok{background:var(--mint)}
.road .stop.no{background:var(--straw)}
.road .flag{position:absolute;right:0;top:50%;transform:translateY(-55%);font-size:36px}
.road .me{position:absolute;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;transition:left .5s cubic-bezier(.3,1.4,.5,1);z-index:2}
.road .me img,.road .me .face{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff;outline:var(--line);display:grid;place-items:center;font-size:26px;background:#FFE6F1}
.combo{font-size:20px;background:var(--lemon);border:var(--line);border-radius:999px;padding:7px 15px;box-shadow:var(--popS);white-space:nowrap}
.combo.hide{visibility:hidden}
.qwrap{max-width:900px;margin:0 auto}
.qcard{position:relative;background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:32px;padding:26px 30px;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qcard .ask{font-size:21px;color:var(--ink2);margin-bottom:8px}
.qcard .qemoji{font-size:82px;line-height:1.1}
.qcard .qword{font-size:78px;line-height:1.05}
.qcard .qko{font-size:46px;line-height:1.15;margin-top:6px;word-break:keep-all}
.qcard .say2{position:absolute;right:20px;top:20px}
.qtag{position:absolute;left:20px;top:20px;font-size:16px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--lemon)}
.listen{width:146px;height:146px;border-radius:50%;background:var(--sky);border:var(--line);box-shadow:var(--pop);font-size:62px;display:grid;place-items:center}
.listen:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.listen.playing{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:var(--pop),0 0 0 0 rgba(90,169,240,.5)}100%{box-shadow:var(--pop),0 0 0 28px rgba(90,169,240,0)}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.choice{min-height:86px;border-radius:26px;background:var(--card);border:var(--line);box-shadow:var(--pop);font-size:33px;padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .08s,background .15s;word-break:keep-all}
.choice .key{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--ink);font-family:var(--fe);font-weight:700;font-size:18px;display:grid;place-items:center;background:var(--soft)}
.choice.ok{background:var(--okbg)}
.choice.ok .key{background:var(--mint)}
.choice.no{background:var(--nobg);animation:shake .4s}
.choice.no .key{background:var(--straw);color:#fff}
.choice.dim{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
.slot{width:62px;height:74px;border-radius:16px;border:2.5px dashed rgba(90,62,114,.4);display:grid;place-items:center;font-size:40px;background:var(--soft)}
.slot.fill{border:var(--line);background:#FFF6D6;box-shadow:var(--popS)}
.slot.hintc{background:#E3F1FF}
.slots.no{animation:shake .4s}
.slots.ok .slot{background:var(--okbg)}
.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px}
.letter{width:70px;height:78px;border-radius:18px;background:var(--card);border:var(--line);box-shadow:var(--pop);font-size:42px;display:grid;place-items:center;transition:transform .08s}
.letter.used{visibility:hidden}
.spellbar{display:flex;justify-content:center;gap:14px;margin-top:24px}
.studycard{padding:0;overflow:hidden;min-height:0;display:block}
.studycard .band{position:relative;height:200px;display:grid;place-items:center;font-size:118px;border-bottom:var(--line);background:var(--c)}
.studycard .band:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 3px,transparent 3.5px);background-size:26px 26px}
.studycard .body{padding:22px 30px 30px}

.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.25,.5,1),visibility 0s .32s}
.sheet.show{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.3,1.25,.5,1)}
.sheet .in{max-width:960px;margin:0 auto;border:var(--line);border-bottom:none;border-radius:32px 32px 0 0;padding:22px 32px 28px;display:flex;align-items:center;gap:24px;background:var(--okbg)}
.sheet.no .in{background:var(--nobg)}
.sheet .msg{font-size:33px;line-height:1.15}
.sheet .ans{font-size:25px;margin-top:8px}
.sheet .ex{font-size:20px;margin-top:8px;color:var(--ink2);line-height:1.4}
.sheet .ex .en{color:var(--ink);font-weight:500}
.sheet .go{margin-left:auto;flex:none}

/* ---------- result ---------- */
.result{max-width:1080px;margin:10px auto 0;text-align:center;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.result .sticker{margin:40px auto 10px}
.result .title{font-size:44px;margin-top:20px}
.result .score{font-family:var(--fe);font-weight:700;font-size:80px;line-height:1;margin-top:8px}
.result .score small{font-size:38px;color:var(--ink2)}
.result .earn{display:inline-flex;gap:10px;align-items:center;font-size:26px;margin-top:14px;background:var(--lemon);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:9px 22px}
.result .bonus{font-size:19px;margin-top:10px}
.result .side{text-align:left;display:flex;flex-direction:column;gap:20px}
.result .acts{display:flex;gap:16px;flex-wrap:wrap}

/* ---------- rewards ---------- */
.rhead{display:flex;align-items:center;gap:30px}
.rtotal{font-size:22px}
.rtotal b{display:block;font-family:var(--fe);font-weight:700;font-size:72px;line-height:1}
.groad{position:relative;flex:1;height:120px;margin:0 30px 0 10px}
.groad .base{position:absolute;left:0;right:0;top:60px;height:20px;border-radius:12px;background:#F7EEF6;border:var(--line);overflow:hidden}
.groad .base i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--lemon) 0 12px,#FFEDA8 12px 24px)}
.groad .gm{position:absolute;top:30px;transform:translateX(-50%);text-align:center}
.groad .gm .gb{width:54px;height:54px;margin:0 auto;border-radius:16px;border:var(--line);background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:var(--popS)}
.groad .gm.reached .gb{background:var(--straw)}
.groad .gm .gl{font-family:var(--fe);font-weight:700;font-size:18px;margin-top:8px}
.groad .who{position:absolute;top:-4px;transform:translateX(-50%)}
.groad .who img,.groad .who .face{width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid #fff;outline:var(--line);display:grid;place-items:center;font-size:22px;background:#FFE6F1}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin-top:24px}
.gift{border:var(--line);box-shadow:var(--pop);border-radius:28px;padding:22px;background:var(--card);display:flex;flex-direction:column;gap:14px}
.gift.reached{background:#FFE6F2}
.gift.got{background:var(--okbg)}
.gift .gt{display:flex;align-items:center;gap:14px}
.gift .gi{width:64px;height:64px;flex:none;border-radius:20px;border:var(--line);display:grid;place-items:center;font-size:34px;background:#F7EEF6}
.gift.reached .gi{background:var(--straw);transform:rotate(-6deg)}
.gift.got .gi{background:var(--mint)}
.gift .gs{font-family:var(--fe);font-weight:700;font-size:30px}
.gift .gst{font-size:18px;color:var(--ink2)}
.wish{width:100%;height:58px;border-radius:18px;border:var(--line);background:var(--soft);padding:0 18px;font-size:22px}
.wish::placeholder{color:#BBA9C9}
.gift .wishshow{font-size:25px;word-break:keep-all;min-height:32px}

/* wrong note */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:20px}
.wcard{display:flex;align-items:center;gap:14px;background:var(--card);border:var(--line);box-shadow:var(--popS);border-radius:22px;padding:14px 16px}
.wcard .we{font-size:38px}
.wcard .ww{font-size:25px}
.wcard .wk{font-size:18px;color:var(--ink2)}
.wcard .iconbtn{margin-left:auto;width:46px;height:46px;font-size:20px}
.empty{text-align:center;padding:50px 20px}
.empty .big{font-size:78px}
.empty p{font-size:23px;margin-top:12px}

/* records */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.stat{background:var(--card);border:var(--line);box-shadow:var(--popS);border-radius:24px;padding:18px 18px 16px}
.stat .sv{font-family:var(--fe);font-weight:700;font-size:42px;line-height:1.05}
.stat .sv small{font-size:21px;color:var(--ink2)}
.stat .sl{font-size:17px;color:var(--ink2);margin-top:6px}
.recgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;margin-top:24px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:10px;height:220px;padding-top:26px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .b i{font-style:normal;display:block;width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--sky);border:2px solid var(--ink);min-height:4px;position:relative}
.bars .b.today i{background:var(--straw)}
.bars .b i span{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-family:var(--fe);font-weight:700;font-size:15px}
.bars .b em{font-style:normal;font-size:14px;color:var(--ink2)}
.logs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto}
.logrow{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:18px;padding:10px 14px;background:var(--soft)}
.logrow .le{font-size:28px}
.logrow .lt{font-size:19px}
.logrow .ld{font-size:15px;color:var(--ink2)}
.logrow .ls{margin-left:auto;font-family:var(--fe);font-weight:700;font-size:19px;white-space:nowrap}

/* setup */
.setup{max-width:760px;margin:30px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.setup .title{font-size:46px;line-height:1.2;margin-top:20px}
.setup .sub{font-size:22px;color:var(--ink2)}
.pickface{margin:26px auto 16px;width:240px;height:240px;border-radius:50%;border:3px dashed var(--ink);display:grid;place-items:center;background:#fff;font-size:24px;line-height:1.4;overflow:hidden}
.pickface .cam{font-size:68px}
.pickface img{width:100%;height:100%;object-fit:cover}

/* parent */
.prow{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:2px dashed var(--hair)}
.prow:last-child{border-bottom:none}
.prow .pt{font-size:23px}
.prow .pd{font-size:17px;color:var(--ink2);margin-top:2px}
.prow .pa{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* modal / toast / fx */
.modal{position:fixed;inset:0;z-index:50;background:rgba(90,62,114,.5);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--card);border:var(--line);box-shadow:0 9px 0 var(--ink);border-radius:34px;padding:32px;max-width:560px;width:100%;text-align:center;animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .sticker,.modal .msvg{margin:20px auto 6px}
.modal .msvg svg{width:130px;height:130px}
.modal .mt{font-size:34px;line-height:1.25;margin-top:14px}
.modal .md{font-size:21px;color:var(--ink2);margin-top:10px;line-height:1.4}
.modal .acts{display:flex;justify-content:center;gap:14px;margin-top:24px;flex-wrap:wrap}
.modal .field{width:100%;height:60px;border:var(--line);border-radius:18px;padding:0 18px;font-size:24px;background:var(--soft);margin-top:16px;text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center;margin-top:20px}
.pinpad button{height:70px;border-radius:20px;border:var(--line);box-shadow:var(--popS);background:#fff;font-family:var(--fe);font-weight:700;font-size:30px}
.pinpad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pindots{display:flex;justify-content:center;gap:14px;margin-top:18px}
.pindots i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.pindots.no{animation:shake .4s}
.toast{visibility:hidden;position:fixed;top:20px;left:50%;transform:translate(-50%,-200%);z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:13px 26px;font-size:21px;transition:transform .35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.toast.show{visibility:visible;transform:translate(-50%,0)}
.flystar{position:fixed;z-index:70;font-size:44px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.3,.6,1),opacity .75s}
#burst{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
#burst span{position:absolute;top:-50px}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}
.popface{position:fixed;right:40px;bottom:200px;z-index:31;pointer-events:none;animation:faceup .9s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes faceup{0%{transform:translateY(120px) scale(.3) rotate(-30deg);opacity:0}25%{opacity:1}100%{transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .tabs button .tx{display:none}
  .tabs button{padding:0 14px}
}
@media (max-width:1000px){
  #app{padding-bottom:120px}
  .tabs{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);margin:0;box-shadow:var(--pop);z-index:20;padding:7px}
  .tabs button .tx{display:inline}
  .row1,.theme,.result,.recgrid{grid-template-columns:1fr}
  .result .side{text-align:center;align-items:center}.result .acts{justify-content:center}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .words20{grid-template-columns:repeat(4,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  #app{padding:14px 16px 110px}
  .logo .l2{font-size:26px}.logo .badge{width:48px;height:48px}
  .tabs button .tx{display:none}
  .tiles,.words20,.stats{grid-template-columns:repeat(2,1fr)}
  .choices{grid-template-columns:1fr}
  .qcard .qword{font-size:54px}
  .rhead{flex-direction:column;align-items:stretch}
  .sheet .in{flex-wrap:wrap}
  .letter{width:56px;height:64px;font-size:34px}
  .slot{width:48px;height:60px;font-size:32px}
  .plots{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .mon svg{width:72px;height:72px}
}
/* ===== 휴대폰 세로 화면 ===== */
@media (max-width:640px){
  .row1>*,.recgrid>*,.theme>*,.result>*{min-width:0}
  .panel{padding:18px;border-radius:24px}
  .topbar{gap:8px;margin-bottom:14px}
  .logo{gap:6px}.logo .badge{width:42px;height:42px;border-radius:14px}.logo .badge svg{width:32px;height:32px}
  .logo .l1{font-size:12px;padding:2px 8px 1px}.logo .l2{font-size:24px;-webkit-text-stroke:5px var(--ink);text-shadow:0 3px 0 var(--ink)}
  .pill{font-size:17px;padding:5px 12px 5px 9px}.pill b{font-size:19px}
  .iconbtn{width:44px;height:44px;font-size:20px}
  .h2{font-size:24px}
  .minigift{font-size:16px}
  .today .head{flex-wrap:wrap}
  .today .count{font-size:36px}
  /* 퀴즈 */
  .qtop{flex-wrap:wrap;gap:8px 10px}
  .qtop .road{order:5;flex:1 1 calc(100% - 40px);margin:0 20px;height:56px}
  .today .acts .btn{flex:1 1 auto;font-size:19px;padding:0 14px}
  .qtop .back{font-size:17px}
  .spellbar{flex-wrap:wrap;justify-content:center}
  .spellbar .btn.sm{font-size:16px;padding:0 12px}
  /* 선물 */
  .groad{flex:none;height:120px;margin:16px 28px 0}
  .gifts{grid-template-columns:1fr;gap:16px}
  .gift{padding:18px}
  /* 부모 메뉴 */
  .prow{flex-wrap:wrap;gap:10px}
  .prow>div:not(.pa):not(.sticker):not(.en){flex:1 1 170px;min-width:0}
  .prow>.sticker{flex:none;--s:64px !important}
  .prow .wish{flex:1 1 150px !important;min-width:0}
  .prow[style]{padding-left:6px !important}
  .prow .en[style]{width:64px !important;font-size:20px !important}
  .prow .pa{margin-left:0;justify-content:flex-start}
  .prow .pt{font-size:20px}.prow .pd{font-size:15px}
}
/* 상점 · 보금자리 · 배경 · 전설 */
.shopm .box{max-width:820px}
.wallet{font-size:24px;margin:6px 0 10px}.wallet b{font-family:var(--fe)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:56vh;overflow:auto;padding:6px;text-align:center}
.ssec{grid-column:1/-1;text-align:left;font-size:20px;margin:8px 0 0;padding-bottom:4px;border-bottom:2px dashed var(--hair)}
.sitem{display:flex;flex-direction:column;align-items:center;gap:2px;border:var(--line);border-radius:18px;background:#fff;padding:8px 6px;box-shadow:var(--popS);font-size:18px;font-family:inherit;color:var(--ink)}
.sitem .si{font-size:44px;line-height:1.1}
.sitem small{font-size:14px;color:var(--ink2)}
.sitem .price{margin-top:4px;background:#FFE680;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:700}
.sitem.poor{opacity:.45}
.mergebtn b{font-family:var(--fe)}
.homep{min-width:130px}
.homebox{position:relative;width:132px;height:110px;cursor:pointer}
.homebox svg.hb,.homebox svg.hf{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.homebox svg.hf{z-index:2}
.homebox .inhome{position:absolute;transform:translateX(-50%);z-index:1}
.homebox .inhome svg{width:var(--hw)!important;height:var(--hw)!important}
.homebox .zz{position:absolute;right:-14px;top:-10px;font-size:20px;animation:floaty 2.4s ease-in-out infinite}
.homebox .hplus{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:3;width:38px;height:38px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:24px;animation:wob 1.6s ease-in-out infinite}
.homebox.legh{filter:drop-shadow(0 0 10px #FFD36E)}
.tag.home{background:#FFE3F3}.tag.empty{background:#F2F0F7;color:var(--ink2)}
.hpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:42vh;overflow:auto;margin-top:14px;padding:4px}
.hp{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:var(--ink)}
.hp .hm svg{width:64px;height:64px}.hp small{font-size:13px;line-height:1.2;word-break:keep-all}
.tag.shiny{background:linear-gradient(90deg,#FFE3F3,#FFF6C8,#DDF4FF)}
.mon.sh svg,.hp.sh svg{filter:drop-shadow(0 0 6px #FFE066) drop-shadow(0 0 2px #fff) saturate(1.25)}
.mon.sh:after{content:"✨";position:absolute;right:-6px;top:-4px;font-size:20px;animation:twk 1.6s infinite}
.tag.lv4{background:linear-gradient(90deg,#FF8FB8,#FFD36E,#8FE3A8,#8FD3FF,#C9A4FF);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.mon.leg{isolation:isolate}

.mon.leg svg{filter:drop-shadow(0 0 6px #fff) saturate(1.3)}
.mon.leg:after{content:"✨";position:absolute;left:-8px;bottom:12px;font-size:22px;animation:twk 1.3s infinite}
.modal .result.legr{filter:drop-shadow(0 0 18px #FFD36E)}
@keyframes legspin{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(-8px)}}
.scene.themed:before{background:radial-gradient(ellipse at 20% 100%,var(--grass2) 0 40%,transparent 41%),radial-gradient(ellipse at 72% 100%,var(--grass2) 0 45%,transparent 46%)}
.bgdeco{position:absolute;inset:0;pointer-events:none}
.bgdeco .sk{position:absolute;font-size:30px;animation:floaty 5s ease-in-out infinite}
.bgdeco .gd{position:absolute;font-size:26px;opacity:.9}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bgopt{border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:var(--ink)}
.bgopt .sw{width:64px;height:48px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px}
.bgopt b{font-size:16px}.bgopt small{font-size:12px;color:var(--ink2)}
.bgopt.on{background:#FFF3B0;box-shadow:0 4px 0 var(--ink)}
.bgopt.lock{opacity:.55;filter:grayscale(.6)}
@media (max-width:640px){

function blank(){

    rewards:[{at:100,wish:'',got:false,seen:false},{at:200,wish:'',got:false,seen:false},{at:300,wish:'',got:false,seen:false}],

}
function load(){
  let raw=null;
  try{ if(HAS_ANDROID && Android.loadData) raw=Android.loadData(); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  let s=null; try{ s=raw?JSON.parse(raw):null; }catch(e){ s=null; }
  return Object.assign(blank(), s||{});
}
let S = load();
function save(){
  const j=JSON.stringify(S);
  try{ localStorage.setItem(KEY,j); }catch(e){}
  try{ if(HAS_ANDROID && Android.saveData) Android.saveData(j); }catch(e){}
}

function speak(t){
  try{ if(HAS_ANDROID && Android.speak){ Android.speak(t); return; } }catch(e){}
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }
}
let AC=null;
function tone(seq){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type,vol])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8;
    });
  }catch(e){}
}
const sfx={
  ok:()=>tone([[784,.12,'triangle'],[1046,.22,'triangle']]),

  boing:()=>tone([[392,.08,'sine',.2],[587,.12,'sine',.2]]),
  win:()=>tone([[523,.12,'triangle'],[659,.12,'triangle'],[784,.12,'triangle'],[1046,.35,'triangle']])

function burst(n){
  const c=document.createElement('div'); c.id='burst'; document.body.appendChild(c);
  const icons=['⭐','✨','💖','🎉','🌟','💫','🌸'];
  for(let i=0;i<(n||40);i++){
    const s=document.createElement('span'); s.textContent=icons[i%icons.length];
    const x=Math.random()*100, sz=20+Math.random()*26, dur=1.3+Math.random()*.9;
    s.style.cssText=`left:${x}%;font-size:${sz}px;transition:transform ${dur}s cubic-bezier(.2,.6,.4,1),opacity ${dur}s`;
    c.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.transform=`translate(${(Math.random()-.5)*160}px,${innerHeight+100}px) rotate(${Math.random()*540-270}deg)`; s.style.opacity='.2'; }));
  }
  setTimeout(()=>c.remove(),2400);
}
function flyStar(fromEl, n){
  const to=$('#starPill'); if(!fromEl||!to) return;
  const a=fromEl.getBoundingClientRect(), b=to.getBoundingClientRect();
  for(let i=0;i<Math.min(n,3);i++){
    const s=document.createElement('div'); s.className='flystar'; s.textContent='⭐';
    s.style.left=(a.left+a.width/2-22)+'px'; s.style.top=(a.top+a.height/2-22)+'px';
    document.body.appendChild(s);
    setTimeout(()=>{ s.style.transform=`translate(${b.left+20-(a.left+a.width/2-22)}px,${b.top+4-(a.top+a.height/2-22)}px) scale(.5)`; s.style.opacity='.4'; },30+i*110);
    setTimeout(()=>{ s.remove(); const p=$('#starPill'); if(p){ p.querySelector('b').textContent=S.stars; p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } },820+i*110);

/* =========================================================
   오늘의 단어 20개
   ========================================================= */
function daily(){
  if(S.daily && S.daily.d===dkey() && S.daily.words && S.daily.words.length) return S.daily;
  const unseen = shuffle(ALL.filter(x=>!S.words[x.w])).sort((a,b)=>a.tl-b.tl); /* 기초 단어부터 */
  const review = shuffle(ALL.filter(x=>S.words[x.w] && !mastered(x.w))).sort((a,b)=>((b.w in S.wrong)-(a.w in S.wrong)) || (lv(a.w)-lv(b.w)));
  const done = shuffle(ALL.filter(x=>mastered(x.w)));
  let pickN = unseen.slice(0, DAILY_NEW);
  let pickR = review.slice(0, DAILY_N - pickN.length);
  let list = pickN.concat(pickR);
  for(const src of [unseen.slice(DAILY_NEW), done]){ for(const x of src){ if(list.length>=DAILY_N) break; if(!list.includes(x)) list.push(x); } }
  /* 새 단어끼리, 복습 단어끼리 주제 순서로 정리 */
  S.daily = {d:dkey(), words:list.slice(0,DAILY_N).map(x=>x.w), done:[], newN:Math.min(pickN.length,DAILY_N), bonus:false};
  save();
  return S.daily;
}
function dailyMark(w){
  const D=daily();
  if(!D.words.includes(w) || D.done.includes(w)) return;
  D.done.push(w);
  if(D.done.length>=D.words.length && !D.bonus){
    D.bonus=true; addStars(DAILY_BONUS); today().mission=true;
    setTimeout(()=>{ toast(`🎯 오늘의 단어 20개 완료! 보너스 ⭐${DAILY_BONUS}`); burst(50); sfx.win(); },500);
  }
}

let newEggs=0;
function addStars(n){
  if(n<=0) return;
  const before=Math.floor(S.stars/PER_FRIEND);
  S.stars+=n; today().stars+=n;
  const after=Math.floor(S.stars/PER_FRIEND);
  if(after>before){ newEggs+=after-before; ensureFriends(); }
}
function markResult(w, ok){
  const r=rec(w), d=today();
  d.q++;
  if(ok){
    d.ok++; r.c++; r.lv=Math.min(MASTER,r.lv+1);
    if(w in S.wrong){ S.wrong[w]++; if(S.wrong[w]>=2) delete S.wrong[w]; }
    dailyMark(w);
  }else{
    r.x++; r.lv=Math.max(0,r.lv-1); S.wrong[w]=0;
  }
}

function wireVillage(autoAsk){
  const el=$('#plots'); if(!el) return;
  el.querySelectorAll('.mon .bob').forEach((b,k)=>b.style.animationDelay='-'+(rnd(k,4)*1.8).toFixed(2)+'s');
  el.querySelectorAll('.eyes').forEach((b,k)=>b.style.animationDelay='-'+(rnd(k,6)*4).toFixed(2)+'s');
  el.querySelectorAll('.mon').forEach((m,k)=>{ m.style.setProperty('--wx',((k%2?1:-1)*(10+(k*7)%14))+'px'); m.style.animationDelay='-'+((k*1.3)%6).toFixed(1)+'s'; m.classList.add('walk'); });
  el.onclick=e=>{
    if(e.target.closest('[data-act="mail"]')){ openMail(); return; }
    const egg=e.target.closest('[data-egg]'); if(egg){ hatch(+egg.dataset.egg); return; }
    const mon=e.target.closest('[data-mon]'); if(mon){ jump(+mon.dataset.mon); return; }
    const hm=e.target.closest('[data-home]'); if(hm) openHome(+hm.dataset.home);
  };
  el.onkeydown=e=>{ const mon=e.target.closest('[data-mon]'); if(mon&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); jump(+mon.dataset.mon); return; } const hm=e.target.closest('[data-home]'); if(hm&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openHome(+hm.dataset.home); } };
  const mb=document.querySelector('[data-merge]'); if(mb) mb.onclick=()=>askMerge();
  const ob=document.querySelector('[data-objm]'); if(ob) ob.onclick=()=>openObjMerge();
  const dx=document.querySelector('[data-dex]'); if(dx) dx.onclick=()=>openDex();
  const sb=document.querySelector('[data-shop]'); if(sb) sb.onclick=()=>openShop();
  const bb=document.querySelector('[data-bgpick]'); if(bb) bb.onclick=()=>openBgPicker();
  const fr=S.friends, can=[1,2,3].some(l=>fr.filter(f=>freeF(f)&&fLv(f)===l).length>=3);
  if(autoAsk!==false && view==='village' && can && S.mergeAsked!==fr.length && !$('.modal')){ S.mergeAsked=fr.length; save(); timers.push(setTimeout(()=>{ if(!$('.modal')) askMerge(); },800)); }
}
function refreshVillage(){ const v=$('#village'); if(!v) return; v.outerHTML=villageHTML(); wireVillage(false); }

  if(S.mail===dkey()){ sfx.boing(); toast('선물은 내일 또 와요'); return; }
  const d=pickDeco(); S.mail=dkey(); S.decos=(S.decos||[]).concat(d).slice(-60); save();
  sfx.win(); burst(30);
  modal(`<div class="mt">오늘의 선물이 왔어요!</div><div style="font-size:150px;line-height:1.15;margin-top:10px">${d}</div>
    <div class="acts"><button class="btn" onclick="closeModal();refreshVillage()">마을에 놓기</button></div>`);
}
function openNameBox(i){
  closeNameBox();

  const f=S.friends[i];
  const box=document.createElement('form'); box.className='namebox';

function closeNameBox(){ document.querySelectorAll('.namebox').forEach(b=>b.remove()); }
function jump(i, text){
  const m=document.querySelector(`[data-mon="${i}"]`); if(!m) return;
  m.classList.remove('jump'); void m.offsetWidth; m.classList.add('jump'); sfx.boing();
  const h=document.createElement('span'); h.className='heart'; h.textContent=pick(['💖','💕','💗','✨']); m.appendChild(h); setTimeout(()=>h.remove(),1100);
  m.querySelectorAll('.say').forEach(s=>s.remove());
  const f=S.friends[i], s=document.createElement('div'); s.className='say';
  if(text) s.textContent=text;
  else if(f.kind==='obj') s.textContent=`${spName(f)}${batchimEnd(spName(f))?'이에요':'예요'}!`;
  else if(f.food&&Math.random()<.4){ s.textContent=`${f.food} 냠냠! 맛있어!`; }
  else if(f.acc&&Math.random()<.3){ s.textContent=`${f.acc} 나 멋지지?`; }
  else if(f.sp==='poop') s.textContent='뿌직! 😆';
  else{
    const known=ALL.filter(x=>S.words[x.w] && S.words[x.w].c>0);
    const x=pick(known.length?known:ALL.slice(0,30));
    s.innerHTML=`<b>${x.w}!</b> ${x.k}`; setTimeout(()=>speak(x.w),150);
  }
  m.appendChild(s); setTimeout(()=>s.remove(),2000);
}
function batchimEnd(w){ const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0&&c%28!==0; }
function hatch(i){
  const b=document.querySelector(`[data-egg="${i}"]`); if(!b) return;

  setTimeout(()=>{
    const f=S.friends[i]; f.hatched=true; f.born=dkey(); f.name=funnyName(f); save();
    refreshVillage(); sfx.win(); burst(30);
    const m=document.querySelector(`[data-mon="${i}"]`); if(m) m.classList.add('hatched');
    toast(`🐣 ${f.sh?'✨반짝반짝 ':''}${f.name} 친구가 태어났어요!`);
    setTimeout(()=>jump(i,`안녕, 나는 ${f.name}!`),500);
  },520);
}
function askMerge(){
  const fr=S.friends;
  const cnt=l=>fr.filter(f=>freeF(f)&&fLv(f)===l).length;
  const lv = cnt(3)>=3 ? 3 : cnt(2)>=3 ? 2 : 1;
  const three=fr.map((f,i)=>({f,i})).filter(x=>freeF(x.f)&&fLv(x.f)===lv).slice(0,3);
  if(three.length<3) return;
  modal(`<div class="mt">${lv===3?'왕 친구 셋을 합쳐서<br>🌈 전설의 친구로 만들까?':'친구 셋을 합쳐서<br>더 큰 친구로 만들까?'}</div>
    <div class="three" id="three">${three.map((x,k)=>`<span class="src" style="--dx:${(1-k)*110+170}px">${mon(SP[x.f.sp]?x.f.sp:'slime')}</span>${k<2?'<span class="plus">+</span>':''}`).join('')}<span class="arrow">➜</span><span class="mystery">❓</span></div>
    <div class="acts"><button class="btn" id="myes">응! 합칠래 ✨</button><button class="btn w" id="mno">그대로 둘래</button></div>`);
  $('#mno').onclick=()=>closeModal();
  $('#myes').onclick=()=>{
    $('#three').classList.add('merging'); sfx.boing();
    setTimeout(()=>{
      const r=Math.random(), keep=three[0].f, shiny=three.some(x=>x.f.sh); let made;
      if(lv===3){ const sp=pick(three.map(x=>x.f.sp)); made = {name:`전설의 ${SP[sp]?SP[sp].ko:'친구'}`,sp,lv:4,hatched:true,sh:shiny}; }
      else if(lv===1) made = r<.6 ? {name:'',sp:pick(three.map(x=>x.f.sp)),lv:2,hatched:true,sh:shiny} : {name:'',sp:keep.sp,kind:'obj',obj:pick(['house','tree','rainbow']),lv:2,hatched:true};
      else made = r<.5 ? {name:'',sp:pick(three.map(x=>x.f.sp)),lv:3,hatched:true,sh:shiny} : {name:'',sp:keep.sp,kind:'obj',obj:'castle',lv:3,hatched:true};
      const bonus=mergeBonus(made,three.map(x=>x.f));
      const idx=new Set(three.map(x=>x.i));
      S.friends=fr.filter((_,i)=>!idx.has(i)); S.friends.push(made); S.mergeAsked=S.friends.length; save();
      const nm = made.kind==='obj' ? OBJ[made.obj].ko : made.lv===4 ? made.name : `${made.lv===3?'왕':'큰'} ${spName(made)}`;
      $('.modal .box').innerHTML=`<div class="mt">짜잔! ${nm}${made.kind==='obj'?(batchimEnd(nm)?'이':'가')+' 생겼어!':' 친구가 됐어!'}</div>
        <div class="result ${made.lv===4?'legr':''}"><span class="mon" style="--w:180px">${made.kind==='obj'?OBJ[made.obj].svg():mon(SP[made.sp]?made.sp:'slime')+itemSpans(made)}</span></div>
        ${bonus?`<div class="bonus">🎁 덤으로 <b>${bonus.e} ${bonus.ko}</b>${bonus.k==='acc'?'도 쓰고 있어요!':'도 들고 왔어요!'}</div>`:''}
        <div class="acts"><button class="btn" id="mok">좋아! 🎉</button></div>`;
      sfx.win(); burst(70);
      $('#mok').onclick=()=>{ closeModal(); refreshVillage(); };
    },750);
  };
}

    const w=wallet();

    if(it.food||it.acc){ /* 줄 친구를 고르면 바로 사요 */

}

function pickWords(pool,n){ return shuffle(pool).sort((a,b)=>lv(a.w)-lv(b.w)+(Math.random()-.5)*1.6).slice(0,Math.min(n,pool.length)); }
function startTheme(id,mode){
  const items=pickWords(ALL.filter(x=>x.t===id),10).map(x=>({x,mode}));
  begin({title:TBYID[id].name+' · '+MODES[mode].t, theme:id, mode, items});

function startDaily(){
  const D=daily();

  const sw=shuffle(ws).filter(w=>sentParts(BYW[w])).sort((a,b)=>BYW[a].ex.length-BYW[b].ex.length).slice(0,2);
  const items=shuffle(ws.filter(w=>!sw.includes(w))).map(w=>({x:BYW[w],mode:pick(['word','meaning','listen','word','meaning','spell'])}))
    .concat(sw.map(w=>({x:BYW[w],mode:'sent'})));
  begin({title:'오늘의 단어 퀴즈', from:'home', mode:'daily', items});
}
function startWrong(){
  const ws=wrongList(); if(!ws.length) return;
  const items=shuffle(ws).slice(0,10).map(w=>({x:BYW[w],mode:pick(['word','meaning','spell'])}));
  begin({title:'오답 다시 풀기', from:'wrong', mode:'wrong', items});
}
function begin(o){
  Q=Object.assign({i:0,score:0,earned:0,combo:0,best:0,missed:[],res:[]},o);
  view='quiz'; ctx={theme:o.theme, from:o.from}; clearTimers(); render(); window.scrollTo(0,0);
}
const HOMO=[['sun','son'],['two','too','to'],['four','for'],['right','write'],['sea','see'],['by','buy'],['meet','meat'],['know','no'],['hear','here'],['one','won'],['hour','our']];
function sameSense(a,b){ const A=a.k.split(/,\s*/), B=b.k.split(/,\s*/); return A.some(t=>B.some(u=>t===u||t.includes(u)||u.includes(t))); }
function homo(a,b){ const x=a.w.toLowerCase(), y=b.w.toLowerCase(); return HOMO.some(g=>g.includes(x)&&g.includes(y)); }
function distractors(x,field,n){
  const okD=y=>y.w!==x.w && !sameSense(x,y) && !homo(x,y);
  let pool=ALL.filter(y=>y.t===x.t && okD(y));
  if(!Q.theme) pool=pool.concat(shuffle(ALL.filter(y=>y.t!==x.t && okD(y))).slice(0,6));
  const seen=new Set([x[field]]), out=[];
  for(const y of shuffle(pool)){ if(!seen.has(y[field])){ seen.add(y[field]); out.push(y); } if(out.length>=n) break; }
  return out;
}
function roadHTML(){
  const n=Q.items.length, pos=j=>`calc(10px + (100% - 64px) * ${n>1?j/(n-1):0})`;
  return `<div class="road"><div class="line"></div>
    ${Q.items.map((_,j)=>`<div class="stop ${Q.res[j]===true?'ok':Q.res[j]===false?'no':''}" style="left:${pos(j)}"></div>`).join('')}
    <div class="flag">🏁</div><div class="me" style="left:${pos(Math.min(Q.i,n-1))}">${S.photo?`<img src="${S.photo}" alt="">`:'<div class="face">😊</div>'}</div></div>`;
}
/* 문장 속 단어 위치 (대소문자 무시, 낱말 단위) */
function sentParts(x){
  if(!x||!x.ex) return null;
  const re=new RegExp('(^|[^A-Za-z])('+x.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i'), m=x.ex.match(re);
  if(!m) return null;
  const i=m.index+m[1].length; return [x.ex.slice(0,i), x.ex.slice(i,i+m[2].length), x.ex.slice(i+m[2].length)];
}
function rSent(head,it,tag){
  const x=it.x, sp=sentParts(x);
  if(!it.opts) it.opts=shuffle([x].concat(distractors(x,'w',3)));
  app.innerHTML = head + `<div class="qwrap"><div class="qcard sentq">${tag||''}
      <button class="iconbtn say2" onclick="speak(Q.items[Q.i].x.ex)" aria-label="문장 듣기">🔊</button>
      <div class="ask">빈칸에 알맞은 단어를 끌어다 놓아 봐 ✋</div>
      <div class="ssent en">${esc(sp[0])}<span class="drop" id="drop">${it.done?esc(sp[1]):'&nbsp;'}</span>${esc(sp[2])}</div>
      <div class="sentk">${esc(x.exk)}</div></div>
    <div class="dchips">${it.opts.map((o,j)=>`<button class="dchip en" data-j="${j}">${o.w}</button>`).join('')}</div>
    <div class="muted" style="text-align:center;font-size:16px;margin-top:10px">단어를 꾹 눌러 빈칸으로 끌어오거나, 그냥 눌러도 돼요</div></div>`;
  document.querySelectorAll('.dchip').forEach(ch=>dragChip(ch));
}
function dragChip(ch){
  let ghost=null, sx=0, sy=0, moved=false;
  ch.addEventListener('pointerdown',e=>{
    const it=Q.items[Q.i]; if(it.done) return;
    sx=e.clientX; sy=e.clientY; moved=false; ch.setPointerCapture(e.pointerId);
    const r=ch.getBoundingClientRect();
    ghost=ch.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=r.width+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
    ghost.dataset.ox=e.clientX-r.left; ghost.dataset.oy=e.clientY-r.top; document.body.appendChild(ghost); ch.classList.add('lift');
  });
  ch.addEventListener('pointermove',e=>{
    if(!ghost) return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8) moved=true;
    ghost.style.left=(e.clientX-ghost.dataset.ox)+'px'; ghost.style.top=(e.clientY-ghost.dataset.oy)+'px';
    const d=$('#drop'); if(d){ const r=d.getBoundingClientRect(), over=e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-30&&e.clientY<r.bottom+30; d.classList.toggle('over',over); }
  });
  const end=e=>{
    if(!ghost) return;
    const d=$('#drop'), over=d&&d.classList.contains('over');
    ghost.remove(); ghost=null; ch.classList.remove('lift'); if(d) d.classList.remove('over');
    if(over||!moved) answerSent(+ch.dataset.j);
  };
  ch.addEventListener('pointerup',end); ch.addEventListener('pointercancel',()=>{ if(ghost){ ghost.remove(); ghost=null; ch.classList.remove('lift'); } });
}
function answerSent(j){
  const it=Q.items[Q.i]; if(it.done) return; it.done=true;
  const x=it.x, ok=it.opts[j].w===x.w, sp=sentParts(x), d=$('#drop');
  d.textContent=ok?sp[1]:it.opts[j].w; d.classList.add(ok?'ok':'no');
  document.querySelectorAll('.dchip').forEach((b,k)=>{ b.disabled=true; if(it.opts[k].w===x.w) b.classList.add('ok'); else if(k===j) b.classList.add('no'); else b.classList.add('dim'); });
  if(!ok) timers.push(setTimeout(()=>{ d.textContent=sp[1]; d.classList.remove('no'); d.classList.add('fix'); },700));
  settle(ok, ok?2:0, d);
  timers.push(setTimeout(()=>speak(x.ex),ok?80:1300));
}
function muteQuiz(){ Q.mute=true; Q.items.forEach((it,k)=>{ if(k>=Q.i && it.mode==='listen') it.mode='word'; }); toast('🔇 보고 푸는 문제로 바꿨어요'); rQuiz(); }
function rQuiz(){
  const it=Q.items[Q.i], x=it.x;
  if(Q.mute && it.mode==='listen') it.mode='word';
  const m=it.mode;
  const D=daily(), isDaily=D.words.includes(x.w);
  const tag = isDaily && Q.mode==='daily' ? '' : (isDaily && !D.done.includes(x.w) ? `<span class="qtag">오늘의 단어</span>` : '');
  const head=`<div class="qtop"><button class="back" onclick="quitQuiz()">✕ 그만</button>${roadHTML()}
    <div class="combo ${Q.combo>=2?'':'hide'}">🔥 ${Q.combo}연속</div>
    <div class="pill" id="starPill"><span>⭐</span><b>${S.stars}</b></div></div>`;
  if(m==='spell') return rSpell(head,it,tag);
  if(m==='sent') return rSent(head,it,tag);
  const field = m==='meaning'?'k':'w';
  const opts=shuffle([x].concat(distractors(x,field,3))); it.opts=opts;
  let prompt='';
  if(m==='meaning') prompt=`<div class="ask">이 단어의 뜻은?</div><div class="qword en">${x.w}</div><button class="iconbtn say2" onclick="speak('${x.w}')" aria-label="듣기">🔊</button>`;
  if(m==='word') prompt=`<div class="ask">영어로 하면?</div><div class="qemoji">${x.e}</div><div class="qko">${x.k}</div>`;
  if(m==='listen') prompt=`<div class="ask">잘 듣고 알맞은 단어를 골라 봐</div><button class="listen" id="lbtn" onclick="playListen()">🔊</button><div class="muted" style="font-size:18px;margin-top:14px">버튼을 누르면 다시 들려줘요</div><button class="mutebtn" onclick="muteQuiz()">🔇 지금 소리를 못 들어요</button>`;
  app.innerHTML = head + `<div class="qwrap"><div class="qcard">${tag}${prompt}</div>
    <div class="choices">${opts.map((o,j)=>`<button class="choice ${field==='w'?'en':''}" data-j="${j}" onclick="answer(${j},this)"><span class="key">${j+1}</span>${field==='w'?o.w:o.k}</button>`).join('')}</div></div>`;
  if(m==='meaning') timers.push(setTimeout(()=>speak(x.w),300));
  if(m==='listen') timers.push(setTimeout(playListen,350));
}
function playListen(){ const b=$('#lbtn'); if(b){ b.classList.remove('playing'); void b.offsetWidth; b.classList.add('playing'); } speak(Q.items[Q.i].x.w); }
function answer(j,btn){
  const it=Q.items[Q.i]; if(it.done) return; it.done=true;
  const x=it.x, ok=it.opts[j].w===x.w;
  document.querySelectorAll('.choice').forEach((b,k)=>{ b.disabled=true;
    if(it.opts[k].w===x.w) b.classList.add('ok'); else if(k===j) b.classList.add('no'); else b.classList.add('dim'); });

}
function settle(ok,gain,el){
  const it=Q.items[Q.i], x=it.x;
  Q.res[Q.i]=ok; markResult(x.w, ok);
  if(ok){
    Q.score++; Q.combo++; Q.best=Math.max(Q.best,Q.combo);

    addStars(g); Q.earned+=g;

  }else{
    Q.combo=0; Q.missed.push(x.w); sfx.no(); buzz(120);

function popFace(){

  document.body.appendChild(d); setTimeout(()=>d.remove(),1900);

function showSheet(ok,x){

function hideSheet(){ $('#sheet').classList.remove('show'); }
function nextQ(){

function quitQuiz(){

function logSession(partial){

/* 철자 퍼즐 */
function rSpell(head,it,tag){
  const x=it.x;
  if(!it.letters){ it.letters=shuffle(x.w.split('')); let g=0; while(it.letters.join('')===x.w&&g++<10) it.letters=shuffle(x.w.split('')); it.slots=[]; it.hints=0; it.fixed=[]; it.stack=[]; it.tries=0; }
  app.innerHTML = head + `<div class="qwrap">
    <div class="qcard" style="min-height:200px">${tag||''}
      <button class="iconbtn say2" onclick="speak('${x.w}')" aria-label="듣기">🔊</button>
      <div class="ask">글자 조각을 순서대로 눌러 봐</div>
      <div class="qemoji" style="font-size:76px">${x.e}</div><div class="qko" style="font-size:40px">${x.k}</div>
      <div class="slots en" id="slots">${x.w.split('').map((_,k)=>{const s=it.slots[k];return `<div class="slot ${s!=null?'fill':''} ${(it.fixed||[]).includes(k)?'hintc':''}" onclick="unplace(${k})">${s!=null?it.letters[s]:''}</div>`}).join('')}</div>
    </div>
    <div class="letters en">${it.letters.map((l,k)=>`<button class="letter ${it.slots.includes(k)?'used':''}" onclick="place(${k})">${l}</button>`).join('')}</div>
    <div class="spellbar"><button class="btn w sm" onclick="spellHint()">💡 힌트 (⭐ 줄어요)</button><button class="btn w sm" onclick="spellUndo()">⌫ 하나 지우기</button></div>
  </div>`;
}
function place(k){
  const it=Q.items[Q.i]; if(it.done||it.slots.includes(k)) return;
  const n=it.x.w.length; let pos=0; while(it.slots[pos]!=null&&pos<n) pos++;
  if(pos>=n) return;
  it.slots[pos]=k; (it.stack=it.stack||[]).push(pos); sfx.tap(); rQuiz();
  if(it.slots.filter(s=>s!=null).length===n) timers.push(setTimeout(checkSpell,220));
}
const isFixed=(it,k)=>(it.fixed||[]).includes(k);
function unplace(pos){ const it=Q.items[Q.i]; if(it.done||isFixed(it,pos)||it.slots[pos]==null) return; it.slots[pos]=null; it.stack=(it.stack||[]).filter(p=>p!==pos); sfx.tap(); rQuiz(); }
/* 마지막에 놓은 글자 하나만 되돌려요 */
function spellUndo(){
  const it=Q.items[Q.i]; if(it.done) return; it.stack=it.stack||[];
  while(it.stack.length){ const p=it.stack.pop(); if(it.slots[p]!=null&&!isFixed(it,p)){ it.slots[p]=null; sfx.tap(); return rQuiz(); } }
  for(let p=it.slots.length-1;p>=0;p--) if(it.slots[p]!=null&&!isFixed(it,p)){ it.slots[p]=null; sfx.tap(); return rQuiz(); }
  toast('지울 글자가 없어요');
}
function spellClear(){ const it=Q.items[Q.i]; if(it.done) return; it.slots=it.slots.map((s,k)=>isFixed(it,k)?s:null); it.stack=[]; rQuiz(); }
/* 틀리기 쉬운 자리 점수: 겹글자·모음 짝·묵음·끝 e 등 (첫 글자는 낮게) */
function hardScore(w){
  const s=w.toLowerCase(), sc=[...s].map(()=>1), add=(i,v)=>{ if(i>=0&&i<s.length) sc[i]+=v; };
  ['igh','ough','augh','tch','dge','ea','ee','oo','ou','ow','ai','ay','oa','ie','ei','ue','ui','au','aw','ew','oi','oy','ar','er','ir','or','ur'].forEach(t=>{ let i=s.indexOf(t); while(i>=0){ for(let k=0;k<t.length;k++) add(i+k,t.length>2?4:3); i=s.indexOf(t,i+1); } });
  ['kn','wr','gh','ph','ck','wh','mb','gn','qu','sc','ch','sh','th'].forEach(t=>{ let i=s.indexOf(t); while(i>=0){ add(i,2.5); add(i+1,2.5); i=s.indexOf(t,i+1); } });
  for(let i=1;i<s.length;i++) if(s[i]===s[i-1]&&/[a-z]/.test(s[i])){ add(i,4); add(i-1,2); }
  if(s.length>3&&s.endsWith('e')&&!'aeiou'.includes(s[s.length-2])) add(s.length-1,3);
  for(let i=1;i<s.length-1;i++) if('aeiouy'.includes(s[i])) add(i,1.5);
  sc[0]-=3; if(s.length>2) sc[s.length-1]-=.5;
  [...s].forEach((c,i)=>{ if(!/[a-z]/.test(c)) sc[i]=-99; });
  return sc;
}
function spellHint(){
  const it=Q.items[Q.i], w=it.x.w; if(it.done) return; it.fixed=it.fixed||[];
  if(it.fixed.length>=w.length-1){ toast('이제 직접 해 볼까?'); return; }
  /* 틀린 자리에 놓인 글자는 빼요 */
  it.slots=it.slots.map((s,k)=>s!=null&&!isFixed(it,k)&&it.letters[s]!==w[k]?null:s);
  const sc=hardScore(w); let pos=-1, best=-1e9;
  for(let k=0;k<w.length;k++){ const correct=it.slots[k]!=null&&it.letters[it.slots[k]]===w[k]; if(isFixed(it,k)||correct) continue; if(sc[k]>best){ best=sc[k]; pos=k; } }
  if(pos<0){ toast('이제 직접 해 볼까?'); return; }
  const used=new Set(it.slots.filter(s=>s!=null));
  const idx=it.letters.findIndex((l,i)=>l===w[pos]&&!used.has(i)); if(idx<0) return;
  it.slots[pos]=idx; it.fixed.push(pos); it.hints++; it.stack=(it.stack||[]).filter(p=>p!==pos); sfx.tap(); rQuiz();
}
function checkSpell(){
  const it=Q.items[Q.i], w=it.x.w, typed=it.slots.map(s=>it.letters[s]).join(''), box=$('#slots');
  if(typed===w){
    it.done=true; box&&box.classList.add('ok');
    if(it.tries===0) settle(true, it.hints?1:2, box);
    else { sfx.ok(); speak(w); showSheet(true,it.x); $('#sheetIn .msg').textContent='고쳐서 완성! 잘했어 👍'; timers.push(setTimeout(nextQ,2100)); }
  }else{
    it.tries++;
    if(it.tries===1){ markResult(w,false); Q.combo=0; Q.missed.push(w); Q.res[Q.i]=false; save(); }
    sfx.no(); buzz(120); box&&box.classList.add('no');
    if(it.tries>=3){ it.done=true; timers.push(setTimeout(()=>showSheet(false,it.x),450)); return; }
    toast(it.tries===1?'앗, 순서가 달라요. 다시 해 볼까?':'💡 힌트를 써 봐도 좋아요');
    timers.push(setTimeout(()=>{ it.slots=it.slots.map((s,k)=>isFixed(it,k)?s:null); it.stack=[]; rQuiz(); },600));
  }
}

/* 결과 */
function rResult(){

    <div class="side">
      ${missed.length?`<div class="panel"><div style="font-size:24px;margin-bottom:6px">📒 오답노트에 담았어요</div><div class="muted" style="font-size:17px;margin-bottom:14px">눌러서 소리를 들어 봐</div>
        <div class="wordlist" style="margin:0">${missed.map(w=>`<button class="wchip" onclick="speak('${w}')"><span>${BYW[w].e}</span><span class="en">${w}</span><span class="muted">${BYW[w].k}</span></button>`).join('')}</div></div>`
      :`<div class="panel" style="text-align:center"><div style="font-size:58px">🌈</div><div style="font-size:25px;margin-top:8px">틀린 단어가 하나도 없어요!</div></div>`}
      <div class="acts">
        ${Q.mode==='daily'&&D.done.length<D.words.length?`<button class="btn" onclick="startDaily()">남은 단어 ${D.words.length-D.done.length}개 풀기</button>`:`<button class="btn" onclick="again()">한 번 더 ↻</button>`}
        <button class="btn w" onclick="${Q.theme?`go('theme',{id:'${Q.theme}'})`:`go('${Q.from||'home'}')`}">${Q.theme?'주제로 돌아가기':'돌아가기'}</button>
      </div>
    </div></div>`;
  if(r>=.8){ sfx.win(); burst(r===1?70:40); }
  timers.push(setTimeout(afterLand, r>=.8?1400:500));

function again(){
  if(Q.mode==='daily') startDaily();
  else if(Q.mode==='wrong'){ wrongList().length?startWrong():go('wrong'); }
  else startTheme(Q.theme,Q.mode);
}

/* =========================================================
   선물
   ========================================================= */
function rRewards(){
  const rs=S.rewards.slice().sort((a,b)=>a.at-b.at), max=Math.max(...rs.map(r=>r.at),1), pos=v=>Math.min(100,v/max*100);
  app.innerHTML = topbar() + `
  <div class="panel"><div class="rhead">
    <div class="rtotal">지금까지 모은 별<b>⭐${S.stars}</b></div>
    <div class="groad"><div class="base"><i style="width:${pos(S.stars)}%"></i></div>
      ${rs.map(r=>`<div class="gm ${S.stars>=r.at?'reached':''}" style="left:${pos(r.at)}%"><div class="gb">${r.got?'✅':'🎁'}</div><div class="gl">${r.at}</div></div>`).join('')}
      <div class="who" style="left:${pos(S.stars)}%">${S.photo?`<img src="${S.photo}" alt="">`:'<div class="face">😊</div>'}</div></div>
  </div></div>
  <div class="gifts">${rs.map(r=>{const i=S.rewards.indexOf(r), reached=S.stars>=r.at; return `
    <div class="gift ${r.got?'got':reached?'reached':''}">
      <div class="gt"><div class="gi">${r.got?'✅':reached?'🎁':'🔒'}</div>
        <div><div class="gs">⭐${r.at}</div><div class="gst">${r.got?'선물 받았어요':reached?'도착! 엄마 아빠에게 말해 봐':`⭐${r.at-S.stars}개 남았어요`}</div></div></div>
      ${reached?`<div class="wishshow">${r.wish?esc(r.wish):'<span class="muted">적어 둔 선물이 없어요</span>'}</div>${r.got?'':`<button class="btn m sm" onclick="markGot(${i})">🔐 선물 받았어요 (부모 확인)</button>`}`
        :`<input class="wish" id="wish${i}" maxlength="40" placeholder="가지고 싶은 것을 적어 봐" value="${esc(r.wish)}" onchange="setWish(${i},this.value)">`}
    </div>`}).join('')}</div>
  <p class="muted" style="font-size:18px;margin-top:20px;text-align:center">별은 쓰지 않고 계속 쌓여요. 목표를 더 만들고 싶으면 ⚙️ 부모 메뉴에서 추가할 수 있어요.</p>`;
  afterLand();
}
function setWish(i,v){ v=v.trim().slice(0,40); if(S.rewards[i].wish!==v){ S.rewards[i].wish=v; save(); toast('선물을 적어 뒀어요 🎁'); } }
function markGot(i){ askPin(()=>{ S.rewards[i].got=true; save(); sfx.win(); burst(40); render(); }); }
function checkRewards(){
  if($('.modal')) return true;
  const r=S.rewards.slice().sort((a,b)=>a.at-b.at).find(r=>S.stars>=r.at&&!r.seen);
  if(!r) return false;
  r.seen=true; save(); sfx.win(); burst(80);
  modal(`${sticker(160,'🎁')}<div class="mt">⭐${r.at}개 달성!<br>${r.wish?`다연이의 선물: ${esc(r.wish)}`:'선물 받을 자격이 생겼어요!'}</div>
    <div class="md">엄마 아빠에게 보여 드리자 💌</div>
    <div class="acts"><button class="btn" onclick="closeModal();go('rewards')">선물 보러 가기</button><button class="btn w" onclick="closeModal();afterLand()">닫기</button></div>`);
  return true;
}

/* 오답노트 */
function rWrong(){
  const ws=wrongList();
  app.innerHTML = topbar() + `
  <div class="panel" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="font-size:52px">📒</div>
    <div style="flex:1;min-width:240px"><div class="h2">오답노트</div><div class="muted" style="font-size:19px;margin-top:4px">틀린 단어가 모여요. 다시 2번 맞히면 노트에서 빠져요.</div></div>
    <button class="btn" ${ws.length?'':'disabled'} onclick="startWrong()">다시 풀기 (${Math.min(10,ws.length)}문제)</button></div>
  ${ws.length?`<div class="wgrid">${ws.map(w=>{const x=BYW[w];return `<div class="wcard"><div class="we">${x.e}</div><div><div class="ww en">${x.w}</div><div class="wk">${x.k}</div></div><button class="iconbtn" onclick="speak('${x.w}')" aria-label="듣기">🔊</button></div>`}).join('')}</div>`
  :`<div class="empty"><div class="big">🌈</div><p>오답노트가 깨끗해요!<br><span class="muted" style="font-size:20px">틀린 단어가 생기면 여기에 모여요.</span></p></div>`}`;
}

/* 기록 */
function rRecords(){
  const days=Object.values(S.days), totalQ=days.reduce((a,d)=>a+d.q,0), totalOk=days.reduce((a,d)=>a+d.ok,0);
  const studied=Object.keys(S.days).filter(k=>S.days[k].q>0).length, mast=ALL.filter(x=>mastered(x.w)).length;
  const last=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dkey(d); last.push({k,d,v:(S.days[k]||{}).stars||0}); }
  const mx=Math.max(10,...last.map(x=>x.v)), wk=['일','월','화','수','목','금','토'];
  const modeIcon=m=>({meaning:'🔤',word:'🖼️',listen:'🎧',spell:'🧩',daily:'🎯',wrong:'📒'})[m]||'⭐';
  app.innerHTML = topbar() + `
  <div class="stats">
    <div class="stat"><div class="sv">${S.stars}</div><div class="sl">⭐ 모은 별</div></div>
    <div class="stat"><div class="sv">${studied}<small>일</small></div><div class="sl">📅 공부한 날</div></div>
    <div class="stat"><div class="sv">${streak()}<small>일</small></div><div class="sl">🔥 연속 기록</div></div>
    <div class="stat"><div class="sv">${mast}<small>/${ALL.length}</small></div><div class="sl">🏅 익힌 단어</div></div>
    <div class="stat"><div class="sv">${totalQ?Math.round(totalOk/totalQ*100):0}<small>%</small></div><div class="sl">🎯 정답률 (${totalQ}문제)</div></div>
  </div>
  <div class="recgrid">
    <div class="panel"><div class="h2">최근 2주 동안 모은 별</div>
      <div class="bars">${last.map((x,i)=>`<div class="b ${i===13?'today':''}"><i style="height:${x.v/mx*170+4}px">${x.v?`<span>${x.v}</span>`:''}</i><em>${i===13?'오늘':x.d.getDate()}</em></div>`).join('')}</div>
      <div class="muted" style="font-size:15px;margin-top:6px;display:flex;justify-content:space-between"><span>${last[0].d.getMonth()+1}월 ${last[0].d.getDate()}일 (${wk[last[0].d.getDay()]})</span><span>오늘 (${wk[last[13].d.getDay()]})</span></div>
    </div>
    <div class="panel"><div class="h2">최근 공부</div>
      ${S.log.length?`<div class="logs" style="margin-top:14px">${S.log.slice(0,30).map(l=>{const d=new Date(l.d);return `<div class="logrow"><div class="le">${l.theme&&TBYID[l.theme]?TBYID[l.theme].emoji:modeIcon(l.mode)}</div>
        <div><div class="lt">${esc(l.title)}</div><div class="ld">${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${l.score}/${l.total} 정답</div></div><div class="ls">+${l.earned}⭐</div></div>`}).join('')}</div>`
      :`<div class="empty" style="padding:30px 10px"><div class="big" style="font-size:58px">🗺️</div><p style="font-size:20px">첫 탐험을 떠나 보자!</p></div>`}
    </div>
  </div>`;
}

/* =========================================================
   부모 메뉴
   ========================================================= */
let pinBuf='';
function askPin(onOk){
  pinBuf=''; const setting=!S.pin; let first=null;
  const draw=(title,sub)=>modal(`<div style="font-size:52px">🔐</div><div class="mt" style="font-size:30px">${title}</div><div class="md">${sub}</div>
    <div class="pindots" id="pd">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div>
    <div class="acts"><button class="btn w sm" onclick="closeModal()">닫기</button></div>`);
  window.pinKey=k=>{
    if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
    document.querySelectorAll('#pd i').forEach((el,i)=>el.classList.toggle('on',i<pinBuf.length));
    if(pinBuf.length<4) return;
    const v=pinBuf; pinBuf='';
    setTimeout(()=>{
      if(setting){
        if(first===null){ first=v; draw('한 번 더 입력해 주세요','같은 비밀번호 4자리'); }
        else if(first===v){ S.pin=v; save(); closeModal(); toast('비밀번호를 만들었어요'); onOk(); }
        else { first=null; draw('비밀번호가 달라요','처음부터 다시 4자리를 입력해 주세요'); }
      }else{
        if(v===S.pin){ closeModal(); onOk(); }
        else { const pd=$('#pd'); pd.classList.add('no'); setTimeout(()=>{ pd.classList.remove('no'); pd.querySelectorAll('i').forEach(i=>i.classList.remove('on')); },450); }
      }
    },150);
  };
  setting ? draw('부모 비밀번호 만들기','부모 메뉴와 선물 확인에 쓸 4자리 숫자') : draw('부모 확인','비밀번호 4자리를 입력해 주세요');
}
function openParent(){ askPin(()=>go('parent')); }
function rParent(){
  const rs=S.rewards.slice().sort((a,b)=>a.at-b.at);
  app.innerHTML = `<div class="topbar"><button class="back" onclick="go('home')">← 나가기</button><div class="spacer"></div><div class="h2">⚙️ 부모 메뉴</div></div>
  <div class="panel">
    <div class="prow">${sticker(88)}<div style="margin-left:14px"><div class="pt">다연이 사진</div><div class="pd">퀴즈와 칭찬 화면에 나오는 얼굴이에요</div></div>
      <div class="pa"><button class="btn s sm" onclick="pickPhoto()">📷 사진 바꾸기</button></div></div>
    <div class="prow"><div><div class="pt">선물 목표</div><div class="pd">별 개수와 선물 이름을 정할 수 있어요</div></div>
      <div class="pa"><button class="btn y sm" onclick="addGoal()">＋ 목표 추가</button></div></div>
    ${rs.map(r=>{const i=S.rewards.indexOf(r);return `<div class="prow" style="padding:12px 0 12px 20px">
      <div class="en" style="font-size:23px;width:90px">⭐${r.at}</div>
      <input class="wish" id="pw${i}" style="flex:1;height:50px;font-size:20px" maxlength="40" placeholder="선물 이름" value="${esc(r.wish)}" onchange="S.rewards[${i}].wish=this.value.trim();save()">
      <div class="pa">${r.got?`<button class="btn w sm" onclick="S.rewards[${i}].got=false;save();render()">받음 취소</button>`:''}<button class="btn w sm" onclick="delGoal(${i})">삭제</button></div></div>`}).join('')}
    <div class="prow"><div><div class="pt">별 조정</div><div class="pd">지금까지 모은 별 ⭐${S.stars}개 · 상점에서 쓴 별 ${S.spent||0}개 · 남은 별 ${wallet()}개<br>잘못 쌓였을 때 고쳐 주세요 (선물 목표는 모은 별 기준)</div></div>
      <div class="pa"><button class="btn w sm" onclick="adjStars(-10)">−10</button><button class="btn w sm" onclick="adjStars(10)">＋10</button></div></div>
    <div class="prow"><div><div class="pt">백업</div><div class="pd">기록·사진·별·마을을 파일로 저장하거나 다시 불러와요 (태블릿을 바꿀 때)</div></div>
      <div class="pa"><button class="btn s sm" onclick="exportBackup()">💾 백업 저장</button><button class="btn w sm" onclick="$('#backupInput').value='';$('#backupInput').click()">📂 불러오기</button></div></div>
    <div class="prow"><div><div class="pt">비밀번호 바꾸기</div><div class="pd">새 4자리 숫자로 바꿔요</div></div>
      <div class="pa"><button class="btn w sm" onclick="S.pin=null;save();askPin(()=>go('parent'))">바꾸기</button></div></div>
    <div class="prow"><div><div class="pt">처음부터 다시</div><div class="pd">별·기록·오답노트·마을을 모두 지워요 (사진과 선물 목표는 남아요)</div></div>
      <div class="pa"><button class="btn sm" onclick="resetAll()">기록 지우기</button></div></div>
  </div>`;
}
function addGoal(){
  const max=Math.max(0,...S.rewards.map(r=>r.at));
  modal(`<div class="mt" style="font-size:28px">새 선물 목표</div><div class="md">별을 몇 개 모으면 받을 선물인가요?</div>
    <input class="field en" id="goalN" type="number" inputmode="numeric" value="${max+100}">
    <div class="acts"><button class="btn" onclick="saveGoal()">추가하기</button><button class="btn w" onclick="closeModal()">닫기</button></div>`);
}
function saveGoal(){
  const v=parseInt($('#goalN').value,10);
  if(!v||v<1){ toast('1 이상의 숫자를 넣어 주세요'); return; }
  if(S.rewards.some(r=>r.at===v)){ toast('이미 같은 목표가 있어요'); return; }
  S.rewards.push({at:v,wish:'',got:false,seen:S.stars>=v}); save(); closeModal(); render();
}
function delGoal(i){
  modal(`<div class="mt" style="font-size:28px">⭐${S.rewards[i].at} 목표를 지울까요?</div>
    <div class="acts"><button class="btn" onclick="S.rewards.splice(${i},1);save();closeModal();render()">지우기</button><button class="btn w" onclick="closeModal()">닫기</button></div>`);
}
function adjStars(n){ S.stars=Math.max(0,S.stars+n); S.spent=Math.min(S.spent||0,S.stars); ensureFriends(); save(); render(); }
function resetAll(){
  modal(`<div class="mt" style="font-size:28px">모든 기록을 지울까요?</div><div class="md">별·기록·오답노트·마을 친구가 사라지고 되돌릴 수 없어요.</div>
    <div class="acts"><button class="btn" onclick="doReset()">모두 지우기</button><button class="btn w" onclick="closeModal()">닫기</button></div>`);
}
function doReset(){
  const keep={photo:S.photo,pin:S.pin,rewards:S.rewards.map(r=>({at:r.at,wish:r.wish,got:false,seen:false}))};
  S=Object.assign(blank(),keep); save(); closeModal(); toast('기록을 지웠어요'); render();
}
function exportBackup(){
  const j=JSON.stringify(S), name='dayeon-village-backup-'+dkey()+'.json';
  try{ if(HAS_ANDROID && Android.exportBackup){ toast(Android.exportBackup(name,j)||'저장했어요'); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([j],{type:'application/json'})); a.download=name; a.click();
  toast('백업 파일을 저장했어요');
}
let pendingBackup=null;
$('#backupInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d.stars!=='number'||!d.words) throw 0;
      pendingBackup=d;
      modal(`<div class="mt" style="font-size:28px">백업을 불러올까요?</div><div class="md">별 ${d.stars}개가 담긴 백업이에요. 지금 기록이 이 백업으로 바뀌어요.</div>
        <div class="acts"><button class="btn" onclick="S=Object.assign(blank(),pendingBackup);save();closeModal();toast('백업을 불러왔어요');go('home')">불러오기</button><button class="btn w" onclick="closeModal()">닫기</button></div>`);
    }catch(err){ toast('백업 파일이 아니에요. 다른 파일을 골라 주세요'); }
  };
  r.readAsText(f);
});

/* 모달 */
function modal(html){ closeModal(); const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; document.body.appendChild(m); }
function closeModal(){ document.querySelectorAll('.modal').forEach(m=>m.remove()); }

/* 시작 */
document.addEventListener('keydown',e=>{
  if(view!=='quiz') return;
  if(e.key>='1'&&e.key<='4'){ const b=document.querySelector(`.choice[data-j="${e.key-1}"]`); if(b&&!b.disabled) b.click(); }
  if(e.key==='Enter'&&$('#sheet').classList.contains('show')) nextQ();
});
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
ensureFriends();
if(location.hash==='#test') window.__dy={get S(){return S;},set S(v){S=v;},go,render,openShop,askMerge,refreshVillage,openHome,BGS,checkBgs,streak,ALL,wordProgress};
go(S.photo?'home':'setup');
</script>
</body>
</html>
