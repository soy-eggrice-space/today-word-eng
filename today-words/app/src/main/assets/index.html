<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EF">
<title>오늘단어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
<style>
@font-face{font-family:'JuaLocal';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'FredokaLocal';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700;font-display:swap}

:root{
  --bg:#FFF7EF; --card:#FFFFFF; --ink:#2F2B4A; --ink2:#7A7594; --hair:#F0E6DC; --soft:#FFF3E8;
  --coral:#FF8F7E; --coralD:#EE6A57; --mint:#82D9BA; --mintD:#2FAE83; --lemon:#FFD46E; --sky:#93C6FF; --lav:#BBAAFF; --indigo:#7D8CF6; --indigoD:#5A69DE;
  --ok:#2FAE83; --okbg:#E3F8EF; --no:#EE6A57; --nobg:#FFE9E4;
  --acc:var(--coral); --accD:var(--coralD); --accS:#FFE7E1;
  --line:2.5px solid var(--ink); --pop:0 5px 0 var(--ink); --popS:0 3px 0 var(--ink);
  --fk:'JuaLocal','Jua',system-ui,sans-serif;
  --fe:'FredokaLocal','Fredoka','JuaLocal','Jua',system-ui,sans-serif;
  --fb:system-ui,-apple-system,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --fj:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
body[data-lang="ja"]{--acc:var(--indigo);--accD:var(--indigoD);--accS:#E8EBFF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--fk);color:var(--ink);font-size:18px;background:var(--bg);
  background-image:radial-gradient(rgba(47,43,74,.07) 1.4px,transparent 1.6px);background-size:26px 26px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.en{font-family:var(--fe);font-weight:600}
[lang="ja"],.ja{font-family:var(--fj);font-weight:600}
.muted{color:var(--ink2)}
.hide{display:none!important}
#app{max-width:1100px;margin:0 auto;padding:18px max(22px,env(safe-area-inset-right)) 40px max(22px,env(safe-area-inset-left))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* logo */
.logo{display:flex;align-items:center;gap:10px;flex:none;line-height:1}
.logo .badge{width:52px;height:52px;border-radius:17px;border:var(--line);background:var(--acc);box-shadow:var(--popS);display:grid;place-items:center;transform:rotate(-6deg)}
.logo .badge svg{width:38px;height:38px}
.logo .t{font-size:32px;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:.02em}
.logo .t span:nth-child(1){color:var(--lemon)}.logo .t span:nth-child(2){color:var(--mint)}
.logo .t span:nth-child(3){color:var(--coral)}.logo .t span:nth-child(4){color:var(--sky)}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.spacer{flex:1}
.seg{display:flex;background:var(--card);border:var(--line);border-radius:999px;padding:4px;box-shadow:var(--popS);gap:2px}
.seg button{height:40px;padding:0 14px;border-radius:999px;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--acc);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:6px 14px 6px 11px;font-size:19px;white-space:nowrap}
.pill b{font-family:var(--fe);font-weight:700;font-size:21px}
.iconbtn{width:48px;height:48px;flex:none;border-radius:50%;background:var(--card);border:var(--line);box-shadow:var(--popS);display:grid;place-items:center;font-size:21px}
.iconbtn.s{width:40px;height:40px;font-size:18px}
.iconbtn:active,.btn:active,.tile:active,.choice:active,.back:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.back{height:46px;padding:0 18px;border-radius:999px;background:var(--card);border:var(--line);box-shadow:var(--popS);font-size:18px;white-space:nowrap}

.tabs{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:var(--line);border-radius:999px;padding:6px;box-shadow:var(--pop);z-index:20}
.tabs button{display:flex;align-items:center;gap:6px;height:46px;padding:0 18px;border-radius:999px;font-size:18px;white-space:nowrap;position:relative}
.tabs button .ic{font-size:20px}
.tabs button.on{background:var(--acc);color:#fff}
.tabs .badge{position:absolute;top:-6px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--coralD);color:#fff;font-family:var(--fe);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
#app.withtabs{padding-bottom:120px}

/* blocks */
.panel{background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:26px;padding:22px}
.h2{font-size:26px}
.sub{font-size:16px;color:var(--ink2);margin-top:4px;font-family:var(--fb);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:999px;border:var(--line);box-shadow:var(--pop);background:var(--acc);color:#fff;font-size:21px;white-space:nowrap}
.btn.w{background:var(--card);color:var(--ink)}
.btn.y{background:var(--lemon);color:var(--ink)}
.btn.m{background:var(--mint);color:var(--ink)}
.btn.sm{min-height:44px;font-size:17px;padding:0 16px;box-shadow:var(--popS)}
.btn:disabled{opacity:.45}
.chip{height:40px;padding:0 15px;border-radius:999px;border:var(--line);background:var(--card);font-size:16px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:16px;border-radius:10px;background:#F4ECE4;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .5s}
.bar.mint i{background:var(--mint)}

/* home */
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
.grid2>*{min-width:0}
.hello .hi{font-size:28px}
.hello .hi b{color:var(--accD)}
.hello .msg{font-family:var(--fb);font-weight:500;color:var(--ink2);font-size:16px;margin-top:6px;line-height:1.5}
.today{margin-top:18px;background:var(--accS);border:var(--line);border-radius:22px;padding:18px}
.today .row{display:flex;gap:10px;margin:12px 0 14px}
.today .box{flex:1;background:#fff;border:var(--line);border-radius:18px;padding:10px 12px;text-align:center}
.today .box b{display:block;font-family:var(--fe);font-weight:700;font-size:34px;line-height:1.1}
.today .box span{font-size:15px;color:var(--ink2)}
.today .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.today .acts .btn{flex:1 1 150px}
.donebig{text-align:center;padding:8px 0}
.donebig .e{font-size:54px}
.donebig .t{font-size:24px;margin-top:4px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini{background:var(--card);border:var(--line);border-radius:20px;padding:14px;box-shadow:var(--popS)}
.mini b{font-family:var(--fe);font-weight:700;font-size:30px;line-height:1}
.mini b small{font-size:16px;color:var(--ink2);margin-left:2px}
.mini div{font-size:14px;color:var(--ink2);margin-top:6px}
.kana-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px}
.kana-cta .k{width:56px;height:56px;border-radius:17px;border:var(--line);background:var(--lemon);display:grid;place-items:center;font-size:28px;font-family:var(--fj);font-weight:700;flex:none;transform:rotate(4deg)}
.upnext{font-family:var(--fb);font-weight:500;font-size:15px;color:var(--ink2);margin-top:12px}

/* themes */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--card);border:var(--line);border-radius:22px;box-shadow:var(--pop);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile .ic{font-size:36px}
.tile .nm{font-size:21px}
.tile .st{font-size:13px;color:var(--ink2);font-family:var(--fb);font-weight:600}
.tile .bar{height:10px;border-width:1.5px}
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.thead .ic{font-size:46px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wlist{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrow{display:flex;align-items:center;gap:12px;background:var(--card);border:var(--line);border-radius:18px;padding:10px 10px 10px 14px}
.wrow .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--ink);background:#fff}
.wrow .dot.l1{background:var(--lemon)}.wrow .dot.l2{background:var(--sky)}.wrow .dot.l3{background:var(--mint)}
.wrow .tx{flex:1;min-width:0}
.wrow .w{font-size:19px;line-height:1.25;word-break:keep-all}
.wrow .r{font-size:13px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.wrow .k{font-size:14px;color:var(--ink2);font-family:var(--fb);font-weight:500;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-top:12px;font-family:var(--fb);font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);margin-right:4px;vertical-align:-1px;background:#fff}

/* card view */
.cardwrap{max-width:640px;margin:0 auto}
.fcard{background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:30px;padding:28px 24px;text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.fcard .tag{position:absolute;top:14px;left:16px;font-size:14px;background:var(--accS);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.fcard .say{position:absolute;top:12px;right:12px}
.fcard .rd{font-size:20px;color:var(--ink2);margin-top:18px}
.fcard .ro{font-size:16px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.fcard .wd{font-size:46px;line-height:1.2;word-break:keep-all;margin-top:6px}
.fcard .wd.long{font-size:32px}
.fcard .mean{font-size:25px;color:var(--accD);margin-top:6px;word-break:keep-all}
.exbox{width:100%;margin-top:14px;background:var(--soft);border:2px dashed #E7D6C6;border-radius:20px;padding:14px 16px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.exbox .tx{flex:1;min-width:0}
.exbox .ex{font-size:19px;line-height:1.45;font-family:var(--fb);font-weight:600}
.exbox .ex.ja{font-family:var(--fj)}
.exbox .ex mark{background:linear-gradient(transparent 55%,var(--lemon) 55%);color:inherit;padding:0 1px}
.exbox .exk{font-size:15px;color:var(--ink2);margin-top:6px;font-family:var(--fb);font-weight:500}
.exbox .exk.blur{filter:blur(5px);cursor:pointer}
.cnav{display:flex;align-items:center;gap:12px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.cnav .cnt{font-family:var(--fe);font-weight:700;font-size:20px;min-width:70px;text-align:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qprog{flex:1;display:flex;align-items:center;gap:10px}
.qprog .bar{flex:1}
.qprog .n{font-family:var(--fe);font-weight:700;font-size:18px;white-space:nowrap}
.qcard{max-width:720px;margin:0 auto}
.prompt{background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:28px;padding:22px 20px 24px;text-align:center;position:relative;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.prompt .ask{font-size:17px;color:var(--ink2)}
.prompt .qw{font-size:44px;line-height:1.2;word-break:keep-all}
.prompt .qw.long{font-size:30px}
.prompt .qk{font-size:30px;word-break:keep-all;line-height:1.3}
.prompt .qr{font-size:17px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.prompt .say{position:absolute;top:12px;right:12px}
.prompt .bigsay{width:96px;height:96px;font-size:40px;border-radius:50%;border:var(--line);background:var(--accS);box-shadow:var(--pop)}
.prompt .cloze{font-size:22px;line-height:1.5;font-family:var(--fb);font-weight:600;word-break:keep-all}
.prompt .cloze u{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);text-decoration:none;color:transparent}
.prompt .clozek{font-size:15px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{min-height:72px;background:var(--card);border:var(--line);border-radius:20px;box-shadow:var(--popS);padding:10px 14px;font-size:20px;line-height:1.3;word-break:keep-all;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.choice small{font-size:13px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.choice.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.choice.no{background:var(--nobg);border-color:var(--no);box-shadow:0 3px 0 var(--no)}
.choice.dim{opacity:.45}
.spell{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.spell .hint{font-family:var(--fe);font-weight:600;font-size:26px;letter-spacing:.12em}
.spell input{width:100%;max-width:440px;height:62px;border:var(--line);border-radius:20px;padding:0 18px;font-family:var(--fe);font-weight:600;font-size:26px;text-align:center;background:#fff;user-select:text;-webkit-user-select:text}
.spell input.ok{border-color:var(--ok);background:var(--okbg)}.spell input.no{border-color:var(--no);background:var(--nobg)}
.spell .acts{display:flex;gap:10px}
.fb{margin-top:16px;border:var(--line);border-radius:22px;padding:14px 16px;background:var(--card);box-shadow:var(--popS);display:flex;flex-direction:column;gap:8px;animation:pop .25s ease}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb .top{display:flex;align-items:center;gap:10px}
.fb .verdict{font-size:20px}
.fb .w{font-size:24px}
.fb .k{font-size:17px;font-family:var(--fb);font-weight:600}
.fb .exbox{margin-top:2px;background:rgba(255,255,255,.7)}
.fb .next{align-self:flex-end}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

/* result */
.result{max-width:640px;margin:20px auto 0;text-align:center}
.result .e{font-size:64px}
.result .t{font-size:30px;margin-top:6px}
.result .score{font-family:var(--fe);font-weight:700;font-size:58px;line-height:1.1;margin-top:10px}
.result .score small{font-size:26px;color:var(--ink2)}
.result .sub{font-size:17px}
.result .miss{margin-top:18px;text-align:left}
.result .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* records */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:16px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:30px;background:var(--acc);border:2px solid var(--ink);border-radius:8px 8px 4px 4px;min-height:4px}
.chart .c i.z{background:#F4ECE4;border-color:#E3D5C8}
.chart .c span{font-size:11px;color:var(--ink2);font-family:var(--fb);font-weight:600}
.chart .c em{font-style:normal;font-size:11px;font-family:var(--fe);font-weight:700}
.tprog{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:14px}
.tprog .r{display:grid;grid-template-columns:28px 1fr 56px;align-items:center;gap:8px;font-size:15px}
.tprog .r .nm{grid-column:2;font-size:15px}
.tprog .r .bar{grid-column:2;height:10px;border-width:1.5px}
.tprog .r b{font-family:var(--fe);font-weight:700;font-size:14px;text-align:right;grid-row:1/3;grid-column:3}
.tprog .r .i{grid-row:1/3;font-size:22px}

/* settings */
.prow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:2px dashed var(--hair);flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .pl{flex:1 1 220px;min-width:0}
.prow .pt{font-size:20px}
.prow .pd{font-size:14px;color:var(--ink2);margin-top:3px;font-family:var(--fb);font-weight:500}
.prow .pa{display:flex;gap:8px;flex-wrap:wrap}
.tgl{width:64px;height:36px;border-radius:999px;border:var(--line);background:#EEE6DE;position:relative;flex:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.tgl.on{background:var(--acc)}.tgl.on::after{left:31px}
.txtin{height:48px;border:var(--line);border-radius:16px;padding:0 14px;font-size:19px;background:#fff;width:200px;user-select:text;-webkit-user-select:text}

/* kana */
.kseg{display:flex;justify-content:center;margin:4px 0 16px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin:0 auto}
.kc{aspect-ratio:1/1;border:var(--line);border-radius:16px;background:var(--card);box-shadow:var(--popS);display:flex;flex-direction:column;align-items:center;justify-content:center}
.kc b{font-family:var(--fj);font-size:32px;font-weight:600;line-height:1}
.kc span{font-family:var(--fe);font-weight:600;font-size:13px;color:var(--ink2);margin-top:4px}
.kc.e{visibility:hidden}
.kc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* setup */
.setup{max-width:520px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.setup .panel{width:100%;text-align:left;display:flex;flex-direction:column;gap:14px}
.setup .lbl{font-size:18px}
.setup .txtin{width:100%}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(47,43,74,.45);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
.modal .box{background:var(--card);border:var(--line);box-shadow:var(--pop);border-radius:28px;padding:24px 22px;max-width:420px;width:100%;text-align:center;animation:pop .25s ease}
.modal .mt{font-size:26px;margin-top:6px}
.modal .md{font-size:16px;color:var(--ink2);margin-top:8px;font-family:var(--fb);font-weight:500;line-height:1.5}
.modal .acts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:17px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#burst{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
#burst span{position:absolute;top:-40px}
.empty{text-align:center;padding:30px 10px}
.empty .e{font-size:56px}
.empty .t{font-size:22px;margin-top:6px}


/* ---------- 마을 ---------- */
:root{--skyband:#CDE9FF;--grass:#AEE6A4;--grass2:#98DB8E}
.village{padding:0;overflow:hidden}
.vhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px 14px}
.vhead .next{margin-left:auto;min-width:240px;font-size:16px}
.vhead .next .bar{margin-top:5px}
.mergebtn{border:var(--line);box-shadow:var(--popS);border-radius:999px;background:var(--lav);padding:6px 16px;font-size:18px}
.scene{position:relative;overflow:hidden;background:linear-gradient(var(--skyband) 0 110px,var(--grass) 110px);border-top:var(--line);padding:120px 16px 22px;min-height:300px}
.scene:before{content:"";position:absolute;left:-5%;right:-5%;top:84px;height:60px;background:radial-gradient(ellipse at 20% 100%,var(--grass2) 0 40%,transparent 41%),radial-gradient(ellipse at 70% 100%,var(--grass2) 0 45%,transparent 46%);pointer-events:none}
.scene.night{background:linear-gradient(#2E2A5E 0 110px,#7FC27A 110px)}

<body data-lang="en">
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="backupInput" accept=".json,application/json,text/plain" hidden>
<script src="data_en.js"></script>
<script src="data_ja.js"></script>
<script src="village.js"></script>
<script>
/* =========================================================
   기본 도구
   ========================================================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const HAS_ANDROID=typeof window.Android!=='undefined';
const KEY='todayWords.v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const IV=[0,1,2,4,7,15,30];      // 단계별 복습 간격(일)
const MASTER=5;                  // 이 단계 이상이면 '마스터'

/* ---------- 단어 목록 ---------- */
const WL={en:[],ja:[]}, BY={en:{},ja:{}}, THEMES={en:window.EN_THEMES,ja:window.JA_THEMES};
EN_THEMES.forEach(t=>t.words.forEach(([w,k,ex,exk,lv])=>{const o={id:w,w,k,ex,exk,lv,th:t.id,i:WL.en.length};WL.en.push(o);BY.en[w]=o;}));
JA_THEMES.forEach(t=>t.words.forEach(([w,r,ro,k,ex,exk])=>{const o={id:w,w,r,ro,k,ex,exk,lv:1,th:t.id,i:WL.ja.length,kanji:w!==r};WL.ja.push(o);BY.ja[w]=o;}));
const TBY={en:{},ja:{}}; ['en','ja'].forEach(l=>THEMES[l].forEach(t=>TBY[l][t.id]=t));

/* ---------- 저장 ---------- */
function blank(){return {v:1,name:'',started:false,lang:'en',newPer:{en:15,ja:10},enStart:2,rate:1,auto:true,romaji:true,showKo:true,
  p:{en:{},ja:{}},wrong:{en:{},ja:{}},day:{en:null,ja:null},log:{},streak:{last:'',n:0,best:0}};}
function load(){
  let raw=null;
  try{ if(HAS_ANDROID) raw=Android.loadData(); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  const b=blank();
  if(!raw) return b;
  try{ const d=JSON.parse(raw); return Object.assign(b,d,{p:Object.assign(b.p,d.p||{}),wrong:Object.assign(b.wrong,d.wrong||{}),day:Object.assign(b.day,d.day||{}),newPer:Object.assign(b.newPer,d.newPer||{}),streak:Object.assign(b.streak,d.streak||{})}); }catch(e){ return b; }
}
let S=load();
function save(){ const j=JSON.stringify(S); try{localStorage.setItem(KEY,j);}catch(e){} try{ if(HAS_ANDROID) Android.saveData(j);}catch(e){} }
const L=()=>S.lang;
const P=(id,l)=>S.p[l||L()][id];

/* ---------- 소리 ---------- */
function speak(text,lang){
  if(!text) return;
  lang=lang||L();
  const tag=lang==='ja'?'ja-JP':'en-US';
  const rate=(lang==='ja'?.9:.92)*S.rate;
  try{ if(HAS_ANDROID && Android.speakLang){ Android.speakLang(text,tag,rate); return; } }catch(e){}
  try{ if(window.speechSynthesis){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=tag; u.rate=rate; speechSynthesis.speak(u);} }catch(e){}
}
const cleanSay=s=>String(s).replace(/^[AB]:\s*/,'').replace(/\s[AB]:\s/g,' … ').replace(/[「」]/g,' ');
function sayW(i){ const o=WL[L()][i]; speak(o.w); }
function sayEx(i){ const o=WL[L()][i]; speak(cleanSay(o.ex)); }
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d,type,vol])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;}); }catch(e){} }
const sfx={ ok:()=>tone([[784,.1,'triangle'],[1175,.2,'triangle']]), no:()=>tone([[240,.16,'sine',.15],[200,.22,'sine',.15]]),
  win:()=>tone([[523,.1,'triangle'],[659,.1,'triangle'],[784,.1,'triangle'],[1046,.3,'triangle']]) };
function buzz(ms){ try{ if(HAS_ANDROID && Android.vibrate) Android.vibrate(ms); }catch(e){} }
let toastT=null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2300); }
function burst(n){ const c=document.createElement('div'); c.id='burst'; document.body.appendChild(c); const ic=['✨','🎉','🌟','💫','📚','🎊'];
  for(let i=0;i<(n||30);i++){ const s=document.createElement('span'); s.textContent=ic[i%ic.length]; const x=Math.random()*100,sz=18+Math.random()*22,d=1.3+Math.random()*.9;
    s.style.cssText=`left:${x}%;font-size:${sz}px;transition:transform ${d}s cubic-bezier(.2,.6,.4,1),opacity ${d}s`; c.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.transform=`translateY(${innerHeight+80}px) rotate(${Math.random()*360}deg)`; s.style.opacity='.2'; })); }
  setTimeout(()=>c.remove(),2600); }
function modal(html){ closeModal(); const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }); document.body.appendChild(m); }
function closeModal(){ document.querySelectorAll('.modal').forEach(m=>m.remove()); }

/* =========================================================
   학습 로직 (간격 반복)
   ========================================================= */
function order(l){
  // 새 단어를 꺼내는 순서: 테마를 돌아가며, 영어는 고른 난이도부터
  const list=WL[l], th=THEMES[l].map(t=>t.id);
  const lvOrder = l==='en' ? [S.enStart,...[1,2,3].filter(x=>x>S.enStart),...[1,2,3].filter(x=>x<S.enStart)] : [1];
  const out=[];
  lvOrder.forEach(lv=>{
    const buckets=th.map(id=>list.filter(o=>o.th===id && o.lv===lv));
    let k=0, any=true;
    while(any){ any=false; buckets.forEach(b=>{ if(b[k]){ out.push(b[k]); any=true; } }); k++; }
  });
  return out;
}
function unseen(l){ return order(l).filter(o=>!S.p[l][o.id]); }
function dueList(l){ const t=today(); return WL[l].filter(o=>{const p=S.p[l][o.id]; return p && p.b>0 && p.b<7 && p.due<=t;}).sort((a,b)=>S.p[l][a.id].due<S.p[l][b.id].due?-1:1); }
function ensureDay(l){
  l=l||L(); const t=today(); let d=S.day[l];
  if(!d || d.d!==t){
    const rev=dueList(l).slice(0,40).map(o=>o.id);
    const fresh=unseen(l).slice(0,S.newPer[l]).map(o=>o.id);
    d=S.day[l]={d:t,rev,fresh,done:{},fin:false};
    save();
  }
  return d;
}
function dayItems(d){ return [...d.fresh,...d.rev]; }
function dayLeft(d){ return dayItems(d).filter(id=>!(id in d.done)); }
function stage(id,l){ const p=S.p[l||L()][id]; return p?p.b:-1; }
function grade(id,ok,l){
  l=l||L(); const t=today();
  const p=S.p[l][id]||(S.p[l][id]={b:0,due:t,c:0,x:0});
  if(ok){ if(p.b===0 || p.due<=t){ p.b=Math.min(p.b+1,6); p.due=addDays(t,IV[p.b]); } p.c++;
    if(S.wrong[l][id]!=null){ S.wrong[l][id]--; if(S.wrong[l][id]<=0) delete S.wrong[l][id]; } }
  else { p.b=1; p.due=addDays(t,1); p.x++; S.wrong[l][id]=2; }
  p.t=t;
  const g=S.log[t]||(S.log[t]={}); const x=g[l]||(g[l]={n:0,c:0}); x.n++; if(ok) x.c++;
  const d=S.day[l]; if(d && d.d===t && dayItems(d).includes(id) && !(id in d.done)) d.done[id]=ok?1:0;
  save();
}
function markKnown(id,l){ l=l||L(); const t=today(); S.p[l][id]={b:MASTER,due:addDays(t,IV[MASTER]),c:1,x:0,t,known:1}; save(); }
function streakNow(){ const s=S.streak, t=today(); if(s.last===t||s.last===addDays(t,-1)) return s.n; return 0; }
function finishDay(l){
  const d=S.day[l]; if(!d||d.fin) return false;
  d.fin=true; const t=today(), s=S.streak;
  if(s.last!==t){ s.n = s.last===addDays(t,-1) ? s.n+1 : 1; s.last=t; s.best=Math.max(s.best,s.n); }

   퀴즈
   ========================================================= */
let Q=null, advT=null;
function canMode(o,m,l){
  if(m==='cloze') return l==='en' && o.ex.toLowerCase().includes(o.w.toLowerCase().replace(/[.?!]$/,''));
  if(m==='spell') return l==='en' && /^[a-z-]+$/i.test(o.w) && o.w.length<=13;
  if(m==='reading') return l==='ja' && o.kanji;
  return true;
}
function pickMode(o,l,pref){
  if(pref && pref!=='mix') return canMode(o,pref,l)?pref:'meaning';
  const b=stage(o.id,l);
  const pool = b<=0 ? ['meaning','meaning','listen'] : b<=2 ? ['meaning','reverse','listen',l==='en'?'cloze':'reading'] : ['reverse','listen',l==='en'?'cloze':'reading',l==='en'?'spell':'reverse'];
  const ok=shuffle(pool).filter(m=>canMode(o,m,l)); return ok[0]||'meaning';
}
function startToday(again){
  const l=L(), d=ensureDay(l); const ids=again?dayItems(d):dayLeft(d);
  if(!ids.length){ go('home'); return; }
  // 새 단어 먼저(순서대로), 복습은 섞어서
  const fr=ids.filter(id=>d.fresh.includes(id)), rv=shuffle(ids.filter(id=>!d.fresh.includes(id)));
  beginQuiz([...shuffle(fr),...rv],'mix',{kind:'today',title:'오늘의 단어',again:!!again});
}
function startTheme(tid,mode){
  const l=L(), t=TBY[l][tid];
  let ids=t.words.map(w=>w[0]);
  if(mode!=='mix'){ const okIds=ids.filter(id=>canMode(BY[l][id],mode,l)); if(okIds.length>=4) ids=okIds; }
  // 덜 익힌 단어 위주로 10개
  ids=shuffle(ids).sort((a,b)=>stage(a)-stage(b)).slice(0,10);
  beginQuiz(shuffle(ids),mode,{kind:'theme',title:t.name,theme:tid});
}

function beginQuiz(ids,mode,meta){
  const l=L();
  Q={l,mode,meta,items:ids.map(id=>({id,m:pickMode(BY[l][id],l,mode),retry:false})),i:0,first:0,total:ids.length,miss:[],t0:Date.now(),answered:false};

function distract(o,l,field,n){
  // 같은 테마에서 먼저, 모자라면 다른 테마에서 (모양이 비슷한 것 우선)
  const val=x=>field==='k'?x.k:field==='r'?x.r:x.w;
  const words=s=>String(s).split(' ').length;
  const same=shuffle(WL[l].filter(x=>x.th===o.th && x.id!==o.id));
  const other=shuffle(WL[l].filter(x=>x.th!==o.th));
  let pool=[...same,...other];
  if(field==='w' && l==='en'){ const wc=words(o.w); pool=[...pool.filter(x=>Math.abs(words(x.w)-wc)<=1),...pool.filter(x=>Math.abs(words(x.w)-wc)>1)]; }
  if(field==='r'){ pool=pool.filter(x=>x.kanji||true); }
  const out=[], seen=new Set([val(o)]);
  for(const x of pool){ const v=val(x); if(seen.has(v)) continue; seen.add(v); out.push(x); if(out.length>=n) break; }
  return out;
}
function rQuiz(){
  if(!Q){ go('home'); return; }

  const doneN=Math.min(Q.i,Q.items.length);

  const rom=(x)=>l==='ja'&&S.romaji?`<div class="qr">${esc(x.ro)}</div>`:'';

  if(m==='meaning'){

    choices=opts('w',x=>l==='ja'?`<span class="ja" lang="ja">${esc(x.w)}</span>${x.kanji?`<small lang="ja">${esc(x.r)}</small>`:''}`:`<span class="en">${esc(x.w)}</span>`);
  } else if(m==='listen'){

    choices=opts('r',x=>`<span class="ja" lang="ja">${esc(x.r)}</span>${S.romaji?`<small>${esc(x.ro)}</small>`:''}`);

    <div id="fb"></div></div>`;

function pick(btn){

const normalize=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
function checkSpell(){
  if(Q.answered) return; const inp=$('#sp'); const v=normalize(inp.value); if(!v){ inp.focus(); return; }
  const o=BY[Q.l][Q.items[Q.i].id]; const ok=v===normalize(o.w);

}
function spellGiveUp(){ if(Q.answered) return; Q.answered=true; const inp=$('#sp'); inp.classList.add('no'); inp.value=BY[Q.l][Q.items[Q.i].id].w; answer(false); }
function answer(ok){
