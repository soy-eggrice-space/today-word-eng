      connectWithPassword(pw,S.role,pw2).then(r=>{ if(r.confirm){ ED_SYNC.confirm=true; ED_SYNC.err=''; setSt('off'); rerenderEdit(); return; } if(r.msg){ ED_SYNC.err=r.msg; setSt(S.sync?SYNC.st:'off'); rerenderEdit(); return; } ED_SYNC.pw=''; ED_SYNC.confirm=false; ED_SYNC.err=''; rerenderEdit(); }); break; }
    case 'syncoff': if(!confirmTap(b)) break; syncOff(); rerenderEdit(); toast('연결을 끊었어요. 이제 이 기기에만 저장돼요'); break;
    case 'cal': openCal(); break;
    case 'cmon': { const n=new Date(cal.y,cal.m+Number(d.d),1); cal.y=n.getFullYear(); cal.m=n.getMonth(); renderCal(); break; }
    case 'ckid': cal.kid=d.kid; renderCal(); break;
    case 'csel': cal.sel=d.date; { const y=window.scrollY; renderCal(); window.scrollTo(0,y); } break;
    case 'sound': S.sound=!S.sound; save(); renderHome(); if(S.sound) tone([660,880],.1); toast(S.sound?'소리를 켰어요':'소리를 껐어요'); break;
    case 'fs': { const el=document.documentElement; try{ if(document.fullscreenElement) document.exitFullscreen?.(); else { const p=el.requestFullscreen?.(); p&&p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없어요')); if(!el.requestFullscreen) toast('이 화면에서는 전체 화면을 쓸 수 없어요'); } }catch(err){toast('이 화면에서는 전체 화면을 쓸 수 없어요')} break; }
    case 'etab': ed.tab=d.tab; rerenderEdit(); break;
    case 'erid': ed.rid=d.rid; rerenderEdit(); break;
    case 'ekid': ed.kid=d.kid; ed.all=false; rerenderEdit(); break;
    case 'all': ed.all=!ed.all; rerenderEdit(); break;
    case 'mv': {
      const arr=S.routines[ed.rid][ed.kid], vis=tasksOf(ed.rid,ed.kid);
      const vi=vis.findIndex(t=>t.id===d.tid), vj=vi+Number(d.d); if(vj<0||vj>=vis.length) break;
      const i=arr.indexOf(vis[vi]), j=arr.indexOf(vis[vj]); [arr[i],arr[j]]=[arr[j],arr[i]];
      save(); pushConfig(); rerenderEdit(); break; }
    case 'del': {
      const arr=S.routines[ed.rid][ed.kid], t=arr.find(x=>x.id===d.tid); if(!t) break;
      S.routines[ed.rid][ed.kid]=arr.filter(x=>x.id!==d.tid);
      const e=S.log[todayKey()]?.[ed.rid]?.[ed.kid]; if(e){ e.done=e.done.filter(x=>x!==d.tid); pushEntry(ed.rid,ed.kid); }
      save(); pushConfig(); rerenderEdit(); toast(`'${t.label}'을 지웠어요`); break; }
    case 'preset': {
      const c=CATALOG[Number(d.i)], targets=ed.all?S.kids.map(k=>k.id):[ed.kid];
      const has=id=>S.routines[ed.rid][id].some(t=>!t.once&&t.icon===c[0]&&t.label===c[1]);
      if(b.getAttribute('aria-pressed')==='true'){ for(const id of targets) S.routines[ed.rid][id]=S.routines[ed.rid][id].filter(t=>!( !t.once&&t.icon===c[0]&&t.label===c[1])); toast(`'${c[1]}'을 뺐어요`); }
      else { addTask(targets.filter(id=>!has(id)),c[0],c[1],false); toast(ed.all?`세 명 모두에게 '${c[1]}'을 넣었어요`:`${kidById(ed.kid).name}에게 '${c[1]}'을 넣었어요`); }
      save(); pushConfig(); rerenderEdit(); break; }
    case 'pick': ed.icon=d.icon; document.querySelectorAll('.ipk').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.icon===ed.icon))); break;
    case 'addnew': {
      const inp=$('#newLabel'), label=(inp?.value||'').trim();
      if(!label){ $('#newErr').hidden=false; inp?.focus(); break; }
      const once=d.mode==='once', targets=ed.all?S.kids.map(k=>k.id):[ed.kid];
      addTask(targets,ed.icon,label,once); ed.label=''; save(); pushConfig(); rerenderEdit();
      toast(`${ed.all?'세 명 모두':kidById(ed.kid).name}에게 ${once?'오늘만 ':''}'${label}'을 넣었어요`); break; }
    case 'kcolor': kidById(d.kid).color=d.c; save(); pushConfig(); rerenderEdit(); break;
    case 'kanimal': kidById(d.kid).animal=d.a; save(); pushConfig(); rerenderEdit(); break;
    case 'adj': { const before=S.bank[d.kid]||0; S.bank[d.kid]=Math.max(0,before+Number(d.d)); rinc(`bank/${d.kid}`,S.bank[d.kid]-before); save(); rerenderEdit(); break; }
    case 'zero': if(!confirmTap(b)) break; for(const k of S.kids) S.bank[k.id]=0; rset('bank',S.bank); save(); rerenderEdit(); toast('별을 모두 0개로 되돌렸어요'); break;
    case 'rreset': if(!confirmTap(b)) break; { const day=S.log[todayKey()]; if(day&&day[d.rid]){ day._x=day._x||{}; for(const [k,e] of Object.entries(day[d.rid])) if(e.stars){ day._x[k]=(day._x[k]||0)+e.stars; rinc(`log/${todayKey()}/_x/${k}`,e.stars); } delete day[d.rid]; rset(`log/${todayKey()}/${d.rid}`,null); } save(); rerenderEdit(); toast(`${ROUT[d.rid].name}을 처음부터 다시 시작해요`); } break;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tc-in')&&!e.isComposing){ e.preventDefault(); const i=TRAY.findIndex(x=>x.k===e.target.dataset.slot); const nx=TRAY[i+1]; if(nx) $(`.tc-in[data-slot="${nx.k}"]`)?.focus(); else e.target.blur(); return; } if(e.key==='Enter'&&e.target.id==='chatIn'&&!e.isComposing){ e.preventDefault(); $('[data-act="isend"]')?.click(); return; } if(e.key==='Enter'&&(e.target.id==='welPw'||e.target.id==='welPw2')){ e.preventDefault(); welcomeConnect(); } if(e.key==='Enter'&&(e.target.id==='syncPw'||e.target.id==='syncPw2')){ e.preventDefault(); $('[data-act="syncpw"]')?.click(); } });
document.addEventListener('focusin',e=>{ if(e.target.classList&&e.target.classList.contains('tc-in')&&F.open){ F.slot=e.target.dataset.slot; paintTray(); } });
document.addEventListener('input',e=>{ const id=e.target.id; if(id==='chatIn') CH.draft=e.target.value; if(e.target.classList&&e.target.classList.contains('tc-in')){ const sl=e.target.dataset.slot, dd=F.draft[sl]; if(dd){ dd.name=e.target.value; F.slot=sl; if(!dd.manual) dd.icon=e.target.value.trim()?(guessFood(e.target.value)!=='dish'?guessFood(e.target.value):(TRAY.find(x=>x.k===sl).def||'dish')):(TRAY.find(x=>x.k===sl).def||'dish'); paintTray(); } } if(id==='welUrl') W.url=e.target.value; if(id==='welPw'&&!W.confirm) W.pw=e.target.value; if(id==='phLabel'){ ed.phLabel=e.target.value; const er=$('#phErr'); if(er) er.hidden=true; } if(id==='phEmoji') ed.phEmoji=e.target.value; if(id==='tgToken') TG.token=e.target.value; if(e.target.id==='newLabel'){ ed.label=e.target.value; const er=$('#newErr'); if(er) er.hidden=true; } });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('al-time')||t.classList.contains('al-text')){
    if(t.id==='alopen'){ if(t.value){ S.alarmCfg.open.time=t.value; save(); syncAlarms(); toast(`${t.value}에 켜지게 했어요`); } return; }
    const a=S.alarmCfg.says.find(x=>x.id===t.dataset.aid); if(!a) return;
    if(t.classList.contains('al-time')){ if(t.value){ a.time=t.value; toast(`${t.value}로 바꿨어요`); } } else { const v=t.value.trim(); if(v){ a.text=v; toast('읽어 줄 말을 바꿨어요'); } else t.value=a.text; }
    save(); syncAlarms(); return;
  }
  if(t.classList.contains('ph-l')||t.classList.contains('ph-e')){ const it=S.msg.phrases.find(x=>x.id===t.dataset.pid); if(!it) return; const v=t.value.trim();
    if(t.classList.contains('ph-l')){ if(v){ it.label=v; save(); pushMsg(); toast('바꿨어요'); } else t.value=it.label; } else { it.emoji=v; save(); pushMsg(); toast('이모지를 바꿨어요'); } return; }
  if(t.classList.contains('rn')){ const it=S.routines[ed.rid][ed.kid].find(x=>x.id===t.dataset.tid); const v=t.value.trim(); if(it&&v){it.label=v;save();pushConfig();toast('이름을 바꿨어요')} else if(it) t.value=it.label; }
  if(t.id&&t.id.startsWith('kn-')){ const k=kidById(t.dataset.kid); const v=t.value.trim(); if(k&&v){k.name=v;save();pushConfig();rerenderEdit()} else if(k) t.value=k.name; }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&view.screen==='run'){wl=null;keepAwake(true)} });
let lastDay=todayKey();
setInterval(()=>{ if(todayKey()!==lastDay){ lastDay=todayKey(); prune(); pruneMeds(); save(); show(); } },30000);

window.appBack=()=>{ if(document.querySelector('.alarm-pop')){ $('[data-act="alarmok"]')?.click(); return true; } if(document.querySelector('.sent')) return true; if(H.open){ H.open=false; renderHosp(); return true; } if(view.screen==='welcome'){ if(W.step===2){ W.step=1; W.err=''; renderWelcome(); return true; } return false; } if(view.screen==='msg'&&M.page===2){ if(M.rec==='rec') recStop(); M.page=1; renderMsg(); window.scrollTo(0,0); return true; } if(F.pick){ F.pick=null; renderPick(); return true; } if(F.open){ F.open=false; renderFoodSheet(); return true; } if(view.screen==='char'&&CR.try){ CR.try=null; renderChar(); return true; } const up={char:'family',fstats:'family',food:'family',run:'home',cal:'home',edit:view.from||'home',home:'family',msg:'family',replies:'family',room:'family'}[view.screen]; if(up){ view.screen=up; show(); return true } return false };
window.appResume=()=>{ if(todayKey()!==lastDay){ lastDay=todayKey(); prune(); save(); } if(S.sync){ flush(); if(!SYNC.es||SYNC.es.readyState===2) connectStream(); if(isAdult()&&!INB.es.some(e=>e.readyState!==2)) inboxConnect(); roomPrune(); } show(); if(rxSetup) rxSoon(); };
window.addEventListener('online',()=>{ if(S.sync){ flush(); connectStream(); } });
pruneMeds();
if(S.onboard) view.screen='welcome';
show();
if(S.needPush){ S.needPush=false; save(); if(S.sync&&S.role==='kids'){ pushConfig(); pushMsg(); } }
if(S._foodMig){ delete S._foodMig; if(S.sync&&S.role==='kids'){ rset('foods/days',FD().days); rset('foods/daysv',1); } save(); }
if(S.sync){ flush(); connectStream(); applyRole(); roomPrune(); }
if(!S.onboard){ syncAlarms(); kidsStop(); }
try{ const pa=IS_APP&&window.Android.takeAlarm?JSON.parse(window.Android.takeAlarm()||'null'):null; if(pa) setTimeout(()=>window.onAlarm(pa.type,pa.text),700); }catch(e){}
