<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>우리가족</title>

<style>
@font-face{font-family:'Jua';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'IBM Plex Sans KR';src:url('fonts/IBMPlexSansKR-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans KR';src:url('fonts/IBMPlexSansKR-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans KR';src:url('fonts/IBMPlexSansKR-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Sans KR';src:url('fonts/IBMPlexSansKR-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
</style>
<style>
/* Layout: three lanes, one per child — pictogram tiles; everyone who finishes gets the same stars */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F3F5FA; --line:#E1E5EE;
  --ink:#232A3D; --ink-2:#5F6880; --ink-3:#959DB0;
  --accent:#5B6AD9; --on-accent:#FFFFFF; --mixc:#141A2E; --danger:#E25C52;
  --gold:#F5C142; --silver:#B9C3D1; --bronze:#E19A5F; --rib-a:#6E7EEB; --rib-b:#F07294;
  --badge-bg:#FFF0C2; --badge-ink:#7A5A00;
  --chip-bg:#FFFFFF; --chip-ink:#232A3D;
  --shadow:0 1px 2px rgba(30,40,80,.05),0 8px 22px rgba(30,40,80,.07);
  --sc-m-a:#CFE5FF; --sc-m-b:#FFE0C4; --sun-ink:#F08A3C; --sun-tint:#FFD66E; --sun-glow:rgba(255,205,110,.55);
  --sc-e-a:#4A50A3; --sc-e-b:#7D62BC; --sc-e-ink:#F7F5FF; --moon-ink:#5D58B8; --moon-tint:#FFE38C; --starlight:#FFFFFF;
  --sc-o-a:#C9F0DC; --sc-o-b:#E8F7C8; --door-ink:#2F9C6B; --door-tint:#A5E5C4; --hill:rgba(70,175,110,.24);
  --bubble:rgba(255,255,255,.9);
  --sc-t-a:#D8E2FF; --sc-t-b:#EADCFF; --todo-ink:#5967D6; --todo-tint:#C8CEFF;
  --sc-g-a:#FFDDE6; --sc-g-b:#FFEDCF; --bub-ink:#E2607F; --bub-tint:#FFC8D5; --on-bub:#FFFFFF;
  --glow:rgba(255,255,255,.6); --ok:#3DB874; --hair:#3B2A2A;
  --f-d:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-b:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141C; --surface:#1A1F2B; --surface-2:#222836; --line:#2E3546;
  --ink:#ECEFF6; --ink-2:#A7AFC2; --ink-3:#717A90;
  --accent:#A0AAFF; --on-accent:#11141C; --mixc:#FFFFFF; --danger:#FF928A;
  --gold:#EFC44E; --silver:#B9C2CF; --bronze:#DCA06A; --rib-a:#7381EE; --rib-b:#EE7598;
  --badge-bg:#3A3116; --badge-ink:#F2D27A;
  --chip-bg:#ECEFF6; --chip-ink:#11141C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --sc-m-a:#24334F; --sc-m-b:#45313A; --sun-ink:#FFB474; --sun-tint:#9A6A2A; --sun-glow:rgba(255,170,70,.16);
  --sc-e-a:#171A3A; --sc-e-b:#2E2356; --sc-e-ink:#F4F2FF; --moon-ink:#CDC8FF; --moon-tint:#8A7A35; --starlight:#FFFFFF;
  --sc-o-a:#16352A; --sc-o-b:#25321D; --door-ink:#8EDDB7; --door-tint:#2D6A50; --hill:rgba(80,170,110,.16);
  --bubble:rgba(255,255,255,.09);
  --sc-t-a:#212850; --sc-t-b:#2E2552; --todo-ink:#B5BCFF; --todo-tint:#3E4697;
  --sc-g-a:#3C2030; --sc-g-b:#3A2B1E; --bub-ink:#FF93AE; --bub-tint:#7A2F47; --on-bub:#2A121B;
  --glow:rgba(255,255,255,.06); --ok:#55CF8D; --hair:#2A1E1E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2B; --surface-2:#222836; --line:#2E3546;
  --ink:#ECEFF6; --ink-2:#A7AFC2; --ink-3:#717A90;
  --accent:#A0AAFF; --on-accent:#11141C; --mixc:#FFFFFF; --danger:#FF928A;
  --gold:#EFC44E; --silver:#B9C2CF; --bronze:#DCA06A; --rib-a:#7381EE; --rib-b:#EE7598;
  --badge-bg:#3A3116; --badge-ink:#F2D27A;
  --chip-bg:#ECEFF6; --chip-ink:#11141C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --sc-m-a:#24334F; --sc-m-b:#45313A; --sun-ink:#FFB474; --sun-tint:#9A6A2A; --sun-glow:rgba(255,170,70,.16);
  --sc-e-a:#171A3A; --sc-e-b:#2E2356; --sc-e-ink:#F4F2FF; --moon-ink:#CDC8FF; --moon-tint:#8A7A35; --starlight:#FFFFFF;
  --sc-o-a:#16352A; --sc-o-b:#25321D; --door-ink:#8EDDB7; --door-tint:#2D6A50; --hill:rgba(80,170,110,.16);
  --bubble:rgba(255,255,255,.09);
  --sc-t-a:#212850; --sc-t-b:#2E2552; --todo-ink:#B5BCFF; --todo-tint:#3E4697;
  --sc-g-a:#3C2030; --sc-g-b:#3A2B1E; --bub-ink:#FF93AE; --bub-tint:#7A2F47; --on-bub:#2A121B;
  --glow:rgba(255,255,255,.06); --ok:#55CF8D; --hair:#2A1E1E;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{word-break:keep-all;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-b);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* pictograms */
.ic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic .t{fill:var(--ic-tint,transparent)}
.ic .tf{fill:var(--ic-tint,transparent);stroke:none}
.ic .s{fill:currentColor;stroke:none}
.ui{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st{fill:var(--gold);flex:none}
.st.off{fill:none;stroke:currentColor;stroke-width:1.7;opacity:.4}
.stars{display:inline-flex;gap:2px;align-items:center}

/* kid color system */
.kid{--k-soft:color-mix(in oklab,var(--k) 15%,var(--surface));--k-tint:color-mix(in oklab,var(--k) 36%,var(--surface));--k-deep:color-mix(in oklab,var(--k) 72%,var(--mixc));--k-line:color-mix(in oklab,var(--k) 88%,var(--mixc))}
.ava{width:var(--s);height:var(--s);border-radius:50%;background:var(--k);display:grid;place-items:center;flex:none;overflow:hidden;color:color-mix(in oklab,var(--k) 35%,#121427)}
.ava svg{width:88%;height:88%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ava .w{fill:#FFFFFF}.ava .s{fill:currentColor;stroke:none}.ava .bk{fill:#F28C28;stroke:#C9661A}

/* scenes */
.scene{position:relative;isolation:isolate;background:linear-gradient(150deg,var(--a),var(--b));color:var(--sink)}
.scene[data-rid="morning"]{--a:var(--sc-m-a);--b:var(--sc-m-b);--sink:var(--ink);--sc-ic:var(--sun-ink);--sc-tint:var(--sun-tint)}
.scene[data-rid="evening"]{--a:var(--sc-e-a);--b:var(--sc-e-b);--sink:var(--sc-e-ink);--sc-ic:var(--moon-ink);--sc-tint:var(--moon-tint)}
.scene[data-rid="out"]{--a:var(--sc-o-a);--b:var(--sc-o-b);--sink:var(--ink);--sc-ic:var(--door-ink);--sc-tint:var(--door-tint)}
.scene::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit}
.scene[data-rid="morning"]::before{background:radial-gradient(260px 260px at 92% -10%,var(--sun-glow),transparent 70%)}
.scene[data-rid="evening"]::before{opacity:.75;background-image:
  radial-gradient(1.6px 1.6px at 12% 24%,var(--starlight),transparent),radial-gradient(1.2px 1.2px at 28% 70%,var(--starlight),transparent),
  radial-gradient(2px 2px at 46% 18%,var(--starlight),transparent),radial-gradient(1.2px 1.2px at 63% 56%,var(--starlight),transparent),
  radial-gradient(1.8px 1.8px at 78% 28%,var(--starlight),transparent),radial-gradient(1.2px 1.2px at 90% 72%,var(--starlight),transparent),
  radial-gradient(1.4px 1.4px at 36% 42%,var(--starlight),transparent),radial-gradient(1.2px 1.2px at 85% 10%,var(--starlight),transparent)}
.scene[data-rid="out"]::before{background:radial-gradient(90% 55% at 10% 125%,var(--hill),transparent 70%),radial-gradient(70% 45% at 85% 130%,var(--hill),transparent 70%)}
.bubble{background:var(--bubble);color:var(--ink)}
.sc-ico{display:grid;place-items:center;color:var(--sc-ic);--ic-tint:var(--sc-tint);background:var(--bubble)}

/* ---------- HOME ---------- */
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-block:28px 6px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--ink-3)}
.date{font:clamp(32px,4.4vw,48px)/1.1 var(--f-d);margin-top:6px;text-wrap:balance}
.greet{color:var(--ink-2);font-size:17px;margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{position:relative;overflow:hidden;height:52px;min-width:52px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink-2)}
.tbtn.icon-only{padding:0}
.tbtn::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent)}
.tbtn.holding::after{width:100%;transition:width .9s linear}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-block:22px}
.rcard{border-radius:34px;padding:26px;min-height:310px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease}
.rcard:active{transform:scale(.98)}
.rcard .sc-ico{width:88px;height:88px;border-radius:28px}
.rcard .sc-ico .ic{width:62px;height:62px}
.rc-title{font:clamp(30px,3.2vw,40px)/1.1 var(--f-d)}
.rc-hint{font-size:15px;opacity:.78;margin-top:-4px}
.now{position:absolute;top:22px;right:22px;padding:7px 14px;border-radius:999px;background:var(--chip-bg);color:var(--chip-ink);font-weight:700;font-size:13px;letter-spacing:.03em;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.rc-kids{margin-top:auto;display:flex;gap:16px;flex-wrap:wrap}
.rk{display:flex;flex-direction:column;align-items:center;gap:4px;font:15px/1.2 var(--f-d)}
.rk small{font:600 12px var(--f-b);opacity:.75;font-variant-numeric:tabular-nums}
.ring{position:relative;width:60px;height:60px;display:grid;place-items:center}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg);fill:none;stroke-width:4;stroke-linecap:round}
.ring .bg{stroke:color-mix(in oklab,currentColor 20%,transparent)}
.ring .fg{stroke:var(--k);transition:stroke-dashoffset .4s ease}
.ring-medal{position:absolute;right:-8px;bottom:-6px}
.board{background:var(--surface);border-radius:34px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.board-h h2{font:24px var(--f-d)}
.board-h p{color:var(--ink-3);font-size:14px}
.board-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:24px;background:var(--k-soft);min-width:0}
.bk-name{font:22px/1.1 var(--f-d)}
.bk-n{display:flex;align-items:center;gap:6px;font:34px/1 var(--f-d);font-variant-numeric:tabular-nums;margin-top:4px}
.bk-today{font-size:13px;font-weight:600;color:var(--k-deep);margin-top:4px}
.foot{color:var(--ink-3);font-size:14px;padding-block:18px 36px;text-align:center;text-wrap:balance}

/* ---------- RUN ---------- */
.band{padding-block:16px}
.band-in{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.back{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.band-title{display:flex;align-items:center;gap:14px;flex:1;min-width:220px}
.band .sc-ico{width:62px;height:62px;border-radius:20px;flex:none}
.band .sc-ico .ic{width:44px;height:44px}
.band h1{font:clamp(28px,3vw,36px)/1.1 var(--f-d)}
.band-date{font-size:14px;opacity:.78;margin-top:2px}
.podium{display:flex;align-items:flex-end;gap:10px;padding:10px 16px 8px;border-radius:26px}
.pod-lbl{font:600 12px/1.25 var(--f-b);color:var(--ink-2);align-self:center;letter-spacing:.04em;margin-right:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px}
.pod-slot{width:54px;height:54px;border-radius:50%;border:4px solid var(--m);background:var(--surface);display:grid;place-items:center;font:22px var(--f-d);color:var(--ink-3);overflow:hidden}
.pod.p1 .pod-slot{width:66px;height:66px;font-size:26px}
.pod-slot .ava{--s:100% !important}
.lanes{--ico:64px;--fs:26px;--chk:42px;--th:88px;--gap:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-block:20px 48px;align-items:start}
.lane{position:relative;overflow:hidden;border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px;background:color-mix(in oklab,var(--k) 11%,var(--bg));border:2px solid color-mix(in oklab,var(--k) 28%,transparent);min-width:0}
.lane-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:2px 2px 0}
.lane-name{font:30px/1.05 var(--f-d)}
.prog{display:flex;gap:4px;margin-top:8px}
.prog i{flex:1;height:9px;border-radius:5px;background:color-mix(in oklab,var(--k) 26%,var(--surface))}
.prog i.on{background:var(--k)}
.bank{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;background:var(--surface);font:20px/1 var(--f-d);font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.reward{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-radius:20px;background:var(--surface);color:var(--ink-2);font:19px var(--f-d);border:2px dashed color-mix(in oklab,var(--k) 35%,transparent)}
.finish{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:22px;background:var(--surface);border:3px solid var(--m)}
.finish b{font:26px/1.1 var(--f-d);font-weight:400;display:block}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--gap)}
.task{display:grid;grid-template-columns:var(--ico) minmax(0,1fr) var(--chk);align-items:center;gap:14px;width:100%;min-height:var(--th);padding:10px 14px 10px 10px;border-radius:24px;background:var(--surface);border:3px solid transparent;box-shadow:var(--shadow);text-align:left;transition:transform .12s ease,background .25s ease,border-color .25s ease}
.task:active{transform:scale(.97)}
.t-ico{width:var(--ico);height:var(--ico);border-radius:20px;background:var(--k-soft);display:grid;place-items:center;color:var(--k-deep);--ic-tint:var(--k-tint);transition:background .25s}
.t-ico .ic{width:74%;height:74%}
.t-label{font:var(--fs)/1.15 var(--f-d);color:var(--ink);overflow-wrap:anywhere;text-wrap:balance}
.once{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--badge-bg);color:var(--badge-ink);font:700 12px/1.5 var(--f-b);letter-spacing:.02em}
.t-check{width:var(--chk);height:var(--chk);border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.t-check .ui{width:62%;height:62%;stroke-width:3.2}
.task.next{border-color:var(--k-line);animation:nudge 2.4s ease-in-out infinite}
.task[aria-pressed="true"]{background:var(--k-soft);box-shadow:none}
.task[aria-pressed="true"] .t-ico{background:var(--surface)}
.task[aria-pressed="true"] .t-label{color:var(--ink-2);text-decoration:line-through 3px color-mix(in oklab,var(--k) 55%,transparent)}
.task[aria-pressed="true"] .t-check{background:var(--k-deep);border-color:var(--k-deep);color:#FFFFFF}
.task.pop .t-check{animation:chk .38s ease}
.lane-empty{padding:28px 10px;text-align:center;color:var(--ink-3);font:20px var(--f-d)}
@keyframes nudge{0%,100%{box-shadow:var(--shadow),0 0 0 0 color-mix(in oklab,var(--k) 0%,transparent)}50%{box-shadow:var(--shadow),0 0 0 7px color-mix(in oklab,var(--k) 22%,transparent)}}
@keyframes chk{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}

.cele{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;border-radius:inherit;background:color-mix(in oklab,var(--k-deep) 92%,transparent);animation:celeOut 3s ease forwards;overflow:hidden}
.cele-in{display:flex;flex-direction:column;align-items:center;gap:8px;color:#FFFFFF;text-align:center}
.cele-medal{animation:medalPop .7s cubic-bezier(.3,1.4,.5,1) both}
.cele-t{font:58px/1 var(--f-d);text-shadow:0 2px 0 rgba(0,0,0,.12)}
.cele-sub{font:22px var(--f-d);opacity:.92}
.cf{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes celeOut{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes medalPop{0%{transform:scale(.3) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}

/* ---------- EDIT ---------- */
.ed-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:20px 6px}
.ed-top h1{font:30px var(--f-d);flex:1;min-width:140px}
.ed-top .back{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;padding:5px;background:var(--surface-2);border-radius:20px;gap:4px}
.seg button{min-height:46px;padding:0 16px;border-radius:16px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .ic{width:26px;height:26px;color:var(--ink-2);--ic-tint:var(--surface-2)}
.ed-bar{display:flex;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;padding-block:12px 48px}
.panel{background:var(--surface);border-radius:28px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font:22px var(--f-d);font-weight:400;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h2 small{font:600 13px var(--f-b);color:var(--ink-3)}
.panel h3{font:600 13px var(--f-b);letter-spacing:.08em;color:var(--ink-3)}
.panel hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.hint{color:var(--ink-3);font-size:14px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:20px;background:var(--surface-2)}
.row .t-ico{--ico:52px;border-radius:16px;background:var(--k-soft)}
.row-mid{display:flex;align-items:center;gap:6px;min-width:0}
.row-mid .once{margin:0;flex:none}
.rn{flex:1;width:100%;min-width:0;border:0;background:transparent;font:21px var(--f-d);color:var(--ink);padding:8px;border-radius:12px}
.rn:focus{background:var(--surface);outline:2px solid var(--k-line,var(--accent))}
.row-act{display:flex;gap:4px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface)}
.ib:disabled{opacity:.3;cursor:default}
.ib.del{color:var(--danger)}
.switch{display:inline-flex;align-items:center;gap:10px;font:600 14px var(--f-b);color:var(--ink-2)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] .sw{background:var(--accent)}
.switch[aria-checked="true"] .sw::after{transform:translateX(20px)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:16px;background:var(--surface-2);font:17px/1.15 var(--f-d);text-align:left;border:2px solid transparent;min-width:0}
.chip .ci{width:42px;height:42px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--k-deep);--ic-tint:var(--k-tint)}
.chip .ci .ic{width:32px;height:32px}
.chip span:nth-child(2){flex:1;min-width:0}
.chip .ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--k-deep);color:#FFFFFF;opacity:0;flex:none}
.chip .ok .ui{width:15px;height:15px;stroke-width:3}
.chip[aria-pressed="true"]{border-color:var(--k-line);background:var(--k-soft)}
.chip[aria-pressed="true"] .ok{opacity:1}
.fld{width:100%;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font:21px var(--f-d);color:var(--ink)}
.fld:focus{outline:none;border-color:var(--k,var(--accent))}
.err{color:var(--danger);font-size:14px;font-weight:600;margin-top:-6px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.ipk{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;border:2px solid transparent;color:var(--k-deep);--ic-tint:var(--k-tint)}
.ipk .ic{width:70%;height:70%}
.ipk[aria-pressed="true"]{border-color:var(--k-line);background:var(--k-soft)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:54px;padding:0 22px;border-radius:16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 180px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.armed{background:var(--danger);color:#FFFFFF}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-block:12px 20px}
.kprev{display:flex;align-items:center;gap:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw-c{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw-c[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.animals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.an-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:2px solid transparent;font-size:12px;font-weight:600;color:var(--ink-2)}
.an-b[aria-pressed="true"]{border-color:var(--k-line);background:var(--k-soft)}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--surface-2)}
.srow .num{font:30px var(--f-d);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.srow .nm{font:21px var(--f-d)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--surface-2)}
.rrow .sc-ico{width:52px;height:52px;border-radius:16px}
.rrow .sc-ico .ic{width:36px;height:36px}
.rrow b{font:21px var(--f-d);font-weight:400;display:block}
.rrow small{color:var(--ink-3);font-size:13px}
.rrow .btn{flex:none;min-height:46px;padding:0 16px;font-size:14px}

.scene.flat{background:none;color:inherit}
.scene.flat::before{display:none}

/* parent call */
.call{position:absolute;inset:0;z-index:4;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 18px;text-align:center;color:#FFFFFF;background:color-mix(in oklab,var(--k-deep) 94%,#000 6%);animation:callIn .35s ease both}
.call-bell{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:ring 1.6s ease-in-out infinite}
.call-bell .ic{width:62px;height:62px;color:#FFFFFF;--ic-tint:rgba(255,255,255,.35)}
.call-t{font:clamp(28px,3vw,38px)/1.15 var(--f-d);text-wrap:balance}
.call-s{font-size:15px;opacity:.9}
.call-ok{position:relative;overflow:hidden;margin-top:6px;min-height:62px;width:min(100%,280px);border-radius:20px;background:#FFFFFF;color:#1A2134;font:21px var(--f-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.call-ok::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--k)}
.call-ok.holding::after{width:100%;transition:width 1.2s linear}
.call-no{min-height:46px;padding:0 18px;border-radius:14px;color:#FFFFFF;font-weight:600;font-size:15px;background:rgba(255,255,255,.14)}
.call-hint{font-size:12px;opacity:.75}
@keyframes callIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(9deg)}40%{transform:rotate(-6deg)}50%{transform:rotate(3deg)}}

/* calendar */
.board-h .tbtn{height:46px}
.cal-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:20px 6px}
.cal-top h1{font:30px var(--f-d);flex:1;min-width:120px}
.cal-top .back{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav b{font:24px var(--f-d);font-weight:400;min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums}
.mnav .ib{background:var(--surface);box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start;padding-block:12px 48px}
.cal-side{display:flex;flex-direction:column;gap:20px;min-width:0}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk span{text-align:center;font:600 13px var(--f-b);color:var(--ink-3);padding:2px 0}
.wk span:first-child{color:var(--danger)}.wk span:last-child{color:var(--accent)}
.cd{min-height:92px;border-radius:16px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid transparent;min-width:0;background:color-mix(in oklab,var(--k,var(--surface-2)) var(--p,0%),var(--surface-2))}
.cd.blank{background:transparent}
.cd-n{font:600 13px var(--f-b);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.sun .cd-n{color:var(--danger)}.cd.sat .cd-n{color:var(--accent)}
.cd.today{border-color:var(--accent)}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.fut{opacity:.4;cursor:default}
.cd-k{display:flex;flex-direction:column;gap:2px;min-width:0}
.cd-dot{display:flex;align-items:center;gap:5px;font:15px/1.15 var(--f-d);font-variant-numeric:tabular-nums}
.cd-dot i{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.cd-big{display:flex;align-items:center;gap:4px;font:21px/1 var(--f-d);margin-top:auto;font-variant-numeric:tabular-nums}
.cd-first{margin-top:auto;display:flex;gap:2px}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--k-soft)}
.ms b{font:21px var(--f-d);font-weight:400;display:block}
.ms small{color:var(--ink-2);font-size:13px}
.ms .big{display:flex;align-items:center;gap:6px;font:30px/1 var(--f-d);font-variant-numeric:tabular-nums}
.dt{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(var(--n),minmax(0,1fr));gap:6px;align-items:stretch}
.dt-h{display:flex;flex-direction:column;align-items:center;gap:3px;font:15px/1.1 var(--f-d)}
.dt-r{display:flex;align-items:center;gap:8px;font:17px/1.15 var(--f-d);min-width:0}
.dt-r .sc-ico{width:38px;height:38px;border-radius:12px;flex:none}
.dt-r .sc-ico .ic{width:28px;height:28px}
.dt-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:14px;background:var(--surface-2);padding:4px}
.dt-sum{font:20px var(--f-d);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:13px}
@media (max-width:900px){.cal-grid{grid-template-columns:1fr}}
@media (max-width:560px){.cd{min-height:66px;padding:4px;border-radius:12px}.cd-dot{font-size:12px;gap:3px}.cd-dot i{width:7px;height:7px}.cd-big{font-size:15px}.cd-big .st{width:12px;height:12px}.days,.wk{gap:4px}.mnav b{font-size:20px;min-width:6.4em}}

.scene[data-rid="todo"]{--a:var(--sc-t-a);--b:var(--sc-t-b);--sink:var(--ink);--sc-ic:var(--todo-ink);--sc-tint:var(--todo-tint)}
.scene[data-rid="msg"]{--a:var(--sc-g-a);--b:var(--sc-g-b);--sink:var(--ink);--sc-ic:var(--bub-ink);--sc-tint:var(--bub-tint)}
.scene[data-rid="todo"]::before,.scene[data-rid="msg"]::before{background:radial-gradient(280px 280px at 96% -6%,var(--glow),transparent 70%)}
.ava .hair{fill:var(--hair);stroke:none}
.ava .g{fill:#C9C2BA;stroke:none}
.pava{position:relative;display:inline-flex;flex:none}
.pbadge{position:absolute;right:-4%;bottom:-4%;width:40%;height:40%;border-radius:50%;background:#FFFFFF;color:#8A6E5C;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.pbadge svg{width:72%;height:72%;fill:currentColor}
.pbadge.tree{color:#2F8A55}
.pick-row.people{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.pick-row.people .pk{font-size:18px;padding:12px 4px 10px}

/* family home */
.fam-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-block:30px 6px}
.fam-name{font:clamp(44px,5.6vw,64px)/1.02 var(--f-d);margin-top:6px}
.fam-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-block:24px 18px}
.fcard{border-radius:40px;padding:32px;min-height:380px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease}
.fcard:active{transform:scale(.98)}
.fcard .sc-ico{width:112px;height:112px;border-radius:34px}
.fcard .sc-ico .ic{width:78px;height:78px}
.fc-title{font:clamp(38px,4.2vw,52px)/1.05 var(--f-d);margin-top:6px}
.fc-sub{font-size:17px;opacity:.8;margin-top:-4px}
.fc-foot{margin-top:auto;display:flex;gap:16px 20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.fc-kids{display:flex;gap:16px;flex-wrap:wrap}
.fk{display:flex;flex-direction:column;align-items:center;gap:4px;font:16px/1.1 var(--f-d)}
.fk small{display:inline-flex;gap:3px;align-items:center;font:600 13px var(--f-b);font-variant-numeric:tabular-nums}
.fc-note{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--bubble);color:var(--ink);font-weight:600;font-size:14px}
.fc-note .sync-dot{width:9px;height:9px}
.fc-note[data-st="on"] .sync-dot{background:var(--ok)}
.duo{display:flex}
.duo .ava+.ava{margin-left:-12px}
.duo .ava{box-shadow:0 0 0 3px var(--surface)}
.home-top .ht-l{display:flex;gap:16px;align-items:flex-start}
.home-top .back,.ed-top .back,.cal-top .back{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}

/* message */
.msg-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.6fr);gap:18px;padding-block:18px 160px;align-items:start}
.msg-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.msg-grid.p1{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.msg-grid.p2{grid-template-columns:minmax(0,1fr);max-width:1120px}
.step.who-sum{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px}
.who-sum .pv-faces .ava+.ava,.who-sum .pv-faces .pava+.pava{margin-left:-12px}
.who-sum .ws-txt{flex:1;min-width:180px;font:24px/1.25 var(--f-d)}
.who-sum .tbtn{box-shadow:none;background:var(--surface-2);height:56px}
.pager{display:inline-flex;gap:6px;align-items:center;flex:none}
.pager i{width:10px;height:10px;border-radius:5px;background:color-mix(in oklab,var(--ink) 22%,transparent);transition:width .25s,background .25s}
.pager i.on{width:28px;background:var(--bub-ink)}
.sendbtn .ui.after{order:2}
.step{background:var(--surface);border-radius:30px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;border:3px solid transparent;transition:border-color .2s}
.step.need{border-color:var(--bub-ink);animation:need .45s ease 3}
.step h2{display:flex;align-items:center;gap:10px;font:24px/1.1 var(--f-d);font-weight:400}
.step h2 .num{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:19px var(--f-d);color:var(--ink-2);flex:none}
.step.ok h2 .num{background:var(--ok);color:#FFFFFF}
.step h2 .num .ui{width:20px;height:20px;stroke-width:3}
.pick-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:24px;background:var(--surface-2);border:3px solid transparent;font:21px/1.1 var(--f-d);transition:transform .12s ease,background .2s,border-color .2s;min-width:0}
.pk:active,.ph:active{transform:scale(.95)}
.pk[aria-pressed="true"]{background:var(--k-soft);border-color:var(--k-line)}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--k-deep);color:#FFFFFF;display:grid;place-items:center;transform:scale(0);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
[aria-pressed="true"]>.tick{transform:scale(1)}
.tick .ui{width:18px;height:18px;stroke-width:3.2}
.recbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px;border-radius:24px;background:var(--surface-2)}
.recbtn{position:relative;width:96px;height:96px;border-radius:50%;background:var(--bub-ink);color:var(--on-bub);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px color-mix(in oklab,var(--bub-ink) 35%,transparent)}
.recbtn .ui{width:42px;height:42px}
.recbtn::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid color-mix(in oklab,var(--danger) 45%,transparent);transform:scale(calc(1 + var(--lv,0) * .0045));opacity:0;transition:transform .08s linear}
.recbtn.on{background:var(--danger)}
.recbtn.on::before{opacity:1}
.recbtn:disabled{opacity:.4;box-shadow:none}
.rec-txt{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}
.rec-txt b{font:24px/1.15 var(--f-d);font-weight:400}
.rec-txt small{color:var(--ink-2);font-size:14px}
.rec-time{font:34px/1 var(--f-d);font-variant-numeric:tabular-nums;color:var(--danger)}
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.vchip{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--surface);font:21px var(--f-d);font-variant-numeric:tabular-nums}
.vchip .ib{background:var(--bub-ink);color:var(--on-bub);border-radius:50%;width:52px;height:52px}
.vchip .ib .ui{width:26px;height:26px}
.wave{display:inline-flex;gap:3px;align-items:center;height:30px}
.wave i{width:4px;border-radius:2px;background:var(--bub-ink);opacity:.75}
.voice .tbtn{height:52px;box-shadow:none}
.trans{flex-basis:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:15px;padding:4px 4px 0}
.trans q{font:20px/1.3 var(--f-d);color:var(--ink);quotes:"“" "”"}
.trans q.off{text-decoration:line-through;color:var(--ink-3)}
.trans .ib{width:36px;height:36px;border-radius:12px}
.phr{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:124px;padding:14px 8px 12px;border-radius:24px;background:var(--surface-2);border:3px solid transparent;font:19px/1.15 var(--f-d);text-align:center;transition:transform .12s ease,background .2s,border-color .2s;min-width:0;overflow-wrap:anywhere}
.ph .ic{width:56px;height:56px;color:var(--k-deep);--ic-tint:var(--k-tint)}
.ph{background:var(--k-soft)}
.ph[aria-pressed="true"]{background:var(--surface);border-color:var(--k-line);box-shadow:0 4px 14px color-mix(in oklab,var(--k) 30%,transparent)}
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in oklab,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.preview{flex:1;min-width:0;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.pv-faces{display:flex;align-items:center}
.pv-faces .ava+.ava{margin-left:-10px}
.pv-faces .ava{box-shadow:0 0 0 2px var(--surface)}
.pv-empty{width:40px;height:40px;border-radius:50%;border:2.5px dashed var(--line);display:inline-block}
.pv-arrow{color:var(--ink-3)}
.pv-items{display:flex;gap:4px;flex-wrap:wrap}
.pv-ph{width:40px;height:40px;border-radius:12px;background:var(--k-soft,color-mix(in oklab,var(--bub-ink) 12%,var(--surface)));display:grid;place-items:center;color:var(--k-deep,var(--bub-ink));--ic-tint:var(--k-tint,var(--bub-tint))}
.pv-ph .ic{width:30px;height:30px}
.pv-ph .ui{width:22px;height:22px}
.pv-text{flex-basis:100%;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sendbtn{min-height:76px;padding:0 32px;border-radius:26px;background:var(--bub-ink);color:var(--on-bub);font:28px var(--f-d);display:inline-flex;align-items:center;gap:12px;flex:none;box-shadow:0 8px 20px color-mix(in oklab,var(--bub-ink) 35%,transparent);transition:transform .12s,background .2s}
.sendbtn:active{transform:scale(.96)}
.sendbtn[aria-disabled="true"]{background:var(--line);color:var(--ink-3);box-shadow:none}
.sendbtn .ui{width:32px;height:32px}
.sent{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:color-mix(in oklab,var(--bub-ink) 94%,#000 6%);color:var(--on-bub);animation:callIn .3s ease both}
.sent-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.plane{width:150px;height:150px;animation:fly 1.1s cubic-bezier(.3,.1,.3,1) both}
.sent-t{font:60px/1 var(--f-d)}

:root{--sc-f-a:#FFE9C7;--sc-f-b:#FFF6BF;--food-ink:#E07A1F;--food-tint:#FFD28A;
  --rainbow:conic-gradient(from var(--rba),#FF6B6B,#FFB84D,#FFE45E,#6BD98B,#5EC8FF,#9B7BFF,#FF6BD5,#FF6B6B)}
@property --rba{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rbSpin{to{--rba:360deg}}
.scene[data-rid="food"]{--a:var(--sc-f-a);--b:var(--sc-f-b);--sink:var(--ink);--sc-ic:var(--food-ink);--sc-tint:var(--food-tint)}

.fico{--fz:44px;width:var(--fz);height:var(--fz);flex:none;display:grid;place-items:center;border-radius:30%;background:color-mix(in oklab,var(--ft) 55%,#fff);color:var(--fc);--ic-tint:var(--ft)}

/* 무지개 테두리: 전부 먹은 음식 · 핑크: 적당히 · 회색: 1번 */
.rb{position:relative;isolation:isolate;background:transparent !important;--rb-fill:var(--surface)}
.rb::before,.rb::after{content:'';position:absolute;inset:-4px;border-radius:inherit;pointer-events:none;animation:rbSpin 2.6s linear infinite}
.rb::before{z-index:-1;border:4px solid transparent;background:linear-gradient(var(--rb-fill),var(--rb-fill)) padding-box,var(--rainbow) border-box}
.rb::after{z-index:-2;background:var(--rainbow);filter:blur(10px);opacity:.6}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:600;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1120px) and (min-width:760px){
  .lanes{--ico:52px;--fs:21px;--chk:34px;--th:74px;--gap:8px;gap:12px}
  .lane{padding:12px;border-radius:26px}
  .lane-head .ava{--s:52px !important}
  .lane-name{font-size:25px}
  .task{gap:10px;padding:8px 10px 8px 8px;border-radius:20px}
  .reward{font-size:16px}
}
@media (max-width:900px){ .cards{grid-template-columns:1fr} .rcard{min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:20px;align-items:center}
  .rcard .sc-ico{grid-row:span 3} .rc-kids{grid-column:1 / -1;margin-top:8px} .kgrid{grid-template-columns:1fr} }
@media (max-width:860px){ .ed-grid{grid-template-columns:1fr} }
@media (max-width:759px){ .lanes{grid-template-columns:1fr} .podium{width:100%;justify-content:center} }
@media (max-width:560px){ .board-row{grid-template-columns:1fr} .rcard{padding:20px;border-radius:28px} .rcard .sc-ico{width:68px;height:68px;border-radius:22px} .rcard .sc-ico .ic{width:48px;height:48px}
  .srow{grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px} .now{top:14px;right:14px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important} .task.next{animation:none} }

  }else if(adult){
    S.sync=u; save(); toast('연결했어요');
  }else{
    // 이 기기(아이들 태블릿)에 기록이 더 많아요: 저장된 별·기록과 합쳐서 올려요
    if(hasRemote){
      for(const k in (remote.bank||{})) S.bank[k]=Math.max(S.bank[k]||0,Number(remote.bank[k])||0);
      const L=remote.log||{}; for(const d in L) for(const r in (L[d]||{})) for(const k in (L[d][r]||{})){ S.log[d]=S.log[d]||{}; S.log[d][r]=S.log[d][r]||{}; if(!S.log[d][r][k]) S.log[d][r][k]=L[d][r][k]; }
      if(remote.replies) S.replies={...remote.replies,...(S.replies||{})};
      normalize(S);
    }
    try{ const r=await fetch(u+'/app.json',{method:'PATCH',body:JSON.stringify({kids:S.kids,routines:S.routines,log:S.log,bank:S.bank,msg:S.msg})}); if(!r.ok) throw 0; }

    S.sync=u; save(); toast('연결했어요. 이 기기의 별과 기록을 올렸어요');
  }
  setSt('on'); connectStream(); applyRole(); roomPrune(); return '';
}

function prune(){
  const t=todayKey(); let changed=false;
  for(const r of RIDS) for(const k in S.routines[r]){ const a=S.routines[r][k], b=a.filter(x=>!x.once||x.once===t); if(b.length!==a.length){ S.routines[r][k]=b; changed=true; } }
  const keys=Object.keys(S.log).sort(); while(keys.length>800) delete S.log[keys.shift()];
  if(changed) pushConfig();
  const old=Date.now()-30*864e5;
  for(const m in (S.sent||{})){ const at=Number(String(m).slice(1,14)); if(at&&at<old) delete S.sent[m]; }
  for(const m in S.replies){ const at=Number(String(m).slice(1,14)); if(at&&at<old){ delete S.replies[m]; if(S.role==='kids') rset(`replies/${m}`,null); } }
}

function entry(rid,kid){const d=S.log[todayKey()]||(S.log[todayKey()]={});const r=d[rid]||(d[rid]={});return r[kid]||(r[kid]={done:[],rank:null,stars:0});}
const tasksOf=(rid,kid)=>{const t=todayKey();return (S.routines[rid][kid]||[]).filter(x=>!x.once||x.once===t)};
/* 병원 약: 하루 세 번(아침·점심·저녁) 기준으로 며칠치를 세고, 아침·저녁 할 일에 '약 먹기'를 넣어요 */
const SLOTS=['m','l','e'], SLOT_NAME={m:'아침',l:'점심',e:'저녁'};
const dayNum=dk=>{const [y,m,d]=dk.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const keyOfDay=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const medRange=m=>{ const a=dayNum(m.start)*3+SLOTS.indexOf(m.slot); return [a,a+Number(m.days)*3-1]; };
const medOn=(m,dk,slot)=>{ const i=dayNum(dk)*3+SLOTS.indexOf(slot), [a,b]=medRange(m); return i>=a&&i<=b; };
const slotLabel=i=>{ const dk=keyOfDay(Math.floor(i/3)), [,mo,da]=dk.split('-').map(Number); const t=dayNum(todayKey()), n=Math.floor(i/3);
  return `${n===t?'오늘':n===t+1?'내일':`${mo}월 ${da}일`} ${SLOT_NAME[SLOTS[i%3]]}`; };
const medEndDay=m=>Math.floor(medRange(m)[1]/3);
const medActive=m=>medEndDay(m)>=dayNum(todayKey());
function medTasks(rid,kid){
  if(rid!=='morning'&&rid!=='evening') return [];
  const slot=rid==='morning'?'m':'e', t=todayKey();
  return toArr(S.meds).filter(m=>toArr(m.kids).includes(kid)&&medOn(m,t,slot)).map(m=>({id:'med-'+m.id,icon:'medicine',label:'약 먹기',med:true}));
}

function pruneMeds(){ const before=S.meds.length; S.meds=S.meds.filter(m=>medEndDay(m)>=dayNum(todayKey())-1); if(S.meds.length!==before){ save(); pushMeds(); } }
function status(rid,kid){const ts=dayTasks(rid,kid),e=peek(rid,kid);const done=ts.filter(t=>e.done.includes(t.id)).length;return {ts,e,done,total:ts.length,finished:!!e.rank}}
function maxRank(rid){const d=S.log[todayKey()]?.[rid]||{};return Math.max(0,...Object.values(d).map(e=>e.rank||0))}

let actx;
function tone(freqs,dur=.14,type='triangle',gap=.09){
  if(!S.sound) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=t0+i*gap;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.03)});}catch(e){}
}

async function welcomeConnect(){
  W.err='';
  if(W.mode==='url'){
    const raw=($('#welUrl')?.value||W.url||'').trim(); W.url=raw;
    if(!raw){ W.err='연결 주소를 넣어 주세요.'; renderWelcome(); return; }
    W.busy=true; renderWelcome();
    const msg=await syncConnect(raw,W.role); W.busy=false;
    if(msg){ W.err=msg; renderWelcome(); return; }
    finishWelcome(); return;
  }
  const pw=W.confirm?W.pw:($('#welPw')?.value||'').trim(), pw2=W.confirm?($('#welPw2')?.value||''):undefined;
  W.pw=pw;
  if(!pw){ W.err='암호를 입력해 주세요.'; renderWelcome(); return; }
  W.busy=true; renderWelcome();
  const r=await connectWithPassword(pw,W.role,pw2); W.busy=false;
  if(r.confirm){ W.confirm=true; renderWelcome(); setTimeout(()=>$('#welPw2')?.focus(),50); return; }
  if(r.msg){ W.err=r.msg; renderWelcome(); return; }
  W.pw=''; W.confirm=false; finishWelcome();
}
function finishWelcome(){
  S.role=W.role; S.onboard=false; save(); applyRole(); syncAlarms();
  view.screen='family'; show();

}

/* ===== 새 음식 도전 (편식 고치기) =====

   메뉴를 눌러 안 먹었어 / 1번 / 적당히 / 전부를 골라요. 1번은 회색, 적당히는 핑크, 전부는 무지개 테두리. 먹어 본 음식은 '먹을 수 있어요!'에 모여요 */
const FOOD_ICONS={rice:{n:'밥',c:'#9A7B4F',t:'#FFF8E6'},soup:{n:'국',c:'#D0663A',t:'#FFD2B8'},noodle:{n:'면',c:'#C98A2E',t:'#FFE7A8'},meat:{n:'고기',c:'#B4483E',t:'#FFC2B8'},
  fish:{n:'생선',c:'#3F86C6',t:'#CFE6FA'},egg:{n:'계란',c:'#D69A1A',t:'#FFD54F'},veg:{n:'채소',c:'#3C9A52',t:'#BDE8B0'},carrot:{n:'뿌리채소',c:'#E0731F',t:'#FFC08A'},
  fruit:{n:'과일',c:'#D9443F',t:'#FFB8B0'},bread:{n:'빵',c:'#B27A35',t:'#F8D9A8'},tofu:{n:'두부·치즈',c:'#9A8F7A',t:'#FFFBEF'},mushroom:{n:'버섯',c:'#9A6A4B',t:'#E9CBB5'},
  kimbap:{n:'김밥',c:'#2F5E3D',t:'#E7F5DB'},dumpling:{n:'만두',c:'#B58A4E',t:'#FFF1D6'},chili:{n:'김치·매운',c:'#D23B3B',t:'#FFB0A8'},dish:{n:'그 밖에',c:'#7A6FD0',t:'#E3DEFF'}};
const FOOD_GUESS=[[/김밥|초밥|주먹밥|유부|^김$|김구이/,'kimbap'],[/만두/,'dumpling'],[/국수|면$|라면|우동|스파게티|파스타|짜장|짬뽕|냉면|쌀국수/,'noodle'],
  [/밥|죽$|리조또/,'rice'],[/국$|탕$|찌개|스프|수프|전골/,'soup'],[/김치|깍두기|고추|떡볶이|매운/,'chili'],[/버섯/,'mushroom'],[/두부|치즈|묵$|요거트|요구르트/,'tofu'],
  [/빵|토스트|샌드위치|케이크|와플|팬케이크|피자|베이글|머핀|쿠키/,'bread'],[/계란|달걀|메추리알|오믈렛|에그/,'egg'],
  [/생선|고등어|갈치|연어|참치|새우|오징어|조개|굴$|굴무침|멸치|꽁치|삼치|동태|명태|대구|가자미|조기|낙지|문어|게살|전복|홍합|어묵/,'fish'],
  [/고기|소고기|돼지|닭|불고기|갈비|스테이크|돈까스|돈가스|햄|소시지|치킨|너겟|미트볼|떡갈비|제육|오리|베이컨/,'meat'],
  [/당근|^무$|무생채|무나물|고구마|감자|연근|우엉|비트|도라지/,'carrot'],
  [/브로콜리|시금치|나물|상추|배추|양배추|오이|호박|콩나물|숙주|샐러드|채소|야채|가지|파프리카|피망|양파|아스파라거스|케일|깻잎|부추|미역|콩/,'veg'],
  [/사과|^배$|딸기|포도|귤|오렌지|바나나|키위|수박|참외|복숭아|^감$|블루베리|망고|토마토|과일|자두|체리|파인애플|멜론|석류|레몬/,'fruit']];
function guessFood(name){ const n=String(name||'').replace(/\s+/g,''); for(const [re,ic] of FOOD_GUESS) if(re.test(n)) return ic; return 'dish'; }
const foodKey=name=>{ const n=String(name).normalize('NFC').replace(/\s+/g,'').toLowerCase(); let h=7; for(const ch of n) h=(Math.imul(h,31)+ch.codePointAt(0))>>>0; return 'f'+h.toString(36); };
const fIco=(icon,s)=>{ const f=FOOD_ICONS[icon]||FOOD_ICONS.dish; return `<span class="fico" style="--fc:${f.c};--ft:${f.t}${s?`;--fz:${s}px`:''}">${ico('fd_'+(FOOD_ICONS[icon]?icon:'dish'))}</span>`; };
// 식판: 위에 반찬 3칸, 아래에 밥 · 국
const TRAY=[{k:'s1',n:'반찬'},{k:'s2',n:'반찬'},{k:'s3',n:'반찬'},{k:'rice',n:'밥',def:'rice'},{k:'soup',n:'국',def:'soup'}];
const TRAY_NAME={s1:'반찬 1',s2:'반찬 2',s3:'반찬 3',rice:'밥',soup:'국'};
const FD=()=>{ if(!S.foods||typeof S.foods!=='object') S.foods={}; const f=S.foods; f.items||(f.items={}); f.ate||(f.ate={}); f.trays||(f.trays={}); f.days||(f.days={}); return f; };
// 날마다 기록 (식판 날짜 → 아이 → 음식 → 단계). 별은 날마다 받아요: 1번 ★1 · 적당히 ★2 · 전부 ★3
const LV_STAR={1:1,2:2,3:3};
const dayT=d=>{ const [y,m,dd]=String(d).split('-').map(Number); return new Date(y,(m||1)-1,dd||1).getTime(); };
// 지금까지 먹어 본 기록 = 날마다 기록 중 가장 잘 먹은 단계 (t = 처음 먹어 본 날)
function ateOf(kid){
  const out={}, days=FD().days;
  for(const d of Object.keys(days).sort()){ const m=days[d]?.[kid]; if(!m) continue;
    for(const [fid,lv] of Object.entries(m)){ const o=out[fid];
      if(!o) out[fid]={t:dayT(d),lv,last:dayT(d)};
      else { if(lv>0&&(o.lv<=0)) o.t=dayT(d); if(lv>o.lv||(o.lv<0&&lv>0)) o.lv=lv; o.last=dayT(d); } } }
  return out;
}
const dayLv=(day,kid,fid)=>FD().days[day]?.[kid]?.[fid]||0;
const trayDay=()=>curTray()?.day||todayKey();
// 식판에서 보이는 단계 = 그 식판 날의 기록
const lvOf=(kid,fid)=>dayLv(trayDay(),kid,fid);
const foodCount=kid=>{ const it=FD().items, a=ateOf(kid); return Object.keys(a).filter(id=>it[id]&&a[id].lv>0).length; };
const lvCount=(kid,lv)=>{ const it=FD().items, a=ateOf(kid); return Object.keys(a).filter(id=>it[id]&&a[id].lv===lv).length; };
// 분류: 1번(회색) · 적당히(핑크) · 전부(무지개)
const LVS=[{lv:1,n:'1번',cls:'lv1'},{lv:2,n:'적당히',cls:'lv2'},{lv:3,n:'전부',cls:'lv3 rb'}];
const dayKeyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const yesterdayKey=()=>{ const d=new Date(); d.setDate(d.getDate()-1); return dayKeyOf(d); };
function trayFor(day){ const t=FD().trays[day]; if(!t) return null; const it=FD().items, slots={}; let n=0; for(const sl of TRAY){ const f=t[sl.k]&&it[t[sl.k]]; if(f){ slots[sl.k]=f; n++; } } return n?{day,slots}:null; }
// 오늘 식판이 없으면 어제 식판을 보여 줘요 (밤에 적고 다음 날 아침에 먹어도 되게)
const curTray=()=>trayFor(todayKey())||trayFor(yesterdayKey());
const trayFoods=()=>{ const c=curTray(); return c?TRAY.map(sl=>c.slots[sl.k]).filter(Boolean):[]; };
const pendingFoods=kid=>trayFoods().filter(f=>!lvOf(kid,f.id));
const bestLv=(kid,fid)=>ateOf(kid)[fid]?.lv||0;
const eatenFoods=kid=>{ const a=ateOf(kid), it=FD().items; return Object.keys(a).filter(id=>it[id]&&a[id].lv>0).sort((x,y)=>(a[y].t||0)-(a[x].t||0)).map(id=>it[id]); };
// 안 먹었어 → '다음에 도전!' 칸
const noFoods=kid=>{ const a=ateOf(kid), it=FD().items; return Object.keys(a).filter(id=>it[id]&&a[id].lv<0).sort((x,y)=>(a[y].t||0)-(a[x].t||0)).map(id=>it[id]); };
const lvCls=lv=>lv>=3?' lv3 rb':lv===2?' lv2':lv===1?' lv1':lv<0?' lvno':'';
const LV_SAY={'-1':'안 먹었어요','1':'1번 먹었어요','2':'적당히 먹었어요','3':'전부 먹었어요','0':'아직 안 골랐어요'};
const LV_BADGE={'-1':'안 먹음','1':'1번','2':'적당히','3':'전부'};
const F={open:false,slot:'s1',draft:{},pick:null,pop:null};
function addFood(name,icon){
  name=String(name||'').trim().replace(/\s+/g,' ').slice(0,20); if(!name) return null;
  const fd=FD(), id=foodKey(name), old=fd.items[id];
  const it={id,name,icon:icon||old?.icon||guessFood(name),day:todayKey(),ts:old?.ts||Date.now(),by:S.role};
  fd.items[id]=it; rset('foods/items/'+id,it); return it;
}
function setLv(kid,fid,lv,day){
  day=day||trayDay(); const fd=FD(); fd.days[day]||(fd.days[day]={}); fd.days[day][kid]||(fd.days[day][kid]={});
  if(lv) fd.days[day][kid][fid]=lv; else delete fd.days[day][kid][fid];
  rset(`foods/days/${day}/${kid}/${fid}`,lv||null); save();
}
/* --- 아이들 태블릿 --- */
function trayHtml(k,ct,mode){
  const cell=sl=>{ const f=ct&&ct.slots[sl.k]; if(!f) return `<div class="tc ${sl.k} empty"><span class="tc-tag">${sl.n}</span></div>`;
    const lv=lvOf(k.id,f.id);
    return `<button class="tc ${sl.k}${lvCls(lv)}${F.pop&&F.pop.kid===k.id&&F.pop.fid===f.id?' pop':''}" data-act="fdpick" data-kid="${k.id}" data-fid="${f.id}" aria-label="${esc(f.name)} ${lv?LV_SAY[lv]:''}">
      ${fIco(f.icon)}<span class="tc-name">${esc(f.name)}</span>${lv?`<span class="tc-badge">${LV_BADGE[lv]}</span>`:''}</button>`; };
  return `<div class="tray">${TRAY.map(cell).join('')}</div>`;
}
function foodLane(k){
  const eaten=eatenFoods(k.id), n=eaten.length, ct=curTray(), nos=noFoods(k.id);
  const chips=eaten.map(f=>{ const lv=bestLv(k.id,f.id); return `<button class="fd-chip${lvCls(lv)}${F.pop&&F.pop.kid===k.id&&F.pop.fid===f.id&&F.pop.first?' pop':''}" data-act="fdsay" data-fid="${f.id}">${fIco(f.icon)}<span>${esc(f.name)}</span></button>`; }).join('');
  return `<section class="lane kid fd-lane" data-kid="${k.id}" style="--k:${k.color}" aria-label="${esc(k.name)}">
    <div class="fd-head">${avatar(k,76)}<div class="fd-who"><div class="lane-name">${esc(k.name)}</div><small>먹어 본 음식</small></div><div class="fd-num" aria-label="먹어 본 음식 ${n}가지">${n}<small>가지</small></div></div>
    <div class="fd-cats">${LVS.map(c=>`<span class="fdc ${c.cls}"><small>${c.n}</small><b>${lvCount(k.id,c.lv)}</b></span>`).join('')}</div>
    <div class="fd-can"><h3>${ui('check')}먹을 수 있어요!</h3>
      <div class="fd-chips">${chips||'<p class="fd-empty">식판에서 먹어 본 음식을 누르면 여기로 모여요</p>'}</div></div>
    <div class="fd-no${nos.length?'':' none'}"><h3>${ico('nope')}다음에 도전! <small>${nos.length?'안 먹었어요':'안 먹은 음식이 없어요'}</small></h3>
      ${nos.length?`<div class="fd-chips no">${nos.map(f=>`<button class="fd-chip lvno" data-act="fdsay" data-fid="${f.id}">${fIco(f.icon)}<span>${esc(f.name)}</span></button>`).join('')}</div>`:''}</div>
    <div class="fd-try"><h3>${ct&&ct.day!==todayKey()?'어제 식판':'오늘의 식판'} <small>${ct?'먹어 본 음식을 눌러요':''}</small></h3>
      ${ct?trayHtml(k,ct):`<div class="tray dim">${TRAY.map(sl=>`<div class="tc ${sl.k} empty"><span class="tc-tag">${sl.n}</span></div>`).join('')}</div><p class="fd-empty">엄마·아빠가 식판을 채우면 여기 나와요</p>`}</div>
  </section>`;
}
function swapFoodLane(kid){ const el=document.querySelector(`.fd-lane[data-kid="${kid}"]`), k=kidById(kid); if(!el||!k) return; const sc=el.querySelector('.fd-chips')?.scrollTop||0; el.outerHTML=foodLane(k); const n=document.querySelector(`.fd-lane[data-kid="${kid}"] .fd-chips`); if(n) n.scrollTop=sc; }
function renderFood(keep){
  if(keep&&$('#food .lanes')){ for(const k of S.kids) swapFoodLane(k.id); return; }
  const ct=curTray();
  $('#food').innerHTML=`
  <header class="band scene" data-rid="food"><div class="wrap band-in">
    <button class="back bubble" data-act="family" aria-label="처음 화면으로">${ui('back')}</button>
    <div class="band-title"><span class="sc-ico">${ico('yum')}</span><div><h1>새 음식 도전</h1><p class="band-date">${ct?`${ct.day===todayKey()?'오늘':'어제'}의 식판 · ${TRAY.map(sl=>ct.slots[sl.k]).filter(Boolean).map(f=>esc(f.name)).join(' · ')}`:dateLabel()}</p></div></div>
    <div class="fd-legend"><span class="lg lvno">안 먹음</span><span class="lg lv1">1번</span><span class="lg lv2">적당히</span><span class="lg lv3 rb">전부</span></div>
  </div></header>
  <div class="wrap"><div class="lanes fd-lanes">${S.kids.map(foodLane).join('')}</div></div>`;
}
function renderPick(){
  let el=document.getElementById('fdpick');
  if(!F.pick){ if(el) el.remove(); return; }
  const k=kidById(F.pick.kid), f=FD().items[F.pick.fid]; if(!k||!f){ F.pick=null; return renderPick(); }
  if(!el){ el=document.createElement('div'); el.id='fdpick'; el.className='sheet'; document.body.appendChild(el); }
  const lv=lvOf(k.id,f.id);
  el.innerHTML=`<div class="sheet-in fd-pick kid" style="--k:${k.color}" role="dialog" aria-label="${esc(f.name)}">
    <button class="ib fp-x" data-act="fdpclose" aria-label="닫기">${ui('x')}</button>
    <div class="fp-top">${avatar(k,64)}<div class="fp-food${lvCls(lv)}">${fIco(f.icon,104)}</div><b>${esc(f.name)}</b></div>
    <div class="fp-btns">
      <button class="fp no" data-act="fdlv" data-lv="-1" aria-pressed="${lv===-1}">${ico('nope')}<span>안 먹었어</span></button>
      <button class="fp once" data-act="fdlv" data-lv="1" aria-pressed="${lv===1}">${ico('bite')}<span>1번 먹었어</span><em class="fp-st">${star(18)}1</em></button>
      <button class="fp some" data-act="fdlv" data-lv="2" aria-pressed="${lv===2}">${ico('half')}<span>적당히 먹었어</span><em class="fp-st">${star(18)}2</em></button>
      <button class="fp all rb" data-act="fdlv" data-lv="3" aria-pressed="${lv===3}">${ico('clean')}<span>전부 먹었어</span><em class="fp-st">${star(18)}${star(18)}3</em></button>
    </div>
  </div>`;
  sayText(f.name);
}
function chooseLv(lv){
  const p=F.pick; if(!p) return; const k=kidById(p.kid), f=FD().items[p.fid]; const prev=lvOf(p.kid,p.fid);
  F.pick=null; renderPick(); if(!k||!f||lv===prev) return;
  setLv(p.kid,p.fid,lv);
  const up=lv>0&&lv>Math.max(prev,0), firstEver=up&&eatenFoods(p.kid).filter(x=>x.id===p.fid).length===1&&bestLv(p.kid,p.fid)===lv&&prev<=0;
  F.pop=up?{kid:p.kid,fid:p.fid,first:firstEver}:null; swapFoodLane(p.kid); F.pop=null;
  const gain=(LV_STAR[lv]||0)-(LV_STAR[prev]||0);
  if(gain){ const cellEl=document.querySelector(`.fd-lane[data-kid="${p.kid}"] .tc[data-fid="${p.fid}"]`); if(cellEl){ const g=document.createElement('span'); g.className='fd-gain'+(gain<0?' minus':''); g.innerHTML=`${gain>0?'+':''}${gain}${star(22)}`; cellEl.appendChild(g); setTimeout(()=>g.remove(),1400); } }
  if(lv<0){ tone([440,392],.14,'sine',.07); sayText(`괜찮아요. ${f.name}, 다음에 도전해요!`); }
  if(up){
    const lane=document.querySelector(`.fd-lane[data-kid="${p.kid}"]`), cellEl=lane?.querySelector(`.tc[data-fid="${p.fid}"]`);
    burstAt(lane,cellEl,prev<=0);
    tone(lv>=3?[523,659,784,1047,1319]:lv===2?[523,659,784,1047]:[523,659,784],.28,'triangle',.1); buzz();
    sayText(lv>=3?`${withI(k.name)} ${f.name} 전부 먹었어요! 별 세 개! 최고!`:lv===2?`${withI(k.name)} ${f.name} 적당히 먹었어요! 별 두 개! 멋져요!`:`${withI(k.name)} ${f.name} 1번 먹어 봤어요! 별 한 개! 잘했어요!`);
  }
}
function burstAt(lane,el,bump){
  if(!lane||!el) return; const lr=lane.getBoundingClientRect(), r=el.getBoundingClientRect(), c=document.createElement('div'); c.className='fd-burst';
  c.style.left=(r.left-lr.left+r.width/2)+'px'; c.style.top=(r.top-lr.top+r.height/2)+'px';
  const cols=['#FF6B6B','#FFB84D','#FFE45E','#6BD98B','#5EC8FF','#9B7BFF',crayon(kidById(lane.dataset.kid).color)];
  c.innerHTML=Array.from({length:16},(_,i)=>{ const a=i/16*Math.PI*2, d=55+Math.random()*45; return `<i style="--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d).toFixed(0)}px;background:${cols[i%cols.length]}"></i>`; }).join('');
  lane.appendChild(c); setTimeout(()=>c.remove(),900);
  if(bump){ const n=lane.querySelector('.fd-num'); n?.classList.remove('bump'); void n?.offsetWidth; n?.classList.add('bump'); }
}
function foodDashCard(){
  const pend=S.kids.reduce((n,k)=>n+pendingFoods(k.id).length,0);
  return `<button class="fcard scene" data-rid="food" data-act="food" aria-label="새 음식 도전">
    <span class="sc-ico">${ico('yum')}</span><span class="fc-title">새 음식 도전</span><span class="fc-sub">${pend?`오늘의 식판이 기다려요`:'먹어 본 음식을 모아요'}</span>
    <span class="fc-foot"><span class="fd-mini">${S.kids.map(k=>`<span class="fdm kid" style="--k:${k.color}">${avatar(k,46)}<b>${foodCount(k.id)}</b></span>`).join('')}</span></span></button>`;
}
/* --- 엄마·아빠 폰 --- */
function foodParentCard(){
  const ct=curTray(), t=todayKey();
  const face=(k,f)=>{ const lv=lvOf(k.id,f.id); return `<button class="fl-k kid${lvCls(lv)}${lv>0?' on':''}" style="--k:${k.color}" data-act="fdcyc" data-kid="${k.id}" data-fid="${f.id}" aria-label="${esc(k.name)} ${LV_SAY[lv]}">${avatar(k,32)}${lv<0?`<span class="fl-x">${ui('x')}</span>`:''}</button>`; };

const SHOP=[['top','옷',TOPS],['head','머리 장식',HEADS],['face','얼굴 꾸미기',FACEACC],['frame','프레임',FRAMES],['bg','배경',BGS],['pet','친구',PETS]];
const SHOP_BASE={top:'tee',frame:'basic',bg:'basic'};
let charUid=0;
function charSvg(look,wear,o={}){
  const L={...CH_DEFAULT,...(look||{})}, W={top:'tee',frame:'basic',bg:'basic',...(wear||{})}, u='c'+(++charUid);
  const skin=CH_SKIN[L.skin]||CH_SKIN[1], ss=shade(skin,-.2);
  const top=TOPS[W.top]||TOPS.tee, tc=top.c, edge=c=>c.toUpperCase()==='#FFFFFF'||c==='#EEF1F6'?'#D3D7E2':shade(c,-.22), ts=edge(tc);
  const bc=top.b||'#FFFFFF', bs=edge(bc), sl=top.sleeve||tc, shoe=top.shoe||'#FFFFFF', shs=edge(shoe);
  const skirt=!!top.skirt, legY=skirt?246:232;
  const body=`
    ${top.tail?`<path d="M144 204 Q172 210 184 234 Q164 230 146 222Z" fill="${top.tail}" stroke="${edge(top.tail)}" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    <ellipse cx="120" cy="286" rx="48" ry="7" fill="#000" opacity=".1"/>
    ${limb(`M107 ${legY} V270`,skin,ss,16)}${limb(`M133 ${legY} V270`,skin,ss,16)}
    <ellipse cx="104" cy="276" rx="13" ry="8.5" fill="${shoe}" stroke="${shs}" stroke-width="2.5"/><ellipse cx="136" cy="276" rx="13" ry="8.5" fill="${shoe}" stroke="${shs}" stroke-width="2.5"/>
    ${skirt?`<path d="${SKIRT}" fill="${bc}" stroke="${bs}" stroke-width="2.5" stroke-linejoin="round"/><path d="M74 246 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="${top.skirt}" stroke-width="4" stroke-linecap="round"/>`
      :`<path d="${SHORTS}" fill="${bc}" stroke="${bs}" stroke-width="2.5" stroke-linejoin="round"/>`}
    <path d="${TORSO}" fill="${tc}" stroke="${ts}" stroke-width="2.5"/>
    <g clip-path="url(#t${u})"><g transform="translate(120 174) scale(.84) translate(-120 -162)">${top.draw()}</g></g>
    <path d="${TORSO}" fill="none" stroke="${ts}" stroke-width="2.5"/>
    ${limb('M98 144 Q86 160 85 186',skin,ss,14)}${limb('M142 144 Q154 160 155 186',skin,ss,14)}
    ${limb('M98 144 Q91 151 88 162',sl,edge(sl),16)}${limb('M142 144 Q149 151 152 162',sl,edge(sl),16)}
    ${top.puff?`<circle cx="94" cy="146" r="11" fill="${top.puff}" stroke="${edge(top.puff)}" stroke-width="2.5"/><circle cx="146" cy="146" r="11" fill="${top.puff}" stroke="${edge(top.puff)}" stroke-width="2.5"/>`:''}
    ${top.epaulet?`<path d="M86 142 Q95 133 106 136 L102 146 Q95 142 90 150Z M154 142 Q145 133 134 136 L138 146 Q145 142 150 150Z" fill="${top.epaulet}"/>`:''}
    <circle cx="85" cy="189" r="8" fill="${skin}" stroke="${ss}" stroke-width="2.5"/><circle cx="155" cy="189" r="8" fill="${skin}" stroke="${ss}" stroke-width="2.5"/>`;
  const head=`<g transform="${HEAD_T}">
      ${hairSvg(L.hair,L.hc,'back')}
      <path d="${FACE_D}" fill="${skin}" stroke="${ss}" stroke-width="2.5"/>
      ${cheekSvg(L.cheek)}${eyesSvg(L.eyes)}${mouthSvg(L.mouth)}
      ${hairSvg(L.hair,L.hc,'front')}
      ${W.face&&FACEACC[W.face]?FACEACC[W.face].draw():''}</g>`;
  const headTop=`<g transform="${HEAD_T}">${hairSvg(L.hair,L.hc,'top')}${W.head&&HEADS[W.head]?HEADS[W.head].draw(L.hc):''}</g>`;
  const behind=`<g transform="${HEAD_T}">${hairSvg(L.hair,L.hc,'behind')}</g>`;
  const bg=(BGS[W.bg]||BGS.basic).draw(u);
  const frame=o.plain?'':(FRAMES[W.frame]||FRAMES.basic).draw(u), pet=o.plain||!(W.pet&&PETS[W.pet])?'':PETS[W.pet].draw();
  const vb=o.crop==='face'?[60,30,120,110]:o.crop==='head'?[32,-20,176,172]:[-6,-30,252,348];
  return `<svg class="charsvg${o.crop?' crop':''}" viewBox="${vb.join(' ')}" ${o.size?`width="${o.size}" height="${Math.round(o.size*vb[3]/vb[2])}"`:''} aria-hidden="true">
    <defs><clipPath id="k${u}">${cardRect('')}</clipPath><clipPath id="t${u}"><path d="${TORSO}"/></clipPath></defs>
    <g clip-path="url(#k${u})">${bg}${behind}${body}${head}</g>${headTop}${frame}${pet}</svg>`;
}

/* --- 캐릭터 저장·별 지갑 (아이들 태블릿) --- */
const CR={tab:'look',try:null};
const josaEul=w=>{ const c=String(w).charCodeAt(String(w).length-1)-0xAC00; return c>=0&&c<11172&&c%28?'을':'를'; };
function charOf(kid){ const c=(S.chars||{})[kid]; return c&&typeof c==='object'?{made:!!c.made,look:{...CH_DEFAULT,...(c.look||{})},wear:{...(c.wear||{})},own:{...(c.own||{})},...(c.lastBuy?{lastBuy:c.lastBuy}:{})}:{made:false,look:{...CH_DEFAULT},wear:{},own:{}}; }
// 상점은 하루에 1개만
const boughtToday=c=>c.lastBuy===todayKey();
function saveChar(kid,c){ S.chars||(S.chars={}); S.chars[kid]=c; rset('chars/'+kid,c); save(); }
// 음식 별: 1번 ★1 · 적당히 ★2 · 전부 ★3
const foodStars=kid=>{ const it=FD().items; let n=0; for(const d of Object.values(FD().days)) for(const [fid,lv] of Object.entries(d?.[kid]||{})) if(it[fid]&&lv>0) n+=LV_STAR[lv]||0; return n; };
const starsEarned=kid=>(S.bank[kid]||0)+foodStars(kid);
const starsSpent=kid=>Object.values(charOf(kid).own).reduce((n,v)=>n+(Number(v)||0),0);
const wallet=kid=>Math.max(0,starsEarned(kid)-starsSpent(kid));
const shopCat=cat=>SHOP.find(x=>x[0]===cat);
const itemOf=(cat,id)=>{ const c=shopCat(cat); return c?c[2][id]:null; };
const owns=(c,cat,id)=>(SHOP_BASE[cat]===id)||(itemOf(cat,id)?.p===0)||(c.own[cat+':'+id]!=null);
const worn=(c,cat,id)=>(c.wear[cat]||SHOP_BASE[cat]||'')===id;
function charRow(){
  if(S.role!=='kids') return '';
  return `<section class="char-row">${S.kids.map(k=>{ const c=charOf(k.id);
    return `<button class="char-card kid" style="--k:${k.color}" data-act="char" data-kid="${k.id}" aria-label="${esc(k.name)} 꾸미기">
      <span class="cc-art">${charSvg(c.look,c.wear,{size:150})}${c.made?'':`<span class="cc-new">나를 만들어요!</span>`}</span>
      <span class="cc-info"><b>${esc(k.name)}</b><span class="cc-wallet">${star(26)}<em>${wallet(k.id)}</em></span><span class="cc-go">${c.made?'꾸미러 가기':'캐릭터 만들기'} ${ui('next')}</span></span></button>`; }).join('')}</section>`;
}
function openChar(kid){ view.ck=kid; const c=charOf(kid); CR.tab=c.made?'top':'look'; CR.try=null; view.screen='char'; show(); }
function crBurst(){
  const st=$('.cr-stage'); if(!st) return; const c=document.createElement('div'); c.className='fd-burst'; c.style.left='50%'; c.style.top='45%';
  const cols=['#FF6B6B','#FFB84D','#FFE45E','#6BD98B','#5EC8FF','#9B7BFF','#FF6BD5'];
  c.innerHTML=Array.from({length:22},(_,i)=>{ const a=i/22*Math.PI*2, d=90+Math.random()*70; return `<i style="--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d).toFixed(0)}px;background:${cols[i%cols.length]}"></i>`; }).join('');
  st.appendChild(c); setTimeout(()=>c.remove(),900);
}
function lookPanel(k,c){
  const L=c.look, sw=(f,arr)=>`<div class="cr-sw">${arr.map((col,i)=>`<button class="sw-c" style="--c:${col}" data-act="crlook" data-f="${f}" data-v="${i}" aria-pressed="${L[f]===i}" aria-label="${i+1}번"></button>`).join('')}</div>`;
  const opt=(f,arr,crop)=>`<div class="cr-opts${crop==='face'?' face':''}">${arr.map(([v,n])=>`<button class="cr-opt" data-act="crlook" data-f="${f}" data-v="${v}" aria-pressed="${L[f]===v}">${charSvg({...L,[f]:v},{},{plain:true,crop,size:crop==='face'?74:86})}<span>${n}</span></button>`).join('')}</div>`;

    <h3>머리 모양</h3>${opt('hair',CH_HAIR,'head')}
    <h3>머리 색</h3>${sw('hc',CH_HAIRC)}
    <h3>눈</h3>${opt('eyes',CH_EYES,'face')}
    <h3>입</h3>${opt('mouth',CH_MOUTH,'face')}

function shopPanel(k,c,cat){

    return `<button class="cr-item${on?' on':''}${tr?' trying':''}${own?' own':''}" data-act="critem" data-cat="${cat}" data-id="${id}">
      <span class="ci-art">${['head','face'].includes(cat)?charSvg(c.look,w,{size:112,crop:'head'}):charSvg(c.look,w,{size:104})}</span><span class="ci-name">${esc(it.n)}</span>
      <span class="ci-tag">${on?`${ui('check')}입는 중`:own?'가졌어요':`${star(16)}${it.p}`}</span>${!own&&it.p>money?'<span class="ci-lock"></span>':''}</button>`; }).join('')}</div>`;
}

const RP={prevSeen:0};
function allReplies(){
  const out=[];
  for(const mid in (S.replies||{})) for(const key in (S.replies[mid]||{})){ const v=S.replies[mid][key]; if(v&&v.at&&personById(pk(key))) out.push({mid,key,r:pk(key),...v}); }
  return out.sort((a,b)=>b.at-a.at);

/* ===== star calendar ===== */
const cal={y:0,m:0,sel:null,kid:'all'};
const dKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function dayStars(dk,kid){const d=S.log[dk];if(!d)return 0;let n=d._x?.[kid]||0;for(const r of RIDS)n+=d[r]?.[kid]?.stars||0;return n}
const firsts=(dk,kid)=>{const d=S.log[dk];return d?RIDS.filter(r=>d[r]?.[kid]?.rank).length:0};
function openCal(){const t=new Date();cal.y=t.getFullYear();cal.m=t.getMonth();cal.sel=todayKey();view.screen='cal';show()}
function detailHtml(dk,kids){
  const [Y,M,D]=dk.split('-').map(Number), dd=S.log[dk]||{};
  const cell=e=>e?.rank?`${doneBadge(28)}${starRow(e.stars,13)}`:e?.wait?'<span class="muted">확인 대기</span>':e?.done?.length?`<span class="muted">${e.done.length}개 했어요</span>`:'<span class="muted">–</span>';
  const head=`<span></span>${kids.map(k=>`<span class="dt-h">${avatar(k,40)}${esc(k.name)}</span>`).join('')}`;
  const rows=RIDS.map(r=>`<span class="dt-r scene flat" data-rid="${r}"><span class="sc-ico">${ico(ROUT[r].icon)}</span>${ROUT[r].short}</span>${kids.map(k=>`<span class="dt-c">${cell(dd[r]?.[k.id])}</span>`).join('')}`).join('');
  const extra=kids.some(k=>dd._x?.[k.id])?`<span class="dt-r">다시 시작 전</span>${kids.map(k=>`<span class="dt-c">${dd._x?.[k.id]?starRow(Math.min(dd._x[k.id],6),13)+`<span class="muted">${dd._x[k.id]}개</span>`:'<span class="muted">–</span>'}</span>`).join('')}`:'';
  const sum=`<span class="dt-r">합계</span>${kids.map(k=>`<span class="dt-c"><span class="dt-sum">${star(18)}${dayStars(dk,k.id)}</span></span>`).join('')}`;
  return `<section class="panel"><h2><span>${M}월 ${D}일 ${WD[new Date(Y,M-1,D).getDay()]}요일</span></h2>
    <div class="dt" style="--n:${kids.length}">${head}${rows}${extra}${sum}</div></section>`;
}
function renderCal(){
  const {y,m}=cal, first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), tk=todayKey();
  const kids=cal.kid==='all'?S.kids:[kidById(cal.kid)];
  const one=cal.kid!=='all';
  let cells='';
  for(let i=0;i<first;i++) cells+='<span class="cd blank"></span>';
  for(let d=1;d<=days;d++){
    const dk=dKey(y,m,d), wd=(first+d-1)%7, fut=dk>tk;
    const cls=`cd${wd===0?' sun':''}${wd===6?' sat':''}${dk===tk?' today':''}${dk===cal.sel?' sel':''}${fut?' fut':''}`;
    let inner='',style='';
    if(one){const k=kids[0],n=dayStars(dk,k.id),f=firsts(dk,k.id);
      style=`--k:${k.color};--p:${Math.min(n*7,56)}%`;
      inner=n?`${f?`<span class="cd-first">${Array.from({length:f},()=>doneBadge(16)).join('')}</span>`:''}<span class="cd-big">${star(16)}${n}</span>`:'';}
    else inner=kids.map(k=>{const n=dayStars(dk,k.id);return n?`<span class="cd-dot kid" style="--k:${k.color}"><i></i>${n}</span>`:''}).join('');
    cells+=`<button class="${cls}" data-act="csel" data-date="${dk}" ${fut?'disabled':''} style="${style}" aria-label="${m+1}월 ${d}일"><span class="cd-n">${d}</span><span class="cd-k">${inner}</span></button>`;
  }
  const sums=S.kids.filter(k=>one?k.id===cal.kid:true).map(k=>{let s=0,f=0,act=0;
    for(let d=1;d<=days;d++){const dk=dKey(y,m,d),n=dayStars(dk,k.id);s+=n;f+=firsts(dk,k.id);if(n)act++}
    return `<div class="ms kid" style="--k:${k.color}">${avatar(k,50)}<div style="min-width:0"><b>${esc(k.name)}</b><small>다 한 루틴 ${f}번 · 별 받은 날 ${act}일</small></div><span class="big">${star(26)}${s}</span></div>`}).join('');
  const t=new Date(), isNow=y===t.getFullYear()&&m===t.getMonth();
  $('#cal').innerHTML=`<div class="wrap">
    <header class="cal-top"><button class="back" data-act="home" aria-label="처음 화면으로">${ui('back')}</button><h1>별 달력</h1>
      <div class="mnav"><button class="ib" data-act="cmon" data-d="-1" aria-label="지난달">${ui('back')}</button><b>${y}년 ${m+1}월</b><button class="ib" data-act="cmon" data-d="1" ${isNow?'disabled':''} aria-label="다음 달">${ui('next')}</button></div></header>
    <div class="ed-bar"><div class="seg"><button data-act="ckid" data-kid="all" aria-pressed="${!one}">모두</button>${S.kids.map(k=>`<button data-act="ckid" data-kid="${k.id}" aria-pressed="${cal.kid===k.id}">${avatar(k,30)}${esc(k.name)}</button>`).join('')}</div></div>
    <div class="cal-grid">
      <section class="panel">
        <div class="wk">${WD.map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="days">${cells}</div>
        <p class="hint">${one?'색이 진할수록 별을 많이 받은 날이에요. 작은 체크는 그날 다 한 루틴 수예요.':'날짜를 누르면 그날 루틴별로 다 했는지 볼 수 있어요.'}</p>
      </section>
      <div class="cal-side">
        <section class="panel"><h2><span>${m+1}월 모은 별</span></h2>${sums}</section>
        ${cal.sel&&cal.sel.startsWith(`${y}-${pad(m+1)}`)?detailHtml(cal.sel,kids):''}
      </div>
    </div></div>`;
}

function holdable(el,ms,fn){
  if(!el) return; let t;
  const end=()=>{clearTimeout(t);el.classList.remove('holding')};
  el.addEventListener('pointerdown',()=>{el.classList.add('holding');t=setTimeout(()=>{end();fn()},ms)});
  ['pointerup','pointerleave','pointercancel'].forEach(v=>el.addEventListener(v,end));
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
}
let armed=null,armT;
function confirmTap(b){
  const key=b.dataset.confirm; if(!key) return true;

  armed=key; const orig=b.innerHTML; b.classList.add('armed'); b.textContent='한 번 더 누르면 실행돼요';
  clearTimeout(armT); armT=setTimeout(()=>{armed=null;b.classList.remove('armed');b.innerHTML=orig},3000);
  return false;
}
