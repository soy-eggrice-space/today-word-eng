plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// 서명키는 저장소에 암호화돼 있고(app/release.keystore.enc), 빌드할 때 GitHub Secret(KEYSTORE_PASSWORD)으로 풀어서 써요.
def ksFile = file('release.keystore')
def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.soyeggrice.jlptn4'
    compileSdk 34

    defaultConfig {
        applicationId 'com.soyeggrice.jlptn4'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'gongbuhae'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
