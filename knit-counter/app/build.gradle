plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// 서명키는 암호화(keys/today.keystore.enc)해서 두고, 빌드할 때 GitHub Secrets(KEYSTORE_PASSWORD)로 풀어 씁니다.
def ksFile = file('today.keystore')
def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: ''

android {
    namespace 'com.soyeggrice.knitcounter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.soyeggrice.knitcounter'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // 항상 같은 서명키로 빌드해야 덮어쓰기 설치(업데이트) 때 기록이 지워지지 않아요.
    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'today'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
