<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F8F1DE">
<title>공!부!해!</title>
<style>
@font-face{font-family:'JuaLocal';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'FredokaLocal';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700;font-display:swap}
:root{
  --bg:#F8F1DE; --paper:#FFFDF8; --yolk:#F2D07A; --yolkD:#DDB04F; --soft:#FBF4E2;
  --ink:#3B2F4A; --ink2:#8E8098; --hair:#EDE2C8; --pink:#E9A3B4; --mint:#9CCDB6; --sky:#A9C2E6; --lilac:#C9BEE6;
  --ok:#4E9E73; --okbg:#E3F3E8; --no:#D46A5C; --nobg:#FBE6E1;
  --line:2.5px solid var(--ink); --pop:0 5px 0 var(--ink); --popS:0 3px 0 var(--ink);
  --fd:'JuaLocal','Jua',system-ui,sans-serif; --fe:'FredokaLocal','Fredoka','JuaLocal',system-ui,sans-serif;
  --fb:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fd);font-size:16px;overflow-x:hidden;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(rgba(59,47,74,.07) 1.5px,transparent 1.8px);background-size:24px 24px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.en{font-family:var(--fe);font-weight:600}
.hide{display:none!important}
#app{max-width:480px;margin:0 auto;padding:12px 16px 120px;min-height:100vh}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 제목 · 상단 */
.ttl{display:inline-block;font-family:var(--fd);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);line-height:1.15;white-space:nowrap;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:var(--line);box-shadow:var(--popS);border-radius:999px;padding:4px 11px 4px 8px;font-size:15px;white-space:nowrap}
.pill b{font-family:var(--fe);font-weight:700;font-size:16px}
.av{width:42px;height:42px;border-radius:50%;background:var(--paper);border:var(--line);box-shadow:var(--popS);display:grid;place-items:center;overflow:hidden;flex:none}
.av svg{width:40px;height:40px}
.back{height:42px;padding:0 16px;border-radius:999px;background:var(--paper);border:var(--line);box-shadow:var(--popS);font-size:16px;white-space:nowrap}

/* 공통 블록 */
.card{background:var(--paper);border:var(--line);box-shadow:var(--pop);border-radius:24px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.h2{font-size:22px}
.sub{font-family:var(--fb);font-weight:500;font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:999px;border:var(--line);box-shadow:var(--pop);background:var(--yolk);font-size:18px;white-space:nowrap}
.btn.w{background:var(--paper)}.btn.p{background:var(--pink)}.btn.m{background:var(--mint)}.btn.s{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;box-shadow:var(--popS)}
.btn:disabled{opacity:.45}
.btn:active,.chip:active,.opt:active,.choice:active,.tile:active,.back:active,.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip{height:38px;padding:0 13px;border-radius:999px;border:var(--line);background:var(--paper);font-size:14.5px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.chip.on{background:var(--yolk)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.iconbtn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--paper);border:var(--line);box-shadow:var(--popS);display:grid;place-items:center;font-size:17px}
.bar{height:14px;border-radius:9px;background:#F1E7CF;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yolk);border-radius:7px;transition:width .4s}
.bar.m i{background:var(--mint)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1 1 130px}

/* 하단 탭 */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 24px));display:flex;background:var(--paper);border:var(--line);border-radius:26px;padding:5px;box-shadow:var(--pop);z-index:20}
.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;height:52px;justify-content:center;border-radius:20px;font-size:12px;position:relative}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{background:var(--yolk)}
.tabs .dot{position:absolute;top:2px;right:16%;min-width:18px;height:18px;border-radius:9px;background:#D9705E;color:#fff;font-family:var(--fe);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}

/* 처음 설정 */
.setup{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:26px;height:8px;border-radius:5px;background:#EADFC4}
.steps i.on{background:var(--ink)}
.hero{text-align:center}
.hero .big svg{width:140px;height:140px;animation:bob 2s ease-in-out infinite;transform-origin:50% 100%}
.hero .q{font-size:23px;margin-top:6px;line-height:1.35}
.bubble{display:inline-block;position:relative;background:#fff;border:var(--line);border-radius:18px;padding:8px 14px;font-size:16px;box-shadow:var(--popS);margin-bottom:8px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:var(--line);border-bottom:var(--line);transform:translateX(-50%) rotate(45deg)}
.welcome{display:flex;justify-content:center;align-items:flex-end;margin-bottom:4px}
.welcome span{width:66px;height:66px;margin:0 -6px;animation:hop 1.6s ease-in-out infinite;animation-delay:var(--d)}
.welcome span:nth-child(3){width:90px;height:90px}
.welcome svg{width:100%;height:100%}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.bigtitle .ttl{font-size:62px;-webkit-text-stroke:9px var(--ink);text-shadow:0 6px 0 var(--ink)}
.txt{width:100%;height:54px;border:var(--line);border-radius:18px;padding:0 16px;font-size:20px;background:#fff;text-align:center;user-select:text;-webkit-user-select:text}
.lv{display:flex;flex-direction:column;gap:9px}
.lvopt{display:flex;align-items:center;gap:12px;text-align:left;border:var(--line);border-radius:20px;background:var(--paper);padding:11px 13px;box-shadow:var(--popS)}
.lvopt.on{background:#F8E6B3}
.lvopt .e{font-size:28px}
.lvopt .n{font-size:17px}
.lvopt .d{font-family:var(--fb);font-weight:500;font-size:12.5px;color:var(--ink2);margin-top:2px}
.lvdots{display:flex;gap:3px;flex:none}.lvdots i{width:8px;height:8px;border-radius:50%;background:#EADFC4;border:1.5px solid var(--ink)}.lvdots i.on{background:var(--yolk)}
.amount{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.amount button{border:var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--popS);padding:12px 0 10px;display:flex;flex-direction:column;align-items:center}
.amount button b{font-family:var(--fe);font-weight:700;font-size:24px}
.amount button span{font-size:11.5px;color:var(--ink2);font-family:var(--fb);font-weight:600}
.amount button.on{background:#F8E6B3}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--popS);aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.opt svg{width:80%;height:80%}
.opt.on{background:#F8E6B3;outline:3px solid var(--yolkD);outline-offset:1px}
.opt small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:11px}
.cust{display:flex;flex-direction:column;gap:12px}
.crow .lab{font-size:15px;margin-bottom:6px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:var(--line);box-shadow:0 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--yolkD);outline-offset:2px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini .opt{width:52px}
.mini .opt svg{width:44px;height:44px}

/* 오늘 */
.hello{display:flex;gap:12px;align-items:center}
.hello .me svg{width:80px;height:80px}
.hello .hi{font-size:20px;line-height:1.35}
.today{background:#FBEFCB;border:var(--line);border-radius:20px;padding:13px;margin-top:14px}
.today .row{display:flex;gap:8px;margin:10px 0}
.today .bx{flex:1;background:#fff;border:var(--line);border-radius:16px;text-align:center;padding:7px 4px}
.today .bx b{display:block;font-family:var(--fe);font-weight:700;font-size:26px;line-height:1.1}
.today .bx span{font-size:12.5px;color:var(--ink2)}
.donebig{text-align:center;padding:6px 0}
.donebig .t{font-size:21px;margin-top:4px}
.vprev{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.vprev .ppl{display:flex;align-items:flex-end;flex:none}
.vprev .ppl svg{width:42px;height:42px;margin-right:-6px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini2{background:var(--paper);border:var(--line);border-radius:18px;padding:10px;box-shadow:var(--popS)}
.mini2 b{font-family:var(--fe);font-weight:700;font-size:23px;line-height:1}
.mini2 b small{font-size:13px;color:var(--ink2);margin-left:1px}
.mini2 div{font-size:12px;color:var(--ink2);margin-top:5px}

/* 테마 · 단어 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:var(--line);border-radius:20px;box-shadow:var(--popS);padding:12px;text-align:left;display:flex;flex-direction:column;gap:5px}
.tile .ic{font-size:28px}
.tile .nm{font-size:17px}
.tile .st{font-size:12px;color:var(--ink2);font-family:var(--fb);font-weight:600}
.tile .bar{height:9px;border-width:1.5px}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thead .ic{font-size:40px}
.thead>div:not(.ic){flex:1 1 170px;min-width:0}
.thead>.btn{flex:1 1 100%}
.wlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:var(--line);border-radius:16px;padding:9px 9px 9px 12px}
.wrow .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--ink);background:#fff}
.wrow .dot.l1{background:var(--yolk)}.wrow .dot.l2{background:var(--sky)}.wrow .dot.l3{background:var(--mint)}
.wrow .tx{flex:1;min-width:0}
.wrow .w{font-size:17px;line-height:1.25;word-break:keep-all}
.wrow .k{font-size:13px;color:var(--ink2);font-family:var(--fb);font-weight:500;margin-top:2px}
.lvtag{display:inline-block;font-family:var(--fe);font-size:11px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 4px;margin-left:5px;vertical-align:2px;background:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px;font-family:var(--fb);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:4px;vertical-align:-1px;background:#fff}
.more{text-align:center;margin-top:10px}

/* 카드 */
.fcard{background:var(--paper);border:var(--line);box-shadow:var(--pop);border-radius:26px;padding:24px 16px;text-align:center;min-height:320px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.fcard .tag{position:absolute;top:12px;left:14px;font-size:13px;background:#FBEFCB;border:2px solid var(--ink);border-radius:999px;padding:1px 9px}
.fcard .say{position:absolute;top:10px;right:10px}
.fcard .wd{font-size:38px;line-height:1.2;word-break:keep-all;margin-top:22px}
.fcard .wd.long{font-size:27px}
.fcard .mean{font-size:21px;color:#9A6B2E;margin-top:4px;word-break:keep-all}
.exbox{width:100%;margin-top:12px;background:var(--soft);border:2px dashed #E3D3AF;border-radius:18px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.exbox .tx{flex:1;min-width:0}
.exbox .ex{font-size:17px;line-height:1.45;font-family:var(--fb);font-weight:600}
.exbox .ex mark{background:linear-gradient(transparent 55%,var(--yolk) 55%);color:inherit;padding:0 1px}
.exbox .exk{font-size:14px;color:var(--ink2);margin-top:5px;font-family:var(--fb);font-weight:500}
.exbox .exk.blur{filter:blur(5px)}
.cnav{display:flex;align-items:center;gap:10px;margin-top:18px;justify-content:center}
.cnav .cnt{font-family:var(--fe);font-weight:700;font-size:18px;min-width:64px;text-align:center}

/* 퀴즈 */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead b{font-family:var(--fe);font-weight:700}
.prompt{text-align:center;padding:20px 14px 22px;position:relative;min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.prompt .ask{font-size:15px;color:var(--ink2)}
.prompt .qw{font-size:36px;line-height:1.2;word-break:keep-all}
.prompt .qw.long{font-size:25px}
.prompt .qk{font-size:25px;word-break:keep-all;line-height:1.3}
.prompt .say{position:absolute;top:10px;right:10px}
.prompt .buddy{position:absolute;left:6px;bottom:-14px;pointer-events:none}
.prompt .buddy svg{width:58px;height:58px}
.bigsay{width:86px;height:86px;border-radius:50%;border:var(--line);background:#FBEFCB;box-shadow:var(--pop);font-size:36px;display:grid;place-items:center;margin:6px auto 2px}
.nosound{display:inline-flex;margin-top:10px;border:2px dashed var(--ink2);border-radius:999px;padding:6px 14px;font-size:14.5px;background:#fff}
.cloze{font-size:19px;line-height:1.5;font-family:var(--fb);font-weight:600;word-break:keep-all}
.cloze u{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink);color:transparent;text-decoration:none}
.clozek{font-size:13.5px;color:var(--ink2);font-family:var(--fb);font-weight:500}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.choice{min-height:56px;border:var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--popS);font-size:17px;padding:8px 14px;line-height:1.3;word-break:keep-all}
.choice.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.choice.no{background:var(--nobg);border-color:var(--no);box-shadow:0 3px 0 var(--no)}
.choice.dim{opacity:.45}
.spell{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.spell .hint{font-family:var(--fe);font-weight:600;font-size:24px;letter-spacing:.12em}
.spell input{width:100%;height:56px;border:var(--line);border-radius:18px;padding:0 16px;font-family:var(--fe);font-weight:600;font-size:22px;text-align:center;background:#fff;user-select:text;-webkit-user-select:text}
.spell input.ok{border-color:var(--ok);background:var(--okbg)}.spell input.no{border-color:var(--no);background:var(--nobg)}
.fb{margin-top:14px;border:var(--line);border-radius:20px;padding:13px 14px;background:var(--paper);box-shadow:var(--popS);display:flex;flex-direction:column;gap:7px;animation:pop .25s ease}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb .topr{display:flex;align-items:center;gap:8px}
.fb .verdict{font-size:18px}
.fb .w{font-size:21px}
.fb .k{font-size:15px;font-family:var(--fb);font-weight:600}
.fb .exbox{background:rgba(255,255,255,.7);margin-top:2px}
.fb .next{align-self:flex-end}
@keyframes pop{from{transform:scale(.95);opacity:0}}

/* 결과 */
.result{text-align:center;margin-top:10px}
.result .big svg{width:130px;height:130px}
.result .t{font-size:25px;margin-top:4px}
.result .score{font-family:var(--fe);font-weight:700;font-size:48px;line-height:1.1;margin-top:8px}
.result .score small{font-size:22px;color:var(--ink2)}
.gain{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.gain span{background:var(--paper);border:var(--line);border-radius:999px;padding:4px 12px;font-size:15px;box-shadow:var(--popS)}

/* 기록 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:14px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:22px;background:var(--yolk);border:2px solid var(--ink);border-radius:7px 7px 3px 3px;min-height:4px}
.chart .c i.z{background:#F1E7CF;border-color:#E3D6B8}
.chart .c span{font-size:10px;color:var(--ink2);font-family:var(--fb);font-weight:600}
.chart .c em{font-style:normal;font-size:10px;font-family:var(--fe);font-weight:700}
.tprog{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tprog .r{display:grid;grid-template-columns:26px 1fr 58px;align-items:center;gap:8px;font-size:14px}
.tprog .r .bar{height:9px;border-width:1.5px;margin-top:3px}
.tprog .r b{font-family:var(--fe);font-weight:700;font-size:13px;text-align:right}

/* 설정 */
.prow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:2px dashed var(--hair);flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .pl{flex:1 1 200px;min-width:0}
.prow .pt{font-size:18px}
.prow .pd{font-size:13px;color:var(--ink2);margin-top:2px;font-family:var(--fb);font-weight:500}
.tgl{width:60px;height:34px;border-radius:999px;border:var(--line);background:#EDE4D2;position:relative;flex:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.tgl.on{background:var(--yolk)}.tgl.on::after{left:29px}
.ntxt{height:44px;border:var(--line);border-radius:14px;padding:0 12px;font-size:17px;background:#fff;width:100%;user-select:text;-webkit-user-select:text}

/* 모달 · 토스트 */
.modal{position:fixed;inset:0;background:rgba(59,47,74,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.mbox{background:var(--paper);border:var(--line);box-shadow:var(--pop);border-radius:26px;padding:20px 16px;width:min(420px,100%);max-height:88vh;overflow:auto;text-align:center;animation:pop .25s ease}
.mt{font-size:22px;line-height:1.35}
.md{font-family:var(--fb);font-weight:500;font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#burst{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
#burst span{position:absolute;top:-40px}
.empty{text-align:center;padding:24px 8px}
.empty .t{font-size:20px;margin-top:6px}

/* 마을 */
.village{padding:0;overflow:hidden}
.vhead{padding:14px 14px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vhead .t{flex:1 1 180px;min-width:0}
.mergebtn{border:var(--line);box-shadow:var(--popS);border-radius:999px;background:#F6D9E0;padding:5px 13px;font-size:15px}
.scene{position:relative;overflow:hidden;border-top:var(--line);padding:100px 6px 16px;min-height:330px;background:linear-gradient(#D7E9F7 0 96px,#C9E3B4 96px)}
.scene.night{background:linear-gradient(#3A3560 0 96px,#8DB888 96px)}
.scene:before{content:"";position:absolute;left:-5%;right:-5%;top:70px;height:56px;background:radial-gradient(ellipse at 22% 100%,#B6D99D 0 40%,transparent 41%),radial-gradient(ellipse at 74% 100%,#B6D99D 0 45%,transparent 46%);pointer-events:none}
.scene.night:before{background:radial-gradient(ellipse at 22% 100%,#7BAA77 0 40%,transparent 41%),radial-gradient(ellipse at 74% 100%,#7BAA77 0 45%,transparent 46%)}
.sun{position:absolute;top:14px;right:22px;width:56px;height:56px}
.cloud{position:absolute;top:26px;height:24px;border-radius:20px;background:#fff;border:2px solid #CFE0EF}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border:2px solid #CFE0EF;border-bottom:none;border-radius:50% 50% 0 0}
.cloud:before{width:28px;height:18px;left:10px;top:-13px}.cloud:after{width:20px;height:14px;left:32px;top:-9px}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF5C2;animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.fall{position:absolute;top:-30px;font-size:18px;pointer-events:none;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translate(40px,440px) rotate(300deg)}}
.plots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 4px;align-items:end}
.plot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:112px;position:relative}
.plot.wide{grid-column:span 2}
.plot.deco{pointer-events:none}
.ftag{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 7px;font-size:11.5px;line-height:1.25;margin-bottom:3px;max-width:108px;text-align:center;word-break:keep-all;box-shadow:0 2px 0 var(--ink)}
.ftag.big{background:var(--yolk)}.ftag.hid{background:linear-gradient(90deg,#F6DCE5,#E3DCF5,#DCEFF6)}.ftag.new{background:#F8E6B3}
.mon{position:relative;cursor:pointer;display:flex;justify-content:center}
.mon svg{width:var(--w,68px);height:var(--w,68px);overflow:visible}
.mon .bob,.hero svg .bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px) scale(1.03,.97)}}
.mon.walk{animation:wander 6s ease-in-out infinite}
@keyframes wander{30%{transform:translateX(var(--wx,10px))}60%{transform:translateX(calc(var(--wx,10px)*-.6))}}
.mon.jump .bob{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-30px) scale(.92,1.08)}100%{transform:none}}
.mon.sleep .bob{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.mon .think{position:absolute;top:-4px;right:-6px;font-size:16px;background:#fff;border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;animation:wob 1.8s ease-in-out infinite}
.eyes{animation:blink 4.2s infinite;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.zz{position:absolute;top:-6px;right:-4px;font-size:15px;animation:zz 2.4s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}
.shadow{width:48px;height:8px;border-radius:50%;background:rgba(59,47,74,.15);margin-top:-5px}
.say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 9px;white-space:nowrap;font-size:13px;margin-bottom:4px;z-index:6;font-family:var(--fb);font-weight:600;animation:popx .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popx{from{transform:translateX(-50%) scale(.4);opacity:0}}
.heart{position:absolute;top:-10px;left:50%;font-size:26px;pointer-events:none;animation:hup 1.1s ease-out forwards;z-index:4}
@keyframes hup{from{transform:translate(-50%,10px) scale(.5);opacity:0}30%{opacity:1}to{transform:translate(-50%,-48px) scale(1.2);opacity:0}}
.egg svg{width:52px;height:64px;animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}55%{transform:none}}
.egg.cracking svg{animation:crack .5s ease-in-out}
@keyframes crack{25%{transform:rotate(-14deg) scale(1.08)}50%{transform:rotate(14deg) scale(1.12)}75%{transform:rotate(-8deg) scale(1.05)}}
.hatched{animation:hatch .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hatch{from{transform:scale(.2) translateY(30px);opacity:0}}
.mailbox{font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 rgba(59,47,74,.3))}
.mailbox.ready{animation:wob 1.4s ease-in-out infinite;transform-origin:50% 90%}
.decoi{font-size:38px;line-height:1;display:inline-block;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(-6deg)}}
.house{cursor:pointer;position:relative}
.house svg{width:144px;height:124px;overflow:visible}
.vempty{grid-column:1/-1;text-align:center;padding:20px 10px;font-size:16px;background:rgba(255,255,255,.8);border-radius:16px;border:2px dashed var(--ink)}
.tray{border-top:var(--line);padding:10px 12px;background:var(--soft)}
.tray .hint{font-size:13px;color:var(--ink2);font-family:var(--fb);font-weight:600;margin-bottom:8px}
.tray .items{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tray .lab{font-size:14px}
.tray .sep{width:2px;height:26px;background:var(--hair);margin:0 4px}
.tray .none{font-size:13px;color:var(--ink2)}
.item{position:relative;width:44px;height:44px;border-radius:14px;border:var(--line);background:#fff;box-shadow:var(--popS);font-size:22px;display:grid;place-items:center}
.item svg{width:34px;height:34px}
.item b{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-family:var(--fe);font-size:11px;display:grid;place-items:center;padding:0 4px}
.item.on{background:var(--yolk);transform:translateY(-3px) rotate(-4deg)}
.vnote{padding:10px 14px 14px;border-top:2px dashed var(--hair);color:var(--ink2);font-size:13px;line-height:1.55;font-family:var(--fb);font-weight:500}
.three{display:flex;align-items:center;justify-content:center;gap:2px;margin:16px 0}
.three svg{width:52px;height:52px}
.three .q{width:58px;height:58px;border-radius:50%;border:var(--line);background:var(--yolk);display:grid;place-items:center;font-size:28px;flex:none}
.three.merging .src{animation:suck .7s ease-in forwards}
@keyframes suck{to{transform:translateX(var(--dx)) scale(.2);opacity:0}}
.result2 svg{width:150px;height:150px}
.room{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:linear-gradient(#FBF0DA 60%,#E8CFA4 60%);border:var(--line);border-radius:20px;padding:12px;margin:14px 0}
.bed{position:relative;aspect-ratio:1/1;border:2px solid var(--ink);border-radius:14px;background:#fff;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.bed svg{width:76%;height:76%;margin-top:-4px;position:relative;z-index:1}
.bed .pillow{position:absolute;top:8%;left:18%;right:18%;height:24%;background:#E2ECF8;border:2px solid var(--ink);border-radius:10px}
.bed .blanket{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(45deg,#EFC3CE 0 8px,#F6DCE3 8px 16px);border-top:2px solid var(--ink);z-index:2}
.bed .zz{top:2px;right:4px}
.bed.empty em{position:absolute;bottom:40%;font-style:normal;font-family:var(--fb);font-size:11px;font-weight:600;color:var(--ink2);z-index:3}
.awake{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.awake button{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:4px 6px 6px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;width:64px}
.awake svg{width:46px;height:46px}

/* 컬렉션 */
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dexc{border:var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--popS);padding:8px 5px 10px;text-align:center;position:relative}
.dexc svg{width:66px;height:66px}
.dexc .n{font-size:13.5px;line-height:1.2}
.dexc .h{font-family:var(--fb);font-size:10.5px;font-weight:600;color:var(--ink2);margin-top:3px;line-height:1.3}
.dexc.hid{background:linear-gradient(160deg,#FBF0F4,#F2EFFB 50%,#EEF7FB)}
.dexc.lock svg{filter:brightness(0) opacity(.16)}
.dexc .badge{position:absolute;top:6px;left:6px;font-size:9.5px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 5px;font-family:var(--fb);font-weight:700}
.ach{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:16px;background:#fff;padding:10px 11px}
.ach.done{background:#FBEFCB}
.ach .i{font-size:26px;width:34px;text-align:center;flex:none}
.ach .b{flex:1;min-width:0}
.ach .n{font-size:15px}
.ach .r{font-family:var(--fb);font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.ach .bar{height:9px;margin-top:5px;border-width:1.5px}
.ach .st{font-family:var(--fe);font-weight:700;font-size:12px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="backupInput" accept=".json,application/json,text/plain" hidden>
<script src="words.js"></script>
<script src="creature.js"></script>
<script src="village.js"></script>
<script src="app.js"></script>
</body>
