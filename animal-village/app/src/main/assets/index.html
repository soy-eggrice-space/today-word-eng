<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>우리 동물 마을</title>
<style>@font-face{font-family:'Jua';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}</style>
<style>
:root{--ink:#4a3b32;--cream:#fff8ec;--accent:#ff9f68;--line:#f0dcc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fbf6a;font-family:'Jua',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.pill{background:rgba(255,248,236,.94);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bar{width:90px;height:12px;background:#f3e3cc;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9fb5,#ff6f91)}
.right{display:flex;gap:8px;justify-content:flex-end}
.pill{white-space:nowrap}
.menu{position:fixed;left:12px;bottom:18px;display:flex;gap:8px}
#mini{position:fixed;left:12px;bottom:72px;width:168px;height:112px;border:3px solid #fff;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.12),0 0 0 2px var(--line);touch-action:none;transition:width .2s,height .2s}
#mini.big{width:min(420px,calc(100vw - 24px));height:min(280px,calc((100vw - 24px)*.667))}
@media (max-width:420px){.pill,.btn{font-size:16px;padding:5px 10px}.bar{width:56px}.menu{gap:6px}}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{pointer-events:auto;background:var(--cream);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
#hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(255,248,236,.95);border:3px solid var(--line);border-radius:18px;padding:10px 18px;font-size:19px;pointer-events:none;transition:opacity .2s;max-width:92vw;width:max-content;text-align:center;line-height:1.35}
#hint.off{opacity:0}
.modal{z-index:50;position:fixed;inset:0;background:rgba(40,30,20,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{max-height:92vh;overflow:auto;background:var(--cream);border:4px solid var(--line);border-radius:26px;padding:20px;width:min(320px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.panel h2{margin:0 0 4px;font-weight:400;font-size:24px}
.big{font-size:21px;padding:12px;border-radius:18px;border:3px solid var(--line);background:#fff}
.big.main{background:var(--accent);border-color:var(--accent);color:#fff}
#creator{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.cwrap{display:flex;gap:24px;max-width:900px;width:100%;align-items:center;margin:auto}
.preview{flex:0 0 300px;display:flex;flex-direction:column;align-items:center;gap:12px}
#pv{width:280px;height:300px;background:radial-gradient(circle at 50% 65%,#eaf7dc,#cdeab5);border-radius:28px;border:4px solid var(--line)}
#opts{flex:1;display:flex;flex-direction:column;gap:12px}
.row h3{margin:0 0 6px;font-weight:400;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:#fff;border-radius:16px;padding:7px 14px;font-size:17px}
.chip.on{border-color:var(--accent);background:#fff1e6}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 4px var(--accent)}
#name{font-family:inherit;font-size:20px;padding:8px 14px;border-radius:16px;border:3px solid var(--line);width:220px;text-align:center;color:var(--ink);background:#fff}
.go{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:12px 28px;font-size:22px;box-shadow:0 4px 0 #e07c45}
h1{margin:0;font-weight:400;font-size:26px}
@media (max-width:700px){.cwrap{flex-direction:column}.preview{flex:none}#pv{width:220px;height:230px}}
.hidden{display:none!important}
#gamebar{position:fixed;top:62px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff1e6;border:3px solid var(--accent);border-radius:18px;padding:8px 10px 8px 16px;font-size:20px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.08);z-index:5}
body.playing #hint{top:118px}
#who{position:fixed;inset:0;z-index:40;background:var(--cream);display:flex;padding:16px;overflow:auto}
.whobox{margin:auto;text-align:center}
.wholist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px;max-width:760px}
.pc{position:relative;width:150px;background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 8px;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.pc canvas{width:120px;height:120px;display:block;margin:0 auto 4px;background:radial-gradient(circle at 50% 70%,#eaf7dc,#cdeab5);border-radius:18px}
.pc .sub{font-size:14px;opacity:.7}
.pc .del{position:absolute;top:4px;right:6px;border:none;background:none;font-size:16px;opacity:.45;padding:4px}
.pc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;color:var(--accent);min-height:196px;border-style:dashed}
.pc.add div{font-size:18px;color:var(--ink)}
.wide{width:min(460px,100%);max-height:88vh}
.mbody{overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:left}
.it{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:18px}
.it .em{font-size:28px}.it .nm{flex:1}.it .sub{font-size:14px;opacity:.7}
.sm{font-family:inherit;font-size:16px;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:#fff1e6;color:var(--ink)}
.sm:disabled{opacity:.35}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.say{font-size:19px;line-height:1.5;margin:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;font-size:15px}.tools span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 8px}.tools .no{opacity:.35}
#act{position:fixed;right:18px;bottom:18px;width:98px;height:98px;border-radius:50%;background:var(--accent);color:#fff;border:4px solid #fff;font-size:14px;box-shadow:0 5px 0 #e07c45;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:6px;text-align:center}
#act .ae{font-size:30px}
#act.pulse{animation:pulse .35s infinite alternate;background:#ff6f91}
@keyframes pulse{to{transform:scale(1.12)}}
.tabs{flex-wrap:wrap}.tabs .sm.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:15px;line-height:1.3}
.cell .em{font-size:30px;display:block}
.dtabs{justify-content:center}.dtabs .sm{flex:0 0 auto;white-space:nowrap;font-size:14px;padding:6px 9px}
.dexh{grid-column:1/-1;text-align:left;font-size:17px;margin-top:8px;padding:4px 10px;background:#fff1e6;border-radius:10px}.dexh span{font-size:14px;opacity:.7}
.cell .star{font-size:11px;color:#f2a100;letter-spacing:-1px}.cell.no{opacity:.45}.cell .sub{font-size:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="pill"><span id="lv">Lv.1</span> <span id="hudName">다다</span> 💗 <div class="bar"><i id="happy"></i></div></div>
  <div class="right">
    <button class="pill hidden" id="festPill" style="pointer-events:auto;font-family:inherit"></button>
    <div class="pill">⭐ <span id="stars">0</span></div>
    <div class="pill">💰 <span id="coins">0</span></div>
  </div>
</div>
<div class="menu hidden" id="menu">
  <button class="btn" id="bagBtn">🎒 가방</button>
  <button class="btn" id="dexBtn">📖 도감</button>
  <button class="btn" id="setBtn">⚙️ 설정</button>
</div>
<div id="hint" class="off"></div>
<div id="gamebar" class="hidden"><span id="gbText"></span><button class="sm" id="gbStop">그만</button></div>

<div id="settings" class="modal hidden">
  <div class="panel">
    <h2>⚙️ 설정</h2>
    <button class="big main" id="sleepBtn">😴 재우기</button>
    <button class="big" id="editBtn">✏️ 꾸미기</button>
    <button class="big" id="musicBtn">🎵 음악 켜짐</button>
    <button class="big" id="sfxBtn">🔊 효과음 켜짐</button>
    <button class="big" id="ctrlBtn">🕹️ 조이스틱 모드</button>
    <button class="big" id="festBtn">🎉 축제</button>
    <button class="big" id="swBtn">👥 플레이어 바꾸기</button>
    <button class="big" id="closeSet">닫기</button>
  </div>
</div>

<canvas id="mini" class="hidden"></canvas>
<button id="act" class="hidden"><span class="ae">✋</span><span class="al"></span></button>
<div id="modal" class="modal hidden"><div class="panel wide"><h2 id="mTitle"></h2><div id="mBody" class="mbody"></div><button class="big" onclick="closeModal()">닫기</button></div></div>

<div id="who" class="hidden"><div class="whobox"><h1>누가 놀까요? 🐾</h1><div id="whoList" class="wholist"></div></div></div>
<div id="creator">
  <div class="cwrap">
    <div class="preview">
      <h1>🐾 나만의 친구 만들기</h1>
      <canvas id="pv"></canvas>
      <input id="name" maxlength="8" placeholder="이름을 지어주세요">
      <button class="go" id="goBtn">이 친구로 시작하기!</button>
      <button class="btn hidden" id="creatorBack">↩ 돌아가기</button>
    </div>
    <div id="opts"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const SAVE='animalVillage_v1';
const OPTS={
  species:[['cat','🐱 고양이'],['dog','🐶 강아지']],
  fur:[['#f6b26b','치즈'],['#fff4e2','하양'],['#9a7253','갈색'],['#5a5250','까망'],['#c8c8c8','회색'],['#ffc6d9','분홍'],['#bfe3ff','하늘']],
  eye:[['round','동글'],['sparkle','반짝'],['smile','웃음'],['star','별'],['sleepy','졸린']],
  nose:[['triangle','세모'],['round','동글'],['heart','하트']],
  outfit:[['#ff8fa3','분홍'],['#ffd166','노랑'],['#7cc8a4','초록'],['#6fa8ff','파랑'],['#b79cff','보라'],['#ff9f68','주황'],['#ffffff','하양']]
};
let state={name:'다다',char:{species:'cat',fur:'#f6b26b',eye:'sparkle',nose:'triangle',outfit:'#ff8fa3'},stars:0,coins:0,happy:0,sleeping:false,bag:{},tools:{},req:{},dex:{},xp:0,wear:{},planted:[]};
const DEFAULT_STATE=JSON.stringify(state);

/* ---------- 그리기 도구 ---------- */
const TAU=Math.PI*2;
function shade(hex,p){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v+v*p:v+(255-v)*p)));return `rgb(${f(r)},${f(g)},${f(b)})`}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circ(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function ell(ctx,x,y,a,b,rot){ctx.beginPath();ctx.ellipse(x,y,a,b,rot||0,0,TAU);ctx.fill()}
function star(ctx,x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fill()}
function heart(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.6,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.fill()}

/* ---------- 캐릭터 (머리 크고 동글동글) ---------- */
function drawChar(ctx,x,y,s,c,t,dir,walking,blink,sleeping,boots){
  const fur=c.fur,dark=shade(fur,-.18),line='rgba(90,60,45,.32)';
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.15)';ell(ctx,0,0,20*s,6*s);
  const bob=sleeping?Math.sin(t*1.6)*1.2:walking?Math.abs(Math.sin(t*12))*3:Math.sin(t*2.5)*.8;
  ctx.scale(s*dir,s);ctx.translate(0,-bob);if(sleeping)ctx.rotate(-.07);
  ctx.lineWidth=2;ctx.strokeStyle=line;ctx.lineJoin='round';ctx.lineCap='round';
  // 꼬리
  if(c.species==='cat'){ctx.strokeStyle=fur;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-9,-12);ctx.quadraticCurveTo(-27,-12,-25,-32+Math.sin(t*3)*3);ctx.stroke();ctx.strokeStyle=line;ctx.lineWidth=2}
  else if(c.species==='fox'){ctx.save();ctx.translate(-12,-14);ctx.rotate(-.9+Math.sin(t*(walking?10:3))*.2);ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(-10,0,15,8,0,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-21,0,5,5.5,0,0,TAU);ctx.fill();ctx.restore()}
  else if(['rabbit','bear','panda'].includes(c.species)){ctx.fillStyle=c.species==='panda'?'#2e2a28':c.species==='rabbit'?'#fff':fur;circ(ctx,-13,-12,c.species==='rabbit'?6.5:5);ctx.stroke()}
  else{ctx.save();ctx.translate(-12,-16);ctx.rotate(-.6+Math.sin(t*(walking?14:6))*.35);ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(-6,0,9,5.5,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore()}
  // 발
  const step=walking?Math.sin(t*12)*3:0;ctx.fillStyle=boots?'#ffcc33':c.species==='panda'?'#2e2a28':fur;
  [[-7,step],[7,-step]].forEach(([fx,o])=>{ctx.beginPath();ctx.ellipse(fx,-3+Math.min(0,o)-(boots?2:0),7,boots?7:5,0,0,TAU);ctx.fill();ctx.stroke()});
  // 몸(옷)
  ctx.fillStyle=c.outfit;rr(ctx,-13,-28,26,24,11);ctx.fill();ctx.stroke();
  {const w0=c.wear||{};if(w0.stripe||w0.dots||w0.starshirt){ctx.save();rr(ctx,-13,-28,26,24,11);ctx.clip();
    if(w0.stripe){ctx.fillStyle='rgba(255,255,255,.65)';for(let i=0;i<4;i++)ctx.fillRect(-14,-26+i*6,28,2.6)}
    if(w0.dots){ctx.fillStyle='rgba(255,255,255,.75)';[[-7,-22],[3,-24],[8,-15],[-3,-13],[-9,-9],[6,-7]].forEach(([a,b])=>circ(ctx,a,b,2))}
    if(w0.starshirt){ctx.fillStyle='#ffd166';[[-6,-21],[6,-19],[-1,-10]].forEach(([a,b])=>star(ctx,a,b,3.6))}
    ctx.restore()}}
  ctx.fillStyle=c.outfit==='#ffffff'?'#ff9fb5':'rgba(255,255,255,.85)';heart(ctx,0,-15,2.8);
  // 팔
  ctx.fillStyle=c.species==='panda'?'#2e2a28':fur;[[-13,step*.6],[13,-step*.6]].forEach(([ax,o])=>{ctx.beginPath();ctx.arc(ax,-18+o,5.5,0,TAU);ctx.fill();ctx.stroke()});
  // 고양이 귀
  if(c.species==='cat'){[-1,1].forEach(k=>{ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(k*10,-70);ctx.lineTo(k*25,-90);ctx.lineTo(k*29,-56);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffb3c4';ctx.beginPath();ctx.moveTo(k*14,-69);ctx.lineTo(k*23.5,-84);ctx.lineTo(k*25.5,-62);ctx.closePath();ctx.fill()})}
  if(c.species==='fox'){[-1,1].forEach(k=>{ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(k*8,-68);ctx.lineTo(k*27,-96);ctx.lineTo(k*31,-56);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(k*14,-68);ctx.lineTo(k*24.5,-86);ctx.lineTo(k*27,-62);ctx.closePath();ctx.fill();ctx.fillStyle='#4a3b32';ctx.beginPath();ctx.moveTo(k*22.5,-89);ctx.lineTo(k*27,-96);ctx.lineTo(k*28.5,-85);ctx.closePath();ctx.fill()})}
  if(c.species==='rabbit'){[-1,1].forEach(k=>{ctx.save();ctx.translate(k*11,-72);ctx.rotate(k*.14+Math.sin(t*2+k)*.04);ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,-18,8,22,0,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#ffb3c4';ctx.beginPath();ctx.ellipse(0,-17,4,15,0,0,TAU);ctx.fill();ctx.restore()})}
  if(c.species==='bear'||c.species==='panda'){[-1,1].forEach(k=>{ctx.fillStyle=c.species==='panda'?'#2e2a28':fur;circ(ctx,k*22,-69,10.5);ctx.stroke();ctx.fillStyle=c.species==='panda'?'#4a4442':dark;circ(ctx,k*22,-69,5)})}
  // 머리
  ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,-50,29,26,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';ell(ctx,-11,-66,8,4,-.3);
  // 강아지 귀
  if(c.species==='dog'){[-1,1].forEach(k=>{ctx.save();ctx.translate(k*25,-62);ctx.rotate(k*.3);ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(0,9,9,16,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore()})}
  // 머리 한 가닥
  ctx.strokeStyle=dark;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(3,-80,4,Math.PI*.9,Math.PI*2.1);ctx.stroke();
  // 볼·주둥이
  ctx.fillStyle='rgba(255,120,150,.5)';ell(ctx,-18,-39,5.5,3.3);ell(ctx,21,-39,5.5,3.3);
  ctx.fillStyle='rgba(255,255,255,.5)';ell(ctx,1.5,-37,10,7);
  // 눈
  if(c.species==='panda'){ctx.fillStyle='#2e2a28';ell(ctx,-9,-45,8,9.5,.4);ell(ctx,12,-45,8,9.5,-.4)}
  if(c.species==='fox'){ctx.fillStyle='rgba(255,255,255,.9)';ell(ctx,1.5,-36,14,9.5)}
  if(c.species==='bear'){ctx.fillStyle=shade(fur,.4);ell(ctx,1.5,-37,12,8.5)}
  const ey=-46,closed=sleeping||(blink&&['round','sparkle','star'].includes(c.eye));
  ctx.fillStyle='#2e2420';ctx.strokeStyle='#2e2420';ctx.lineWidth=2.4;
  [-9,12].forEach(e=>{
    if(closed||c.eye==='sleepy'){ctx.beginPath();ctx.arc(e,ey-2,4.5,Math.PI*.15,Math.PI*.85);ctx.stroke();return}
    switch(c.eye){
      case 'round':ell(ctx,e,ey,4.8,5.6);ctx.fillStyle='#fff';circ(ctx,e+1.6,ey-2,1.8);circ(ctx,e-1.5,ey+2,.8);ctx.fillStyle='#2e2420';break;
      case 'sparkle':ell(ctx,e,ey,6.2,7);ctx.fillStyle='#fff';circ(ctx,e+2,ey-2.5,2.6);circ(ctx,e-2,ey+2.5,1.2);ctx.fillStyle='#2e2420';break;
      case 'smile':ctx.beginPath();ctx.arc(e,ey+2.5,4.5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();break;
      case 'star':ctx.fillStyle='#f7a400';star(ctx,e,ey,6.5);ctx.fillStyle='#fff';circ(ctx,e+1.5,ey-1.5,1.2);ctx.fillStyle='#2e2420';break;
    }
  });
  // 코
  const nx=1.5,ny=-40;
  ctx.fillStyle=c.nose==='heart'?'#ff6b8a':(c.species==='cat'||c.species==='rabbit'?'#ff8fa3':'#3a2a26');
  if(c.nose==='triangle'){ctx.beginPath();ctx.moveTo(nx-3,ny-1.8);ctx.lineTo(nx+3,ny-1.8);ctx.lineTo(nx,ny+1.8);ctx.closePath();ctx.fill()}
  else if(c.nose==='round'){ell(ctx,nx,ny,3.2,2.5)}
  else heart(ctx,nx,ny,3);
  // 입 ω
  ctx.strokeStyle='#3a2a26';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(nx-2.4,ny+2.6,2.4,.1,Math.PI-.1);ctx.stroke();
  ctx.beginPath();ctx.arc(nx+2.4,ny+2.6,2.4,.1,Math.PI-.1);ctx.stroke();

function segD(px,py,a,b,c,d){const dx=c-a,dy=d-b,l=dx*dx+dy*dy;let t=l?((px-a)*dx+(py-b)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a-dx*t,py-b-dy*t)}
const nearRoad=(x,y,p)=>roads.some(r=>r.pts.some((q,i)=>i<r.pts.length-1&&segD(x,y,q[0],q[1],r.pts[i+1][0],r.pts[i+1][1])<r.w/2+p));
function sample(pts,step,fn){let carry=0;for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1],L=Math.hypot(c-a,d-b);let t=carry;while(t<L){fn(a+(c-a)*t/L,b+(d-b)*t/L,(c-a)/L,(d-b)/L);t+=step}carry=t-L}}

  else sample(r.pts,30,(x,y,dx,dy)=>{
    if(Math.abs(x-riverX(y))<75||onDirt(x,y)||inPlaza(x,y))return;
    [-1,1].forEach(k=>{const o=k*10+(R()-.5)*5;stones.push({x:x-dy*o+(R()-.5)*4,y:y+dx*o,a:12+R()*4,b:9+R()*3,rot:R()*3,warm:r.t==='flower'})});
    if(r.t==='flower')[-1,1].forEach(k=>{const o=k*(r.w/2+12),fx=x-dy*o,fy=y+dx*o;if(!onDirt(fx,fy))pathFlowers.push({x:fx,y:fy,c:FC[Math.floor(R()*5)]})});
  });
});

// 나무 (크게!)
const trees=[];
function okSpot(x,y,gap){
  if(y>coast(x)-40)return false;
  if(nearRoad(x,y,45))return false;
  if(Math.abs(x-riverX(y))<95)return false;
  if(x>plaza.x-60&&x<plaza.x+plaza.w+60&&y>plaza.y-40&&y<plaza.y+plaza.h+90)return false;
  if(Math.abs(x-tent.x)<170&&y>tent.y-170&&y<tent.y+90)return false;
  if(Math.abs(x-shop.x)<150&&y>shop.y-170&&y<shop.y+90)return false;
  if(Math.hypot(x-bench.x,y-bench.y)<170)return false;
  if(SEATS.some(b=>Math.hypot(x-b.x,y-b.y)<110))return false;
  if(ALLH.some(h=>(Math.abs(x-h.x)<160&&y>h.y-180&&y<h.y+90)||segD(x,y,h.hx,h.hy,h.x,h.y+26)<70))return false;
  if(pondK(x,y,1.5)<1)return false;
  if(lots.some(l=>Math.hypot(l.x-x,l.y-y)<150))return false;
  if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<gap))return false;
  return true;
}
for(let i=0;i<6000&&trees.length<120;i++){
  const x=40+R()*(W0-80),y=140+R()*(H-140);if(!okSpot(x,y,100))continue;
  if(R()<.3)trees.push({k:'pine',x,y});
  else{const g=['#5fb36a','#4fa35e','#6cc27a'][Math.floor(R()*3)];trees.push({k:'round',x,y,c1:g,c2:shade(g,.25),fruit:R()<.35?['#ff5a5a','#ffa94d','#ff9fb5'][Math.floor(R()*3)]:null})}
}

  const x=40+R()*(W0-80),top=coast(x)+25,bot=Math.min(mudTop(x),seaY(x))-35;if(bot-top<20)continue;
  const y=top+R()*(bot-top);
  if(Math.abs(x-riverX(y))<90||(x>pier.x-70&&x<pier.x+pier.w+70)||nearRoad(x,y,30))continue;
  if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<110))continue;
  trees.push({k:'palm',x,y});palms++;
}

for(let i=0;i<700;i++){const x=R()*W0,y=R()*H;if(y<coast(x)-5)tufts.push({x,y})}
for(let i=0;i<400&&shells.length<60;i++){const x=R()*W0,y=coast(x)+15+R()*150;if(onSand(x,y+10)&&Math.abs(x-riverX(y))>50)shells.push({x,y,s:R()<.2,c:['#ffe1d6','#fff3e0','#ffd1dc'][Math.floor(R()*3)]})}
for(let i=0;i<600;i++){const x=1750+R()*(W0-1770),y=mudTop(x)+10+R()*190;if(onMud(x,y)&&y<seaY(x)-10){if(holes.length<90)holes.push({x,y});else if(puddles.length<14)puddles.push({x,y,a:14+R()*16})}}
trees.forEach(t=>{t.has=true});
for(let i=0;i<1500&&crabs.length<24;i++){const x=1850+R()*(W0-1950),y=mudTop(x)+30+R()*140;if(onMud(x,y)&&y<seaY(x)-25)crabs.push({x0:x,y,r:20+R()*30,ph:R()*6})}

/* ---------- 충돌 ---------- */
function blocked(x,y,me,quiet){
  if(x<XMIN+20||y<YMIN+40||x>W-20||y>H-10)return true;
  if(extraBlocked(x,y))return true;
  const onPier=x>pier.x+6&&x<pier.x+pier.w-6&&y>pier.y-10&&y<pier.y+pier.h;
  if(!onPier&&y>seaY(x)-4&&!(me&&swimOK()&&y<H-15)){if(me&&!quiet&&lvl()>=DIVE_LV&&time>mudWarnAt){mudWarnAt=time+3;toast('🤿 잠수복·스노클·오리발이 있어야 바다에 들어갈 수 있어요!')}return true}
  if(onMud(x,y)&&!(me&&state.tools.boots&&state.tools.suit)){if(me&&!quiet&&time>mudWarnAt){mudWarnAt=time+3;toast('👢 갯벌장화와 🦺 갯벌옷이 있어야 들어갈 수 있어요! (잡화점)')}return true}
  if(Math.abs(x-shop.x)<78&&y>shop.y-48&&y<shop.y+4)return true;
  if(Math.abs(x-bench.x+10)<50&&y>bench.y-24&&y<bench.y+4)return true;
  if(Math.hypot(x-bench.x-62,(y-bench.y+8)*1.3)<18)return true;
  for(const b of (window.BUILT_RECTS||[]))if(Math.abs(x-b.x)<b.w&&y>b.y-50&&y<b.y+4)return true;
  for(const b of SEATS)if(Math.abs(x-b.x)<38&&y>b.y-16&&y<b.y+3)return true;
  for(const h of HOUSES)if(Math.abs(x-h.x)<78&&y>h.y-48&&y<h.y+4)return true;
  if(Math.abs(x-riverX(y))<40&&y<seaY(x)-4&&!bridges.some(b=>Math.abs(y-b.y)<50))return true;
  if(((x-pond.x)/(pond.rx+8))**2+((y-pond.y)/(pond.ry+8))**2<1)return true;
  if(Math.abs(x-tent.x)<78&&y>tent.y-42&&y<tent.y+4)return true;
  if(Math.hypot(x-fire.x,(y-fire.y)*1.4)<22)return true;
  if(((x-fountain.x)/54)**2+((y-fountain.y)/30)**2<1)return true;
  for(const t of trees){if(!grown(t))continue;const r=t.k==='palm'?16:30;if((x-t.x)**2+((y-t.y)*1.6)**2<r*r)return true}
  for(const l of lots)if((x-l.x)**2+(y-l.y)**2<256)return true;
  return false;
}

function waterType(x,y){
  if(pondK(x,y,1)<.95)return'pond';
  if(Math.abs(x-riverX(y))<34&&!bridges.some(b=>Math.abs(y-b.y)<60))return'river';
  if(y>seaY(x)+6&&!(x>pier.x&&x<pier.x+pier.w&&y<pier.y+pier.h))return'sea';
  return null;
}

function findWater(){let best=null;for(let i=0;i<16;i++){const a=i/16*TAU;for(const r of [55,85]){const x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r,w=waterType(x,y);if(w){const s=r-Math.cos(a)*P.dir*25;if(!best||s<best.s)best={x,y,wt:w,s};break}}}return best}

function spawnPickup(){for(let i=0;i<30;i++){const x=XMIN+60+Math.random()*(W-XMIN-120),y=YMIN+80+Math.random()*(H-YMIN-280);if(y>coast(x)-20||blocked(x,y)||Math.abs(x-riverX(y))<60)continue;const r=Math.random();pickups.push({k:FEST&&FEST.id==='spring'&&Math.random()<.35?'petal':r<.28?'branch':r<.4?'stone':'weed',x,y});return}}

function spawnBug(){
  const ks=['butterfly','butterfly','bee','ladybug','hopper','beetle'],k=ks[Math.floor(Math.random()*ks.length)];
  if(k==='beetle'){const c=trees.filter(t=>t.k==='round'&&grown(t)&&Math.hypot(t.x-P.x,t.y-P.y)<900&&!bugs.some(b=>b.tree===t));if(c.length){const t=c[Math.floor(Math.random()*c.length)];bugs.push({k,tree:t,hx:t.x,hy:t.y+1,ph:0})}return}
  for(let i=0;i<20;i++){const x=P.x+(Math.random()-.5)*1500,y=P.y+(Math.random()-.5)*1100;if(x<40||x>W-40||y<100||y>coast(x)-30||waterType(x,y)||Math.hypot(x-P.x,y-P.y)<300)continue;bugs.push({k,hx:x,hy:y,ph:Math.random()*6,c:['#ffb3c4','#ffe680','#bfe3ff','#c8b6ff','#fff'][Math.floor(Math.random()*5)]});return}
}
function moveBugs(){
  for(let i=bugs.length-1;i>=0;i--){const b=bugs[i],p=b.ph;if(Math.hypot(b.hx-P.x,b.hy-P.y)>1300){bugs.splice(i,1);continue}
    b.alt=0;
    if(b.k==='butterfly'||b.k==='bee'){b.x=b.hx+Math.sin(time*.6+p)*60;b.y=b.hy+Math.cos(time*.8+p)*30;b.alt=28+Math.sin(time*2+p)*6}
    else if(b.k==='ladybug'){b.x=b.hx+Math.sin(time*.25+p)*25;b.y=b.hy}
    else if(b.k==='hopper'){b.x=b.hx+Math.sin(time*.3+p)*45;b.y=b.hy;b.alt=Math.abs(Math.sin(time*3+p))*14}
    else{b.x=b.hx;b.y=b.hy}}
  if(bugs.length<8)spawnBug();
}

/* ---------- 심기 ---------- */
function canPlant(x,y,gap){return y<coast(x)-40&&!waterType(x,y)&&Math.abs(x-riverX(y))>60&&!nearRoad(x,y,8)&&!blocked(x,y)&&!trees.some(t=>Math.hypot(t.x-x,t.y-y)<gap)&&!(x>plaza.x-20&&x<plaza.x+plaza.w+20&&y>plaza.y-20&&y<plaza.y+plaza.h+20)}
function makeTree(x,y,fruit,t0){const g=['#5fb36a','#4fa35e','#6cc27a'][Math.floor(Math.random()*3)];return{k:'round',x,y,c1:g,c2:shade(g,.25),fruit,has:true,t0}}
function applyPlanted(){state.planted=state.planted||[];state.planted.forEach(p=>{if(p.k==='f')flowers.push({x:p.x,y:p.y,c:p.c});else trees.push(makeTree(p.x,p.y,p.fruit,p.t0))})}
function plantFlower(){const x=P.x,y=P.y+4;if(!canPlant(x,y,25)){toast('여기에는 심을 수 없어요. 풀밭에서 해봐요!');closeModal();return}take('seed');const c=FC[Math.floor(Math.random()*5)];flowers.push({x,y,c});state.planted.push({k:'f',x,y,c});save();addXP(1);toast('🌱 꽃을 심었어요!');closeModal()}
function plantTree(){const x=P.x+P.dir*55,y=P.y;if(!canPlant(x,y,95)){toast('여기에는 나무를 심을 수 없어요. 넓은 풀밭에서 해봐요!');closeModal();return}take('sapling');const fruit=Object.keys(FRUITC)[Math.floor(Math.random()*5)],t0=Date.now();trees.push(makeTree(x,y,fruit,t0));state.planted.push({k:'t',x,y,fruit,t0});save();addXP(3);toast('🌳 나무를 심었어요! 3분 뒤면 다 자라요');closeModal()}

function shakeTree(t){
  t.shake=time;Snd.sfx('rustle');
  if(!grown(t)){toast('🌱 아직 자라는 중이에요!');return}
  if(t.k==='palm'){if(t.has){t.has=false;t.regrow=time+120;gain('coconut',1,'🥥 코코넛이 툭 떨어졌어요!');addHappy(2)}else toast('코코넛이 다시 열릴 때까지 기다려요');return}
  if(t.fruit&&t.has){const id=FRUITC[t.fruit];t.has=false;t.regrow=time+90;add(id,2);gain(id,1,`${IT[id].e} ${IT[id].n} 3개가 떨어졌어요!`);addHappy(2);return}
  if(time>=(t.cd||0)){t.cd=time+20;if(Math.random()<.65)gain('branch',1,'🪵 나뭇가지가 떨어졌어요!');else toast('아무것도 안 떨어졌어요')}else toast('조금 있다가 다시 흔들어 봐요');
}
function reelIn(){let tb=FISH[fishing.wt],b='';const bt=bag('bait')>0?'bait':bag('lugworm')>0?'lugworm':null;if(bt){take(bt);tb=tb.map(([k,w],i)=>[k,i>1?w*3:w]);b=' 🪱미끼 효과!'}const id=pick(tb);fishing=null;const cm=fishSize(id),big=cm>=IT[id].sz[1]*.85;gain(id,1,`🎣 ${IT[id].e} ${IT[id].n} ${cm}cm${big?' 🏆 대물!':''} 낚았어요!${b}`);addHappy(4)}
function lightFire(){if(bag('branch')<3){toast('🪵 나뭇가지 3개가 있어야 불을 피울 수 있어요!');return}take('branch',3);fireUntil=time+180;Snd.sfx('fire');toast('🔥 활활! 이제 구워 먹을 수 있어요')}
function findAction(){
  if(scene!=='village')return roomAction();
  if(state.sleeping)return null;
  if(play)return playAction();
  if(P.sit)return{e:'🧍',l:'일어나기',f:standUp};
  const near=(a,b,r)=>Math.hypot(P.x-a,P.y-b)<r;
  if(fishing)return fishing.phase==='bite'?{e:'❗',l:'지금!',pulse:1,f:reelIn}:{e:'🎣',l:'기다려요…',f:()=>{fishing=null;toast('너무 빨라요! 물고기가 도망갔어요 💦')}};
  if(clam&&clam.phase==='pop')return{e:'🐚',l:'잡기!',pulse:1,f:()=>{clam=null;gain('razor',1,'🐚 맛조개를 쏙 뽑았어요!');addHappy(4)}};
  if(isSwim()){const d=dives.find(d=>near(d.x+Math.sin(time*.5+d.ph)*12,d.y,55));return d?{e:'🤿',l:'잠수하기',f:()=>{const id=pick(DEEP);Object.assign(d,newDive());gain(id,1,`🤿 보글보글… ${IT[id].e} ${josa(IT[id].n,'을','를')} 찾았어요!`);addHappy(5)}}:null}
  if(near(tent.x,tent.y+18,48))return{e:'⛺',l:'들어가기',f:()=>enterRoom('tent')};
  if(near(shop.x,shop.y+18,55))return{e:'🚪',l:'들어가기',f:()=>enterRoom('shop')};
  const hh=HOUSES.find(h=>near(h.x,h.y+18,50));
  if(hh)return{e:'🏠',l:'들어가기',f:()=>enterRoom('house',hh.id)};
  for(const n of NPCS)if(outside(n)&&near(n.x,n.y,60))return{e:'💬',l:'말 걸기',f:()=>talk(n)};
  const st=SEATS.find(b=>near(b.x,b.y+18,45));

  const tr=trees.find(t=>near(t.x,t.y+10,t.k==='palm'?55:70));

  const fl=flowers.find(f=>Math.abs(f.x-P.x)<22&&Math.abs(f.y-P.y)<18);
  if(fl){const id=FLW[fl.c];return{e:IT[id].e,l:'꽃 꺾기',f:()=>{flowers.splice(flowers.indexOf(fl),1);state.planted=state.planted.filter(p=>!(p.k==='f'&&p.x===fl.x&&p.y===fl.y));gain(id,1)}}}
  return null;
}

const modalOpen=()=>!$('#modal').classList.contains('hidden')||!$('#settings').classList.contains('hidden');

function update(dt){
  const modal=modalOpen();
  let vx=0,vy=0;
  if(!state.sleeping&&!modal){
    if(keys.arrowleft||keys.a)vx-=1;if(keys.arrowright||keys.d)vx+=1;
    if(keys.arrowup||keys.w)vy-=1;if(keys.arrowdown||keys.s)vy+=1;
    if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){const m=Math.min(d,55)/55;vx=dx/d*m;vy=dy/d*m}}
    else if(tgt){if(tgt.path&&tgt.path.length>1&&Math.hypot(tgt.path[0][0]-P.x,tgt.path[0][1]-P.y)<12)tgt.path.shift();const p=tgt.path&&tgt.path.length?tgt.path[0]:[tgt.x,tgt.y],dx=p[0]-P.x,dy=p[1]-P.y,d=Math.hypot(dx,dy);if(d>6){vx=dx/d;vy=dy/d}else if(!tgt.path||tgt.path.length<=1)tgt=null}
  }
  if(play&&play.phase==='count'&&play.role==='seek'){vx=0;vy=0}
  const mag=Math.hypot(vx,vy);if(mag>1){vx/=mag;vy/=mag}
  P.walking=mag>.05&&!P.sit;if(vx>.25)P.dir=1;else if(vx<-.25)P.dir=-1;
  if(fishing&&mag>.1){fishing=null;toast('낚시를 그만뒀어요')}
  if(P.sit&&mag>.1)standUp();
  const B=scene==='village'?blocked:roomBlocked;
  if(!P.sit){const sp=isSwim()?150:onMud(P.x,P.y)?120:200;moveP(vx,vy,sp,dt,B)}
  if(tgt&&!tgt.hold){const mv=Math.hypot(P.x-(update.lx||0),P.y-(update.ly||0));tgt.stuck=mv<.5?tgt.stuck+dt:0;if(tgt.stuck>.35){if(!tgt.re){tgt.re=1;tgt.stuck=0;tgt.path=findPath(P.x,P.y,tgt.x,tgt.y)}else tgt=null}}update.lx=P.x;update.ly=P.y;
  if(scene!=='village'&&P.y>ROOMS[scene].h-24&&Math.abs(P.x-ROOMS[scene].w/2)<45)exitRoom();
  if(fishing){if(fishing.phase==='wait'&&time>fishing.t){fishing.phase='bite';fishing.t=time+1;Snd.sfx('bite')}else if(fishing.phase==='bite'&&time>fishing.t){fishing=null;Snd.sfx('fail');toast('앗, 놓쳤어요… 🐟💨')}}
  if(clam){if(clam.phase==='salt'&&time>clam.t){clam.phase='pop';clam.t=time+1.4;Snd.sfx('bite');toast('🐚 맛조개가 쏙! 얼른 잡아요!',1.4)}else if(clam.phase==='pop'&&time>clam.t){clam=null;toast('맛조개가 다시 들어갔어요 💦')}}
  trees.forEach(t=>{if(!t.has&&time>t.regrow)t.has=true});
  if(pickups.length<75&&time>nextSpawn){spawnPickup();nextSpawn=time+3}
  moveBugs();mudTick(dt);mud3Tick(dt);if(!modal)NPCS.forEach(n=>{if(!play||play.npc!==n)moveNPC(n,dt)});if(play&&!modal)playTick(dt);
  const a=modal?null:findAction();curAct=a;
  const key=a?a.e+a.l+(a.pulse?1:0):'';
  if(key!==lastActKey){lastActKey=key;const el=$('#act');if(a){el.querySelector('.ae').textContent=a.e;el.querySelector('.al').textContent=a.l;el.classList.toggle('pulse',!!a.pulse);el.classList.remove('hidden')}else el.classList.add('hidden')}
  const near=(x,y,r)=>Math.hypot(P.x-x,P.y-y)<r;
  const nearH=scene==='village'?HOUSES.find(q=>near(q.x,q.y+10,85)):null;
  let h='';
  if(time<toastUntil)h=toastMsg;
  else if(state.sleeping)h='💤 쿨쿨… 설정에서 깨우기를 누르면 일어나요';
  else if(time<wakeUntil)h='☀️ 잘 잤다! 오늘도 신나게 놀자!';
  else if(scene!=='village'){if(time<roomHintUntil)h=roomHint}
  else if(isSwim())h='🤿 그림자가 보이는 곳에서 잠수해 봐요!';
  else if(near(tent.x,tent.y+10,75))h=state.home?`🏠 ${state.name}의 집이에요`:`⛺ ${state.name}의 텐트예요`;
  else if(nearH)h=houseStatus(nearH);
  else if(lots.some(l=>!lotBuilt(l)&&near(l.x,l.y,90)))h='🚧 별을 모아서 마을 주인 도담에게 건물을 지어 달라고 해요!';
  else if(time<introUntil)h='👆 화면을 끌면 움직이고, 오른쪽 아래 버튼으로 행동해요!';
  if(h!==lastHint){lastHint=h;const el=$('#hint');if(h){el.textContent=h;el.classList.remove('off')}else el.classList.add('off')}
}

const Snd=(()=>{
  let ac=null,musicG,sfxG,cur=null,nextT=0,step=0;
  const midi=n=>440*Math.pow(2,(n-69)/12);
  const CH={C:[48,[60,64,67]],G:[43,[55,59,62]],Am:[45,[57,60,64]],F:[41,[53,57,60]],Em:[40,[52,55,59]],Dm:[38,[50,53,57]]};
  const MEL=[76,-1,79,-1,84,-1,79,-1, 74,-1,71,-1,74,79,-1,-1, 72,-1,76,-1,81,-1,79,76, 77,-1,-1,76,74,-1,72,-1,
             76,79,84,79,76,-1,72,-1, 77,-1,81,-1,84,-1,81,-1, 79,-1,77,76,74,-1,71,-1, 72,-1,-1,-1,0,0,0,0];
  const MEL2=[72,-1,74,76,-1,-1,79,-1, 76,-1,74,-1,72,-1,-1,-1, 69,-1,72,76,-1,-1,74,72, 74,-1,-1,-1,0,0,0,0,
              72,-1,74,76,-1,-1,79,-1, 81,-1,79,-1,77,-1,76,-1, 74,-1,77,-1,76,-1,74,-1, 72,-1,-1,-1,0,0,0,0];
  const TR={
    village:{bpm:112,bars:['C','G','Am','F','C','F','G','C','C','Em','Am','G','C','F','G','C'],mel:[...MEL,...MEL2],oct:0,melType:'triangle',melVol:.12,bassVol:.13,pluck:.035},
    room:{bpm:88,bars:['C','G','Am','F','C','F','G','C'],mel:MEL2,oct:12,melType:'sine',melVol:.07,bassVol:.08},
    night:{bpm:64,bars:['C','Am','F','G','C','Am','Dm','G'],arp:[0,1,2,3,2,1,2,1],oct:12,bassVol:.06,arpVol:.05}
  };
  function tone(t,f,d,type,vol,dest,att){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
  function noise(t,d,vol,freq){const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(sfxG);s.start(t)}
  function playStep(T,s,t,sp){
    const bi=Math.floor(s/8)%T.bars.length,i=s%8,[bass,tri]=CH[T.bars[bi]];
    if(i===0||i===4)tone(t,midi(bass),sp*3.6,'sine',T.bassVol,musicG,.02);
    if(T.pluck&&(i===2||i===6))tri.forEach(n=>tone(t,midi(n),sp*1.3,'triangle',T.pluck,musicG));
    if(T.mel){const m=T.mel[s%T.mel.length];if(m>0){let len=1;while(T.mel[(s+len)%T.mel.length]===-1)len++;tone(t,midi(m+T.oct),sp*len+.3,T.melType,T.melVol,musicG)}}
    if(T.arp){const k=T.arp[i],n=k<3?tri[k]:tri[0]+12;tone(t,midi(n+T.oct),sp*3,'sine',T.arpVol,musicG,.03)}
  }
  function tick(){
    if(!ac||!cur||ac.state!=='running')return;const T=TR[cur],sp=60/T.bpm/2,len=T.bars.length*8;
    if(nextT<ac.currentTime)nextT=ac.currentTime+.05;
    while(nextT<ac.currentTime+.2){playStep(T,step,nextT,sp);nextT+=sp;step=(step+1)%len}
  }
  function apply(){if(!ac)return;musicG.gain.setTargetAtTime(state.music===false?0:.55,ac.currentTime,.1);sfxG.gain.setTargetAtTime(state.sfx===false?0:.8,ac.currentTime,.05)}
  function unlock(){
    try{if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();musicG=ac.createGain();sfxG=ac.createGain();musicG.gain.value=0;sfxG.gain.value=0;musicG.connect(ac.destination);sfxG.connect(ac.destination);setInterval(tick,50);apply()}
      if(ac.state==='suspended')ac.resume()}catch(e){}
  }
  const FX={
    pick:t=>{tone(t,midi(84),.12,'triangle',.25,sfxG);tone(t+.07,midi(88),.15,'triangle',.25,sfxG)},
    catch:t=>[72,76,79,84].forEach((n,i)=>tone(t+i*.07,midi(n+12),.22,'triangle',.22,sfxG)),
    coin:t=>{tone(t,midi(83),.08,'square',.08,sfxG);tone(t+.08,midi(88),.3,'square',.08,sfxG)},
    star:t=>[72,76,79,84,79,84,88].forEach((n,i)=>tone(t+i*.09,midi(n+12),i===6?.6:.2,'triangle',.22,sfxG)),
    bite:t=>{tone(t,midi(91),.07,'square',.07,sfxG);tone(t+.1,midi(91),.07,'square',.07,sfxG)},
    fail:t=>{tone(t,midi(72),.15,'triangle',.2,sfxG);tone(t+.13,midi(67),.3,'triangle',.2,sfxG)},
    door:t=>{tone(t,midi(50),.15,'sine',.35,sfxG);tone(t+.14,midi(45),.2,'sine',.35,sfxG)},
    eat:t=>{tone(t,midi(79),.1,'triangle',.2,sfxG);tone(t+.11,midi(76),.1,'triangle',.2,sfxG);tone(t+.22,midi(81),.15,'triangle',.2,sfxG)},
    pop:t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1100,t+.08);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.15)},
    rustle:t=>noise(t,.35,.5,2500),
    fire:t=>{noise(t,.6,.6,700);tone(t+.1,midi(67),.3,'triangle',.12,sfxG)}
  };
  return{
    unlock,apply,
    track(n){if(!ac||n===cur)return;cur=n;step=0;nextT=ac.currentTime+.15},
    pause(){try{if(ac&&ac.state==='running')ac.suspend()}catch(e){}},
    resume(){try{if(ac)ac.resume()}catch(e){}},
    sfx(n){if(!ac||state.sfx===false||ac.state!=='running')return;try{FX[n](ac.currentTime+.01)}catch(e){}}
  };
})();

function moveTry(n,a,sp,dt,offs,lim){

function playTick(dt){

      if(d<270)moveTry(n,Math.atan2(n.y-P.y,n.x-P.x)+Math.sin(time*2.3+play.ph)*.6,150,dt,[0,.5,-.5,1,-1,1.6,-1.6,2.3,-2.3],650);

  ctx.globalAlpha=1;ctx.fillStyle='#5fb36a';circ(ctx,pond.x+70,pond.y+20,12);circ(ctx,pond.x-90,pond.y+30,10);
  // 강
  if(vx1>1350&&vx0<1700){ctx.fillStyle='#d8c58f';riverPoly(46);ctx.fillStyle='#7cc6f0';riverPoly(36);
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2.5;
    for(let i=0;i<20;i++){const y=YMIN+((time*40+i*150)%(H-YMIN+100))-50;if(!vis(1500,y,60))continue;const x=riverX(y)+((i%3)-1)*14;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+18);ctx.stroke()}}
  // 바다
  fillBelow(x=>seaY(x)-10,'#e6cf98');
  fillBelow(seaY,'#6ec3e8');
  fillBelow(x=>seaY(x)+130,'#4fa9d8');
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.setLineDash([26,40]);
  for(let k=0;k<3;k++){ctx.lineDashOffset=time*18*(k%2?1:-1);strokeF(x=>seaY(x)+30+k*42+4*Math.sin(x/50+time*1.5+k))}
  ctx.setLineDash([]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=5;strokeF(x=>seaY(x)+2+2*Math.sin(time*1.5+x/80));
}
function drawRoads(){
  // 흙길
  ctx.lineCap='round';ctx.lineJoin='round';
  roads.forEach(r=>{if(r.t!=='dirt')return;ctx.strokeStyle='#dcc28a';ctx.lineWidth=r.w+8;strokePts(r.pts)});
  roads.forEach(r=>{if(r.t!=='dirt')return;ctx.strokeStyle='#f1dca7';ctx.lineWidth=r.w;strokePts(r.pts)});
  ctx.fillStyle='#d9bf86';pebbles.forEach(p=>{if(vis(p.x,p.y,10))circ(ctx,p.x,p.y,p.r)});
  // 벽돌 광장
  ctx.save();rr(ctx,plaza.x,plaza.y,plaza.w,plaza.h,26);ctx.fillStyle='#ebbd96';ctx.fill();ctx.clip();
  ctx.strokeStyle='#d6a07a';ctx.lineWidth=2;
  for(let r=0;r*18<plaza.h;r++){const y=plaza.y+r*18;ctx.beginPath();ctx.moveTo(plaza.x,y);ctx.lineTo(plaza.x+plaza.w,y);ctx.stroke();for(let x=plaza.x+(r%2?18:0);x<plaza.x+plaza.w;x+=36){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+18);ctx.stroke()}}
  ctx.restore();ctx.strokeStyle='#d6a07a';ctx.lineWidth=4;rr(ctx,plaza.x,plaza.y,plaza.w,plaza.h,26);ctx.stroke();
  // 돌길·꽃길
  stones.forEach(s=>{if(!vis(s.x,s.y,20))return;ctx.fillStyle=s.warm?'#f3e2c7':'#dcd8cf';ell(ctx,s.x,s.y,s.a,s.b,s.rot);ctx.strokeStyle=s.warm?'#dcc39b':'#bdb8ad';ctx.lineWidth=2;ctx.stroke()});
  pathFlowers.forEach(f=>{if(!vis(f.x,f.y,10))return;ctx.fillStyle='#5fb36a';ell(ctx,f.x,f.y+3,6,3);ctx.fillStyle=f.c;for(let i=0;i<5;i++){const a=i/5*TAU;circ(ctx,f.x+Math.cos(a)*3.5,f.y+Math.sin(a)*3.5,2.8)}ctx.fillStyle='#ffd166';circ(ctx,f.x,f.y,2)});
  // 나무다리
  bridges.forEach(b=>{const x0=riverX(b.y)-70,L=140,h=56;if(!vis(x0+70,b.y,120))return;
    ctx.fillStyle='rgba(0,0,0,.15)';rr(ctx,x0+4,b.y-h+6,L,h*2,10);ctx.fill();
    ctx.fillStyle='#c99a6b';rr(ctx,x0,b.y-h,L,h*2,10);ctx.fill();ctx.strokeStyle='#9c7048';ctx.lineWidth=2;
    for(let i=1;i<9;i++){ctx.beginPath();ctx.moveTo(x0+i*L/9,b.y-h+4);ctx.lineTo(x0+i*L/9,b.y+h-4);ctx.stroke()}
    ctx.fillStyle='#8e6440';rr(ctx,x0-2,b.y-h-6,L+4,9,4);ctx.fill();rr(ctx,x0-2,b.y+h-3,L+4,9,4);ctx.fill();
    [x0,x0+L/2,x0+L].forEach(px=>{ctx.fillStyle='#7a5536';rr(ctx,px-5,b.y-h-14,10,16,3);ctx.fill();rr(ctx,px-5,b.y+h-8,10,16,3);ctx.fill()})});
  // 바다 데크(부두)
  if(vis(pier.x,pier.y+100,150)){ctx.fillStyle='#8e6440';[[pier.x+4,pier.y+90],[pier.x+pier.w-10,pier.y+90],[pier.x+4,pier.y+pier.h-6],[pier.x+pier.w-10,pier.y+pier.h-6]].forEach(([x,y])=>ctx.fillRect(x,y,6,14));
    ctx.fillStyle='#c99a6b';rr(ctx,pier.x,pier.y,pier.w,pier.h,6);ctx.fill();ctx.strokeStyle='#9c7048';ctx.lineWidth=2;for(let y=pier.y+14;y<pier.y+pier.h;y+=14){ctx.beginPath();ctx.moveTo(pier.x+2,y);ctx.lineTo(pier.x+pier.w-2,y);ctx.stroke()}}
  // 공사 부지
  lots.forEach(l=>{if(!vis(l.x,l.y,90))return;ctx.fillStyle='#e2c48f';ell(ctx,l.x,l.y,72,40);ctx.setLineDash([8,8]);ctx.strokeStyle='#c9a66b';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])});
  // 꽃
  flowers.forEach(f=>{if(!vis(f.x,f.y,10))return;ctx.fillStyle=f.c;circ(ctx,f.x,f.y,3.4);ctx.fillStyle='#ffd166';circ(ctx,f.x,f.y,1.4)});
  // 꽃게
  crabs.forEach(drawCrab);
}

/* ---------- 그리기: 물건 ---------- */
function drawTree(t){
  const y=t.y,x=t.x+((time-(t.shake||-9))<.5?Math.sin(time*45)*3:0);
  if(!grown(t)){ctx.fillStyle='#a0714f';ell(ctx,x,y,12,4);ctx.strokeStyle='#6a9a3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-26);ctx.stroke();ctx.fillStyle='#6cc27a';ell(ctx,x-7,y-24,8,4,-.5);ell(ctx,x+7,y-28,8,4,.5);return}
  if(t.k==='palm'){
    ctx.fillStyle='rgba(0,0,0,.12)';ell(ctx,x+10,y,26,7);
    ctx.strokeStyle='#b98a5e';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-4,y-60,x+18,y-112);ctx.stroke();
    ctx.strokeStyle='#9c7048';ctx.lineWidth=2;for(let i=1;i<7;i++){const p=i/7,px=x+(-8*p*(1-p))+18*p*p,py=y-112*p;ctx.beginPath();ctx.moveTo(px-6,py);ctx.lineTo(px+6,py+2);ctx.stroke()}
    ctx.fillStyle='#5cb36a';for(let i=0;i<6;i++){const a=i/6*TAU+.3;ell(ctx,x+18+Math.cos(a)*30,y-114+Math.sin(a)*14,32,10,a)}
    if(t.has){ctx.fillStyle='#7a5536';circ(ctx,x+12,y-106,6);circ(ctx,x+24,y-104,6);circ(ctx,x+18,y-98,6)}return;
  }
  ctx.fillStyle='rgba(0,0,0,.13)';ell(ctx,x,y,40,11);
  if(t.k==='pine'){
    ctx.fillStyle='#9c6e4c';rr(ctx,x-8,y-30,16,30,5);ctx.fill();
    [[0,96,'#3f8f5a'],[40,78,'#4a9c63'],[78,58,'#57aa6e']].forEach(([o,w,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-w/2,y-24-o);ctx.quadraticCurveTo(x,y-14-o,x+w/2,y-24-o);ctx.lineTo(x,y-90-o);ctx.closePath();ctx.fill()});
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(x,y-168);ctx.lineTo(x-10,y-140);ctx.lineTo(x-2,y-142);ctx.closePath();ctx.fill();return;
  }
  ctx.fillStyle='#a0714f';rr(ctx,x-9,y-46,18,46,6);ctx.fill();
  ctx.fillStyle=t.c1;circ(ctx,x-28,y-64,32);circ(ctx,x+28,y-64,32);circ(ctx,x,y-94,44);
  ctx.fillStyle=t.c2;circ(ctx,x-14,y-108,14);circ(ctx,x+26,y-74,9);
  if(t.fruit&&t.has){ctx.fillStyle=t.fruit;[[-30,-62],[22,-78],[-4,-104],[34,-56],[8,-84],[-18,-90]].forEach(([a,b])=>{circ(ctx,x+a,y+b,6.5);})
    ctx.fillStyle='rgba(255,255,255,.6)';[[-30,-62],[22,-78],[-4,-104],[34,-56],[8,-84],[-18,-90]].forEach(([a,b])=>circ(ctx,x+a-2,y+b-2,1.8))}
}
function drawTent(){
  if(state.home){drawMyHouse();return}
  const {x,y}=tent;
  ctx.fillStyle='rgba(0,0,0,.13)';ell(ctx,x,y,90,15);
  ctx.fillStyle='#ffb36b';ctx.beginPath();ctx.moveTo(x-80,y);ctx.quadraticCurveTo(x-40,y-50,x,y-112);ctx.quadraticCurveTo(x+40,y-50,x+80,y);ctx.closePath();ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='#ff9a52';for(let i=-80;i<80;i+=32)ctx.fillRect(x+i,y-115,16,115);ctx.restore();
  ctx.fillStyle='#7a4b2a';ctx.beginPath();ctx.moveTo(x-26,y);ctx.quadraticCurveTo(x-10,y-34,x,y-62);ctx.quadraticCurveTo(x+10,y-34,x+26,y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd3a3';ctx.beginPath();ctx.moveTo(x,y-62);ctx.quadraticCurveTo(x+12,y-30,x+26,y);ctx.lineTo(x+42,y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8e6440';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-110);ctx.lineTo(x,y-140);ctx.stroke();
  ctx.fillStyle='#ff6f91';ctx.beginPath();ctx.moveTo(x,y-140);ctx.lineTo(x+22+Math.sin(time*4)*3,y-133);ctx.lineTo(x,y-126);ctx.fill();
  ctx.font='16px Jua, sans-serif';ctx.textAlign='center';const label=state.name+'의 텐트',tw=ctx.measureText(label).width+16;
  ctx.fillStyle='rgba(255,248,236,.92)';rr(ctx,x-tw/2,y+10,tw,22,11);ctx.fill();ctx.fillStyle='#4a3b32';ctx.fillText(label,x,y+26);
}
function drawFire(){
  const {x,y}=fire;
  ctx.fillStyle='#b8b2a8';for(let i=0;i<7;i++){const a=i/7*TAU;ell(ctx,x+Math.cos(a)*18,y+Math.sin(a)*8,6,4.5)}
  ctx.fillStyle='#8e6440';ctx.save();ctx.translate(x,y-3);ctx.rotate(.4);rr(ctx,-14,-3,28,6,3);ctx.fill();ctx.rotate(-.8);rr(ctx,-14,-3,28,6,3);ctx.fill();ctx.restore();
  if(time>=fireUntil)return;
  const f=1+Math.sin(time*12)*.08+Math.sin(time*7)*.06;
  ctx.fillStyle='#ff8c42';ell(ctx,x,y-15*f,9,15*f);ctx.fillStyle='#ffd166';ell(ctx,x,y-10*f,5,9*f);
}
function drawFountain(){
  const {x,y}=fountain;
  ctx.fillStyle='rgba(0,0,0,.1)';ell(ctx,x,y+6,56,26);
  ctx.fillStyle='#cfc9bf';ell(ctx,x,y,54,27);ctx.fillStyle='#8fd3f4';ell(ctx,x,y-3,44,20);
  ctx.fillStyle='#cfc9bf';rr(ctx,x-7,y-42,14,40,5);ctx.fill();ctx.fillStyle='#8fd3f4';ell(ctx,x,y-43,15,6);
  ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<10;i++){const p=(time*.9+i/10)%1,a=i/10*TAU;circ(ctx,x+Math.cos(a)*32*p,y-43-60*p+90*p*p+Math.sin(a)*12*p,2.2)}
}
function drawSign(l){
  ctx.fillStyle='#a0714f';ctx.fillRect(l.x-2,l.y-34,4,34);
  ctx.fillStyle='#f6e3c0';ctx.strokeStyle='#d8b98a';ctx.lineWidth=2;rr(ctx,l.x-32,l.y-56,64,24,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#4a3b32';ctx.font='13px Jua, sans-serif';ctx.textAlign='center';ctx.fillText('🚧 공사 예정',l.x,l.y-39);
}

function render(){
  const w=innerWidth,h=innerHeight;
  zoom=Math.max(.85,Math.min(1.5,Math.min(w,h)/560));
  const vw=w/zoom,vh=h/zoom;
  const SW=W-XMIN,SH=H-YMIN;cam.x=vw>=SW?XMIN+(SW-vw)/2:Math.max(XMIN,Math.min(W-vw,P.x-vw/2));
  cam.y=vh>=SH?YMIN+(SH-vh)/2:Math.max(YMIN,Math.min(H-vh,P.y-50-vh/2));
  vx0=cam.x;vx1=cam.x+vw;vy0=cam.y;vy1=cam.y+vh;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#7fbf6a';ctx.fillRect(0,0,w,h);
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,-cam.x*dpr*zoom,-cam.y*dpr*zoom);
  drawGround();drawMountain();drawRoads();drawTerrainGround();drawMudFx();drawMud2();drawMud3();drawShrooms();
  const items=[];
  trees.forEach(t=>{if(vis(t.x,t.y,120))items.push([t.y,()=>drawTree(t)])});
  if(vis(tent.x,tent.y,180)){items.push([tent.y,drawTent]);items.push([fire.y,drawFire])}
  if(vis(fountain.x,fountain.y,100))items.push([fountain.y+27,drawFountain]);
  lots.forEach(l=>{if(!lotBuilt(l)&&vis(l.x,l.y,80))items.push([l.y,()=>drawSign(l)])});
  drawExtras(items);drawTown(items);drawTerrain(items);drawFest(items);const mg=onMud(P.x,P.y);
  const S=1.15,blink=(time%3.5)<.12;
  items.push([P.y,()=>{
    drawPlayer(S,blink,mg);
    ctx.font='14px Jua, sans-serif';ctx.textAlign='center';const tw=ctx.measureText(state.name).width+14;
    ctx.fillStyle='rgba(255,248,236,.9)';rr(ctx,P.x-tw/2,P.y-122,tw,20,10);ctx.fill();
    ctx.fillStyle='#4a3b32';ctx.fillText(state.name,P.x,P.y-107);
  }]);
  items.sort((a,b)=>a[0]-b[0]).forEach(i=>i[1]());
  if(state.sleeping){ctx.textAlign='center';for(let i=0;i<3;i++){const p=(time*.5+i/3)%1;ctx.globalAlpha=1-p;ctx.fillStyle='#6b7bd6';ctx.font=`${16+p*12}px Jua, sans-serif`;ctx.fillText('Z',P.x+30+p*20,P.y-95-p*45)}ctx.globalAlpha=1}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(state.sleeping){ctx.fillStyle='rgba(30,40,90,.35)';ctx.fillRect(0,0,w,h)}
  if(joy&&!state.sleeping){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),k=d>55?55/d:1;
    ctx.fillStyle='rgba(255,255,255,.35)';circ(ctx,joy.ox,joy.oy,55);
    ctx.fillStyle='rgba(255,255,255,.85)';circ(ctx,joy.ox+dx*k,joy.oy+dy*k,24)}
}

function renderPreview(){
  const w=pv.width,h=pv.height;pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,w,h);
  drawChar(pctx,w/2,h*.88,(h/300)*2.6,draft,time,1,false,(time%3.5)<.12,false);
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;
  try{Snd.track(mode==='creator'?'room':state.sleeping?'night':scene==='village'?'village':'room');if(mode==='creator')renderPreview();else if(mode==='village'){update(dt);scene==='village'?(render(),drawFestOverlay(),drawPlayOverlay(),drawTouchMarker()):(renderRoom(),drawTouchMarker());drawMini()}}catch(e){console.error(e)}
}
resize();
loadWorld();showWho();
requestAnimationFrame(loop);
</script>
